<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>MLBカード生成ツール</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(ellipse at center, #1e0a3c 0%, #12001e 70%);
    min-height: 100vh;
    font-family: 'MS Gothic', 'Yu Gothic', 'Hiragino Kaku Gothic Pro', sans-serif;
    color: #fff;
    padding: 40px 20px;
  }
  .app-wrap { max-width: 920px; margin: 0 auto; }
  .app-title {
    text-align: center;
    font-size: 26px;
    font-weight: 900;
    color: #ffd700;
    text-shadow: 2px 2px 0 #000, 0 0 20px #ffd70066;
    margin-bottom: 6px;
    letter-spacing: 4px;
  }
  .app-sub { text-align: center; font-size: 12px; color: #8898b0; margin-bottom: 28px; letter-spacing: 1px; }

  /* ── メイン入力パネル ── */
  .input-panel {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 22px 26px;
    margin-bottom: 12px;
    display: flex;
    gap: 18px;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  .input-group { flex: 1; min-width: 200px; }
  .input-label {
    display: block;
    font-size: 11px;
    color: #88aac8;
    margin-bottom: 8px;
    letter-spacing: 2px;
    font-weight: 900;
  }
  input[type="file"] {
    display: block;
    width: 100%;
    padding: 9px 12px;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 7px;
    color: #ccc;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
  }
  input[type="file"]::file-selector-button {
    background: rgba(80,50,0,0.9);
    color: #ffd700;
    border: 1px solid #ffd70066;
    border-radius: 4px;
    padding: 3px 10px;
    cursor: pointer;
    font-size: 11px;
    margin-right: 8px;
    font-family: inherit;
  }
  .btn-generate {
    flex-shrink: 0;
    padding: 13px 36px;
    background: linear-gradient(135deg, #b07800, #f5c518, #b07800);
    color: #1a0c00;
    border: none;
    border-radius: 9px;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 4px;
    cursor: pointer;
    box-shadow: 0 4px 20px #ffd70033;
    transition: transform 0.15s, box-shadow 0.15s;
    font-family: inherit;
  }
  .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 6px 28px #ffd70055; }
  .btn-generate:active { transform: translateY(0); }

  /* ── 年代選択パネル ── */
  #year-selector-section {
    background: rgba(255,215,0,0.06);
    border: 1px solid rgba(255,215,0,0.20);
    border-radius: 12px;
    padding: 16px 26px;
    margin-bottom: 12px;
    display: none;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  #year-selector-section .input-group { flex: 0 0 auto; min-width: 160px; }
  select#year-select {
    display: block;
    width: 100%;
    padding: 9px 12px;
    background: rgba(0,0,0,0.50);
    border: 1px solid #ffd70055;
    border-radius: 7px;
    color: #ffd700;
    font-size: 14px;
    font-weight: 900;
    cursor: pointer;
    font-family: inherit;
    appearance: auto;
  }
  select#year-select option { background: #1a1000; color: #fff; }
  #year-info {
    flex: 1;
    font-size: 12px;
    color: #aabbd0;
    line-height: 1.7;
    min-width: 180px;
  }
  #year-info .peak-tag {
    display: inline-block;
    background: rgba(180,0,50,0.50);
    border: 1px solid #ff4477;
    border-radius: 4px;
    padding: 1px 7px;
    color: #ff8899;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 1px;
    margin-left: 5px;
  }

  /* ── MLB 選手検索パネル ── */
  #mlb-search-section {
    background: rgba(0,80,160,0.10);
    border: 1px solid rgba(100,180,255,0.22);
    border-radius: 12px;
    padding: 14px 22px 16px;
    margin-bottom: 12px;
  }
  #mlb-search-section .input-label { color: #88bbee; }
  .mlb-search-row {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  #mlb-search-input {
    flex: 1;
    padding: 8px 12px;
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(100,180,255,0.30);
    border-radius: 7px;
    color: #cce4ff;
    font-size: 13px;
    font-family: inherit;
  }
  #mlb-search-input:focus { outline: none; border-color: #4499ff88; }
  .btn-mlb-search {
    padding: 8px 18px;
    background: rgba(0,60,130,0.85);
    color: #88ccff;
    border: 1px solid #3388ff66;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 2px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .btn-mlb-search:hover { background: rgba(0,80,170,0.90); color: #aaddff; }
  .btn-mlb-search:disabled { opacity: 0.5; cursor: default; }
  #mlb-search-results {
    margin-top: 8px;
    max-height: 200px;
    overflow-y: auto;
    border-radius: 7px;
    border: 1px solid transparent;
  }
  #mlb-search-results:not(:empty) { border-color: rgba(100,180,255,0.20); }
  .mlb-result-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    transition: background 0.12s;
  }
  .mlb-result-item:last-child { border-bottom: none; }
  .mlb-result-item:hover { background: rgba(0,80,160,0.35); }
  .mlb-result-thumb {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
    background: #1a2a3a;
    border: 1px solid rgba(100,180,255,0.30);
    flex-shrink: 0;
  }
  .mlb-result-name { color: #cce4ff; font-size: 13px; font-weight: 900; letter-spacing: 1px; }
  .mlb-result-sub  { color: #6699bb; font-size: 11px; margin-top: 2px; }
  /* 選択済み選手表示 */
  #mlb-selected-player {
    margin-top: 10px;
    padding: 10px 14px;
    background: rgba(0,60,120,0.40);
    border: 1px solid #3388ff55;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #mlb-selected-photo {
    width: 52px;
    height: 52px;
    border-radius: 8px;
    object-fit: cover;
    background: #0a1828;
    border: 2px solid #4488ff55;
    flex-shrink: 0;
  }
  .mlb-selected-info { flex: 1; min-width: 0; }
  .mlb-selected-name { color: #aaddff; font-size: 15px; font-weight: 900; letter-spacing: 2px; }
  .mlb-selected-meta { color: #5599bb; font-size: 11px; margin-top: 3px; }
  .btn-mlb-clear {
    padding: 5px 12px;
    background: rgba(80,0,0,0.70);
    color: #ff8888;
    border: 1px solid #ff444455;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 900;
    cursor: pointer;
    font-family: inherit;
    flex-shrink: 0;
  }
  .btn-mlb-clear:hover { background: rgba(120,0,0,0.80); }

  /* ── エラーボックス ── */
  #error-box {
    background: rgba(180,0,0,0.3);
    border: 1px solid #ff5555;
    border-radius: 8px;
    padding: 11px 16px;
    margin-bottom: 16px;
    color: #ffaaaa;
    font-size: 13px;
    display: none;
  }

  /* ── カード表示エリア ── */
  #card-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 10px;
    gap: 14px;
  }
  #card-root {
    display: flex;
    justify-content: center;
    font-family: 'MS Gothic', 'Yu Gothic', 'Hiragino Kaku Gothic Pro', sans-serif;
  }
  /* ── 保存ボタンエリア ── */
  #save-area {
    display: none;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn-save {
    padding: 10px 28px;
    background: linear-gradient(135deg, #1a3a6a, #2a5aaa, #1a3a6a);
    color: #aaccff;
    border: 1px solid #4488ff88;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 3px;
    cursor: pointer;
    box-shadow: 0 3px 14px #0044aa44;
    transition: transform 0.12s, box-shadow 0.12s;
    font-family: inherit;
  }
  .btn-save:hover { transform: translateY(-2px); box-shadow: 0 5px 20px #0066cc55; color: #ddeeff; }
  .btn-save:active { transform: translateY(0); }
  #save-msg { font-size: 12px; color: #77cc88; font-weight: 900; letter-spacing: 1px; }

  /* ── カードフリップ（機構のみ） ── */
  .card-flip-scene { perspective: 1400px; }
  .card-flip-inner {
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.65s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .card-flip-inner.flipped { transform: rotateY(180deg); }
  .card-face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .card-back-face {
    transform: rotateY(180deg);
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
  }
</style>
</head>
<body>
<div class="app-wrap">
  <h1 class="app-title">⚾ MLBカード生成ツール</h1>
  <p class="app-sub">投手・野手・捕手のエクセルデータ＋選手写真を読み込み、データカードを自動生成</p>

  <!-- メイン入力 -->
  <div class="input-panel">
    <div class="input-group">
      <label class="input-label">📊 エクセルデータ (.xlsx)</label>
      <input type="file" id="excel-file" accept=".xlsx,.xls" onchange="onExcelChange(this)">
    </div>
    <div class="input-group">
      <label class="input-label">📷 選手写真（省略可）</label>
      <input type="file" id="photo-file" accept="image/*">
    </div>
    <button class="btn-generate" onclick="generateCard()">カード生成</button>
  </div>

  <!-- MLB 選手検索パネル（省略可） -->
  <div id="mlb-search-section">
    <div class="input-group">
      <label class="input-label">🔍 MLB選手検索（省略可）— 英語名・顔写真・列伝強化に使用</label>
      <div class="mlb-search-row">
        <input id="mlb-search-input" type="text"
               placeholder="例: Dylan Cease / Shohei Ohtani"
               onkeydown="if(event.key==='Enter') mlbSearch()">
        <button class="btn-mlb-search" id="mlb-search-btn" onclick="mlbSearch()">🔍 検索</button>
      </div>
    </div>
    <div id="mlb-search-results"></div>
    <div id="mlb-selected-player" style="display:none;">
      <img id="mlb-selected-photo" src="" alt="">
      <div class="mlb-selected-info">
        <div class="mlb-selected-name" id="mlb-selected-name-label"></div>
        <div class="mlb-selected-meta" id="mlb-selected-meta-label"></div>
      </div>
      <button class="btn-mlb-clear" onclick="clearMlbSelection()">✕ 選択解除</button>
    </div>
  </div>

  <!-- Baseball-Reference ID（Excel読込後に表示） -->
  <div id="bref-section" style="display:none; margin-bottom:10px;">
    <div class="input-group">
      <label class="input-label">📚 Baseball-Reference ID（省略可）— WAR・FIP取得に使用</label>
      <div class="mlb-search-row">
        <input id="bref-id-input" type="text"
               placeholder="例: suzukic01 / willide03（URLの末尾部分）"
               style="flex:1;"
               oninput="onBrefIdInput(this.value)">
        <button class="btn-mlb-search" onclick="loadBRefData()">📥 取得</button>
      </div>
      <div id="bref-status" style="font-size:11px;color:#88aac8;margin-top:4px;"></div>

      <!-- BRef取得失敗時：ペースト方式でWARデータ取得 -->
      <div id="war-manual-section" style="margin-top:8px;display:none;
           background:#1a2535;border:1px solid #446;border-radius:6px;padding:8px;">
        <div style="color:#ffaa44;font-size:11px;font-weight:bold;margin-bottom:6px;">
          ⚠️ 自動取得できません（ローカルファイル制限） — 下記の手順でWARデータを取得できます
        </div>
        <!-- ① BRefページを開く -->
        <div style="font-size:11px;color:#aaccee;margin-bottom:4px;">
          ① BRef ページを開いてください：
          <button onclick="openBRefPage()" style="
            margin-left:6px;padding:2px 10px;font-size:11px;
            background:#224466;color:#aaddff;border:1px solid #446688;
            border-radius:4px;cursor:pointer;">
            🔗 BRefページを新タブで開く
          </button>
        </div>
        <!-- ② コピー手順 -->
        <div style="font-size:11px;color:#aaccee;margin-bottom:4px;">
          ② 開いたページで
          <kbd style="background:#333;padding:1px 4px;border-radius:3px;">Ctrl+A</kbd>（全選択）→
          <kbd style="background:#333;padding:1px 4px;border-radius:3px;">Ctrl+C</kbd>（コピー）
        </div>
        <!-- ③ 貼り付けエリア -->
        <div style="font-size:11px;color:#aaccee;margin-bottom:4px;">
          ③ 下のエリアをクリックして
          <kbd style="background:#333;padding:1px 4px;border-radius:3px;">Ctrl+V</kbd>（貼り付け）：
        </div>
        <textarea id="bref-paste-area"
                  placeholder="ここにCtrl+Vで貼り付け（BRefページのHTML/テキストを自動解析します）"
                  style="width:100%;height:55px;box-sizing:border-box;
                         font-size:10px;color:#99bbdd;background:#0e1a28;
                         border:1px dashed #446;border-radius:4px;
                         padding:5px;resize:vertical;"></textarea>
        <div id="bref-paste-status" style="font-size:10px;margin-top:3px;"></div>

        <!-- 代替：年:WAR手動入力 -->
        <details style="margin-top:6px;">
          <summary style="font-size:10px;color:#888;cursor:pointer;">
            または WAR値を直接入力する（BRefで値を確認して入力）
          </summary>
          <div style="margin-top:4px;">
            <div style="font-size:10px;color:#888;margin-bottom:3px;">
              書式: <code style="color:#adf">2005:3.2, 2006:2.1, 2007:1.8</code>
            </div>
            <div class="mlb-search-row">
              <input id="war-manual-input" type="text"
                     placeholder="例: 2005:3.2, 2006:2.1"
                     style="flex:1;font-size:11px;">
              <button class="btn-mlb-search" style="font-size:11px;"
                      onclick="applyWarManual()">✅ 適用</button>
            </div>
            <div id="war-manual-status" style="font-size:10px;color:#77cc88;margin-top:3px;"></div>
          </div>
        </details>
      </div>
    </div>
  </div>

  <!-- 年代選択パネル（Excel読込後に表示） -->
  <div id="year-selector-section">
    <div class="input-group">
      <label class="input-label">📅 生成する年代</label>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:nowrap;">
        <select id="year-select" onchange="onYearChange()" style="flex:0 0 auto;width:auto;"></select>
        <button class="btn-generate" id="btn-gen-year" onclick="generateCard()" style="flex-shrink:0;margin:0;padding:10px 20px;font-size:13px;white-space:nowrap;">カード生成</button>
      </div>
    </div>
    <div id="year-info"></div>
  </div>

  <div id="error-box"></div>

  <!-- 保存ボタン（カード生成後に表示） -->
  <div id="save-area">
    <button class="btn-save" onclick="saveCardAsHTML()">💾 HTMLとして保存</button>
    <span id="save-msg"></span>
  </div>

  <div id="card-area"></div>
</div>


<script>
// ===== グローバル状態 =====
let g_rows     = null;   // Excel全行データ
let g_headers  = null;   // ヘッダー行（rows[0], rows[1]）
let g_dataRows = null;   // データ行（rows[2]以降）
let g_peakYear = null;   // 自動検出ピーク年
let g_isPitcher  = false;
let g_isCatcher  = false;
let g_careerWAR  = null;   // 通算行専用：加重平均WAR（_doGenerateで事前計算）
let g_careerTeam = null;   // 通算行専用：キャリア最多試合チーム（_doGenerateで事前計算）
let g_lastAwardsJa      = [];   // 直近カードのawardsJa（通算バナー再描画用）
let g_lastIsCareer      = false; // 直近カードが通算行かどうか
let g_baseOverallScore  = 0;    // タイトル加点前の基本総合力
let g_currentTheme      = null; // 現在のカードテーマ（タイトル加点でランクアップした際も最新を保持）
let g_genId             = 0;   // カード生成のたびにインクリメント（非同期汚染防止）
let g_selectedRow       = null; // 最後に生成したデータ行（テーマ再適用用）
let g_resolvedPhotoUrl  = '';   // 最後に使った写真URL（テーマ再適用用）
let g_isPeakRow         = false; // ピーク年フラグ（テーマ再適用用）
let g_lastCardExtras    = null; // 最後のupdateCardExtrasパラメータ（テーマ再適用用）
let g_lastRetsuden      = '';   // 最後の列伝テキスト（テーマ再適用用）
let g_wikiCharacteristics = null; // Wikipedia「選手としての特徴」セクション解析結果
let _careerRetsudenRebuildParams = null; // 通算列伝の再構築用パラメータ（CareerRankAPI完了後に率系順位を更新）

// MLB.com 連携（省略可）
let g_mlbId       = null;   // MLB選手ID
let g_mlbNameEn   = null;   // 英語正式名称 (例: "Dylan Cease")
let g_mlbHeadshot = null;   // ヘッドショット画像URL
let g_mlbHeadshotOk = null; // true=読み込み成功 / false=失敗 / null=未確認
let g_mlbHasRealPhoto = null; // true=実写真あり / false=シルエットのみ / null=未確認
let g_mlbPos      = null;   // ポジション略称
let g_mlbTeam     = null;   // 現所属チーム名
let g_pitchHand   = null;   // 投球腕: 'R'=右, 'L'=左
let g_batSide     = null;   // 打席: 'R'=右, 'L'=左, 'S'=両

// Baseball-Reference 連携（省略可）
let g_brefId          = null;    // BR選手ID (例: "willide03" / "suzukic01")
let g_brefFetchPromise = null;   // fetchBRefData の Promise（Wikipedia名取得のために await 可能にする）
const _brefCache    = {};   // { brefId: { "2023": { war:"3.2", fip:"2.84" }, ... } }
const _brefInFlight = new Set(); // 取得中のbrefIdを管理（重複リクエスト防止）
const _mlbYearPhotoCache = {}; // { mlbId: { cardPhotoMap, currentUrl, hasAnyPhoto, hasOnlyCurrent } }

// ── BRef 写真 直接アクセス用データ ──
// BRef写真URL: /req/{VERSION}/images/headshots/{hash[0]}/{hash}_{type}.jpg
// ハッシュはBRefの内部IDから算出（アルゴリズム非公開のため手動収集）
// バージョン番号はBRefのデプロイ時に変更される（localStorage でキャッシュ）
// BRef バージョン番号候補（YYYYMMDDsuffix 形式、デプロイ毎に変更される）
// _getActiveBRefVersion() が並列チェックで有効なものを自動検出する
const _BREF_PHOTO_VERSIONS = [
  '2025011210',   // 2025-01-12 (確認済み)
  '2025020110', '2025021510',
  '2025030110', '2025031510',
  '2025040110', '2025041510',
  '2025050110', '2025051510',
  '2025060110', '2025061510',
  '2025070110', '2025071510',
  '2025080110', '2025081510',
  '2025090110', '2025091510',
  '2025100110', '2025101510',
  '2025110110', '2025111510',
  '2025120110', '2025121510',
  '2026010110', '2026011510',
  '2026020110', '2026021510',
  '2026030110', '2026031510',
  '2026040110', '2026041510',
  '2026050110', '2026051510',
  '2026051710',
];
const _BREF_HASHES = {
  // ── 投手 ──
  'johnsra05': 'e905e1ef',  // Randy Johnson
  // 'clemero02': 'b5a2be2f',  // Roger Clemens → BRef写真より別ソースの方が良質なためスキップ
  'martipe02': 'a9ba2c91',  // Pedro Martinez
  'schilcu01': '44885ff3',  // Curt Schilling
  'maddugr01': 'd13d4022',  // Greg Maddux
  'glavito02': 'c8c1de61',  // Tom Glavine
  'smoltjo01': 'bf321b07',  // John Smoltz
  'mussimi01': 'd79f7a98',  // Mike Mussina
  'hallaro01': 'bc92edb8',  // Roy Halladay
  'linceti01': '7aa1ec7f',  // Tim Lincecum
  'riverma01': 'c0fce0c9',  // Mariano Rivera
  'sabatc.01': '47f5b9a0',  // CC Sabathia (BRef実URL)
  'sabatcc01': '47f5b9a0',  // CC Sabathia (自動生成候補形式)

/**
 * CRC32 計算（BRef ハッシュの動的生成に使用）
 * BRef のハッシュが CRC32 であれば、任意の brefId から直接ハッシュを算出できる。
 */
function _crc32(str) {
  let crc = -1;
  for (let i = 0; i < str.length; i++) {
    crc ^= str.charCodeAt(i);
    for (let j = 0; j < 8; j++) crc = (crc >>> 1) ^ (crc & 1 ? 0xEDB88320 : 0);
  }
  return ((crc ^ -1) >>> 0).toString(16).padStart(8, '0');
}

/**
 * BRef ハッシュ取得。
 * ① _BREF_HASHES テーブルに登録済みならそれを返す（確実）
 * ② 未登録の場合: 初回のみ CRC32('johnsra05') === 'e905e1ef' で自己検証し、
 *    一致すれば CRC32 で動的計算 → 任意選手に対応可能。
 *    不一致なら null（テーブル登録のみの従来動作）。
 */
let _brefUsesCrc32 = null;  // null=未検証, true=CRC32一致, false=不一致
function _getBRefHash(brefId) {
  if (_BREF_HASHES[brefId]) return _BREF_HASHES[brefId];
  if (_brefUsesCrc32 === null) {
    // 2選手の既知ハッシュで検証（両方一致で確度を高める）
    const ok = _crc32('johnsra05') === 'e905e1ef'
             && _crc32('ambrech01') === '7376a930';
    _brefUsesCrc32 = ok;
    console.log('[BRef] CRC32検証:', ok ? '✓ 全選手対応（動的計算有効）' : '✗ テーブル登録のみ有効');
  }
  return _brefUsesCrc32 ? _crc32(brefId) : null;
}

async function mlbSearch() {
  const input = document.getElementById('mlb-search-input');
  const btn   = document.getElementById('mlb-search-btn');
  const q     = (input.value || '').trim();
  if (!q) return;

  const resultsEl = document.getElementById('mlb-search-results');
  resultsEl.innerHTML = '<div style="padding:8px 12px;color:#6699bb;font-size:12px;">🔍 検索中…</div>';
  btn.disabled = true;

  try {
    // MLB Stats API は CORS 許可済のため、ブラウザから直接呼び出す（サーバー経由不要）
    const mlbUrl = 'https://statsapi.mlb.com/api/v1/people/search?names='
                 + encodeURIComponent(q) + '&sportId=1';
    const res  = await fetch(mlbUrl);
    if (!res.ok) throw new Error('MLB API エラー (HTTP ' + res.status + ')');
    const data = await res.json();

    const people = (data.people || []).slice(0, 8);
    if (people.length === 0) {
      resultsEl.innerHTML = '<div style="padding:8px 12px;color:#886644;font-size:12px;">該当選手が見つかりませんでした（英語フルネームで検索してください）</div>';
      return;
    }

    // data-* 属性を使い、特殊文字(アポストロフィ等)によるJS構文エラーを回避
    const items = people.map(p => {
      const pos   = p.primaryPosition ? p.primaryPosition.abbreviation : '';
      const team  = p.currentTeam     ? p.currentTeam.name             : '';
      const thumb = `https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:67:current.png/w_60,q_auto:best/v1/people/${p.id}/headshot/67/current`;
      const el = document.createElement('div');
      el.className = 'mlb-result-item';
      el.dataset.id   = p.id;
      el.dataset.name = p.fullName;
      el.dataset.pos  = pos;
      el.dataset.team = team;
      el.innerHTML = `
        <img class="mlb-result-thumb" src="${thumb}" alt="" onerror="this.src=''">
        <div>
          <div class="mlb-result-name">${escapeHtml(p.fullName)}</div>
          <div class="mlb-result-sub">${escapeHtml(pos)}${team ? ' · ' + escapeHtml(team) : ''}</div>
        </div>`;
      el.addEventListener('click', () =>
        mlbSelectPlayer(Number(el.dataset.id), el.dataset.name, el.dataset.pos, el.dataset.team));
      return el;
    });

    resultsEl.innerHTML = '';
    items.forEach(el => resultsEl.appendChild(el));

  } catch (e) {
    resultsEl.innerHTML = `<div style="padding:8px 12px;color:#ff8888;font-size:12px;">❌ エラー: ${escapeHtml(e.message)}</div>`;
  } finally {
    btn.disabled = false;
  }
}

async function _autoFetchBRefId(mlbId, playerName) {
  const statusEl = document.getElementById('bref-status');
  const inputEl  = document.getElementById('bref-id-input');
  if (!statusEl || !inputEl) return;

  const name = playerName || g_mlbNameEn;

  // ── Step 1: 候補ボタンを即座に表示（待ち時間ゼロ）──
  // プロキシ検索を待たずに名前から生成した候補を先に出す
  if (name) {
    const candidates = _genBRefCandidates(name);
    if (candidates.length > 0) {
      statusEl.style.color = '#ffd700';
      statusEl.textContent = '⏳ MLB API で確認中…（候補ボタンからも選択できます）';
      _renderBRefCandidates(candidates, statusEl, inputEl);
    }
  }

  // ── Step 2: MLB Stats API xrefIds で正確なIDを取得（バックグラウンド）──
  let brefId = null;
  try {
    const url = `https://statsapi.mlb.com/api/v1/people/${mlbId}?hydrate=xrefIds`;
    const res = await fetch(url, { signal: AbortSignal.timeout(7000) });
    if (res.ok) {
      const data = await res.json();
      const xrefs = data?.people?.[0]?.xrefIds ?? [];
      console.log('[BRef AutoID] xrefIds:', JSON.stringify(xrefs));
      const brefEntry = xrefs.find(x => {
        const t = String(x.xrefIdType ?? '').toLowerCase();
        return t.includes('bref') || t.includes('bbref') || t === 'br' || t.includes('baseball');
      });
      if (brefEntry?.xrefId) brefId = String(brefEntry.xrefId).trim();
    }
  } catch (e) { console.warn('[BRef AutoID] MLB API:', e.message); }

  if (!brefId) {
    // MLB APIでIDが取得できなかった → 候補ボタンが既に表示済みなのでそのまま
    statusEl.style.color = '#aaccee';
    statusEl.textContent = 'BR ID 候補:（上のボタンから選択してください）';
    // 候補ボタンを再描画（ステータステキストで上書きされていた場合に備えて）
    if (name) {
      const candidates = _genBRefCandidates(name);
      if (candidates.length > 0) _renderBRefCandidates(candidates, statusEl, inputEl);
    }
    return;
  }

  // ── Step 3: MLB API で取得成功 → 自動選択 ──
  _applyBRefId(brefId, inputEl, statusEl);
}

/**
 * 複数CORSプロキシを並列に試し、最初に成功したHTMLを返す共通ヘルパー
 *
 * 優先順位の考え方:
 *  1. Wayback Machine (archive.org) — CORS完全許可、BRefのCloudFlare制限を回避
 *     ※BRefの過去キャッシュを取得するため、最新スタッツではなく直近アーカイブを使用
 *  2. allorigins.win/get — JSON包装形式。localファイル(origin:null)でもCORS通過しやすい
 *  3. codetabs.com — fallback
 *  4. allorigins.win/raw — 最終手段（origin:nullでブロックされる場合あり）
 *
 *  ※ corsproxy.io / corsproxy.org は origin:null + BRef CloudFlare 両方でブロックされるため除外
 */
/**
 * @param {string}  targetUrl
 * @param {string}  label       ログ識別名
 * @param {boolean} useWayback  true=Wayback Machineを使う（静的ページのみ有効、動的URLはfalse）
 */
async function _fetchViaProxy(targetUrl, label, _unused = true) {
  // ※ archive.org（Wayback Machine）はローカルファイル(origin:null)でCORSブロックされるため使用不可
  const enc = encodeURIComponent(targetUrl);
  const proxies = [
    { url: `https://api.allorigins.win/get?url=${enc}`,      wrap: true  },
    { url: `https://api.codetabs.com/v1/proxy?quest=${enc}`, wrap: false },
    { url: `https://api.allorigins.win/raw?url=${enc}`,      wrap: false },
  ];
  const isCF = (html) =>
    /Just a moment|cf-browser-verification|Enable JavaScript and cookies to continue|<title>Attention Required/i.test(html);
  // archive.orgが挿入するツールバーマーカー（正常なアーカイブコンテンツ、CF判定除外）
  const isWaybackPage = (html) => /BEGIN WAYBACK TOOLBAR|web\.archive\.org\/web\//i.test(html);

  // 全プロキシを並列実行し、最初に成功したものを採用（速度優先）
  const text = await Promise.any(proxies.map(async proxy => {
    const res = await fetch(proxy.url, { signal: AbortSignal.timeout(12000) });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const candidate = proxy.wrap
      ? ((await res.json())?.contents ?? null)
      : await res.text();
    if (!candidate) throw new Error('empty');
    // Waybackページ自体はCFチェック不要（正常なアーカイブコンテンツ）
    if (!isWaybackPage(candidate) && isCF(candidate)) throw new Error('CloudFlare challenge');
    console.log(`[${label}] プロキシ成功: ${proxy.url}`);
    return candidate;
  })).catch(err => { console.warn(`[${label}] 全プロキシ失敗:`, err); return null; });

  return text;
}

async function _searchBRefIdByName(name) {
  const searchUrl = `https://www.baseball-reference.com/search/search.fcgi?search=${encodeURIComponent(name)}`;
  // 検索URLは動的ページのためWaybackはスキップ（false）
  const text = await _fetchViaProxy(searchUrl, 'BRef Search', false);
  if (!text) throw new Error('全プロキシ失敗');
  const found = [];
  const re = /\/players\/[a-z]\/([a-z0-9]+)\.shtml/g;
  let m;
  while ((m = re.exec(text)) !== null) {
    if (!found.includes(m[1])) found.push(m[1]);
  }
  console.log('[BRef AutoID] BR search candidates:', found);
  if (found.length > 0) {
    const parts = name.trim().split(/\s+/);
    const lastInitial = parts.length >= 2 ? parts[parts.length - 1][0].toLowerCase() : '';
    const filtered = found.filter(id => !lastInitial || id[0] === lastInitial);
    const pool = filtered.length > 0 ? filtered : found;

    // 名前から生成した候補（例: youngmi01, youngmi02, ...）と照合し、
    // 若番（01→02→…）を優先して返す。
    // BRef検索結果の順序に依存せず、youngmi02より youngmi01 を優先する。
    const genCandidates = _genBRefCandidates(name);
    for (const cand of genCandidates) {
      if (pool.includes(cand)) {
        console.log('[BRef AutoID] 生成候補と一致:', cand);
        return cand;
      }
    }
    // 生成候補になければ検索結果の最初を使用
    return pool[0];
  }
  return null;
}

function _genBRefCandidates(name) {
  const parts = name.trim().split(/\s+/);
  if (parts.length < 2) return [];
  const last  = parts[parts.length - 1].toLowerCase().replace(/[^a-z]/g, '');
  const first = parts[0].toLowerCase().replace(/[^a-z]/g, '');
  const prefix = last.slice(0, 5) + first.slice(0, 2);
  return ['01','02','03','04','05'].map(n => prefix + n);
}

}

function fmtWAR(v) {
  if (v === null || v === undefined || v === '--' || v === '') return '--';
  const s = String(v).trim();
  const num = parseFloat(s.replace('~', ''));
  if (isNaN(num)) return s;
  return num.toFixed(1);
}
function fmtRate(v) {
  if (v === null || v === undefined || v === '--') return '--';
  const s = String(v).trim();
  if (/^\d{3}$/.test(s)) return '.' + s;
  return s;
}
function fmtOPS(v) {
  if (v === null || v === undefined || v === '--' || v === '') return '--';
  const s = String(v).trim();
  // 4桁整数（例: 1379 → "1.379"）
  if (/^1\d{3}$/.test(s)) return s[0] + '.' + s.slice(1);
  // 3桁整数（例: 750 → ".750"）
  if (/^\d{3}$/.test(s)) return '.' + s;
  // 小数点始まり（例: ".750" → そのまま）
  if (s.startsWith('.')) return s;
  // "0.750" 形式 → ".750"
  if (/^0\./.test(s)) return s.slice(1);
  return s;
}
function fmtPct(v) {
  if (v === null || v === undefined) return '--';
  return v + '%';
}
function safeNum(v) {
  if (v === null || v === undefined || v === '--' || v === '') return null;
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
}
/**
 * 盗塁（SB）の値を取得する。
 * ヘッダー行で 'SB' / '盗塁' / '盗塁数' を検索し、
 * 見つからない場合は row[11]（旧デフォルト）を返す。
 * headerRow を省略した場合はグローバル g_headers を使用。
 */
function getSB(row, headerRow) {
  const hdr = headerRow || (g_headers && g_headers[0]);
  if (hdr) {
    for (const name of ['SB', '盗塁', '盗塁数', 'Stolen Bases']) {
      const idx = findColIdx(hdr, name);
      if (idx >= 0) return parseInt(row[idx]) || 0;
    }
  }
  return parseInt(row[11]) || 0;
}

/** ヘッダー行（配列）から列名（大小文字不問）を検索してインデックスを返す。見つからない場合は -1 */
function findColIdx(headerRow, name) {
  if (!headerRow) return -1;
  const target = name.trim().toUpperCase();
  return headerRow.findIndex(h => String(h ?? '').trim().toUpperCase() === target);
}
/** 行データとヘッダー行から列名でセル値を取得。なければ fallback */
function getColVal(row, headerRow, name, fallback = '--') {
  const idx = findColIdx(headerRow, name);
  if (idx < 0) return fallback;
  const v = row[idx];
  return (v === null || v === undefined || v === '') ? fallback : v;
}

 * BK列(0-indexed=62)以降は出場ポジション分だけ動的に並ぶ「補正済み最終DRS」セクション。
 * 1行目ヘッダーは「守備」（先頭列のみ表示、以降は結合セル）、
 * 2行目ヘッダーに各列のポジション名（"C","1B","2B","3B","SS","LF","CF","RF"）が入る。
 *
 * 例：
 *   Ozスミス → BK列(index 62)に "SS" の補正DRSのみ
 *   Aaジャッジ → BK="RF" / BL="CF" / BM="LF" の3列（複数ポジション）
 *
 * 該当するポジションラベルが見つからない（修正値が未登録）の場合は元のDRS値を返す。
 *
 * @param {Array} row     データ行
 * @param {number} posIdx ポジションインデックス（0=C,1=1B,2=2B,3=3B,4=SS,5=LF,6=CF,7=RF）
 * @param {number} origDrs 元のDRS値（フォールバック用）
 * @returns {number}
 */
function _getCorrectedDrs(row, posIdx, origDrs) {
  const posLabels = ['C','1B','2B','3B','SS','LF','CF','RF'];
  const targetPos = posLabels[posIdx];
  if (!targetPos) return origDrs;
  const v = _lookupCorrectedDrs(row, targetPos);
  return (v !== null) ? v : origDrs;
}

/**
 * BK列(index 62)以降の補正DRSセクションから、指定ポジションの補正DRS値を返す。
 *   - 2行目ヘッダーにポジション名が一致し、かつ値が数値 → その数値
 *   - 一致するが値が空（守備判定対象外）→ null
 *   - 一致するヘッダーが無い → null
 * @returns {number|null}
 */
function _lookupCorrectedDrs(row, posLabel) {
  const hdrRow2 = (g_headers && g_headers[1]) ? g_headers[1] : null;
  if (!hdrRow2) return null;
  for (let i = 62; i < hdrRow2.length; i++) {
    const label = String(hdrRow2[i] ?? '').trim();
    if (label === posLabel) return safeNum(row[i]); // 値が空なら null
  }
  return null;
}

/**
 * 補正DRSセクション（BK列以降にポジション名ヘッダー）が存在するか判定。
 * 存在する場合、補正値が入っていないポジションは「守備判定対象外」として扱う。
 * @returns {boolean}
 */
function _hasCorrectedDrsSection() {
  const hdrRow2 = (g_headers && g_headers[1]) ? g_headers[1] : null;
  if (!hdrRow2) return false;
  for (let i = 62; i < hdrRow2.length; i++) {
    if (String(hdrRow2[i] ?? '').trim()) return true;
  }
  return false;
}

/**
 * 野手の試合数を取得する。
 * 野手エクセルの列構成は 列3=試合 / 列6=安打 のため、固定 row[6] では安打を誤取得する。
 * ヘッダー名（「試合」「G」等）で正しい列を検索し、無ければ列3にフォールバックする。
 * @param {Array} row データ行
 * @param {Array} [headerRow] ヘッダー行（省略時 g_headers[0]）
 * @returns {number}
 */
function getHitterGames(row, headerRow) {
  const hdr = headerRow || (g_headers && g_headers[0]);
  if (hdr) {
    for (const name of ['試合', '試合数', 'G', 'Games', 'GP']) {
      const idx = findColIdx(hdr, name);
      if (idx >= 0) {
        const v = parseInt(row[idx]);
        if (!isNaN(v)) return v;
      }
    }
  }
  // フォールバック：野手エクセルでは列3（D列）が試合
  return parseInt(row[3]) || 0;
}

// ===== WAR 推定ロジック（スプレッドシートに WAR 列がない場合のフォールバック） =====
/**
 * 野手 WAR 推定（bWAR 近似）
 *   battingWAR  = (OPS − リーグ平均 0.728) × 15 × 出場比率
 *   fieldingWAR = 全ポジション合計 DRS ÷ 10
 *   bsrWAR      = SB ÷ 20 × 出場比率
 *   replWAR     = 2.0 × 出場比率  （代替選手基準）
 * 推定値は "~X.X" 形式で表示（実測値と区別）
 */
function estimateHitterWAR(row) {
  const ops    = parseFloat(fmtOPS(row[17]));
  const rawG   = getHitterGames(row);
  const games  = (!isNaN(rawG) && rawG >= 1 && rawG <= 162) ? rawG : 150;
  const sb     = getSB(row);
  if (!ops || isNaN(ops) || ops <= 0) return null;

  const ptRatio = Math.min(games, 162) / 162;

  // 打撃貢献
  const battingWAR = (ops - 0.728) * 15 * ptRatio;

  // 守備貢献（DRS ÷ 10 ≈ WAR）
  // ※ 外野3ポジションはBK列以降の修正DRS値を優先使用
  let totalDrs = 0, totalInn = 0;
  for (let i = 0; i < 8; i++) {
    const inn = parseFloat(row[28 + i * 2]) || 0;
    const drs = _getCorrectedDrs(row, i, safeNum(row[29 + i * 2]) || 0);
    if (inn > 0) { totalDrs += drs; totalInn += inn; }
  }
  const fieldingWAR = totalInn > 0 ? totalDrs / 10 : 0;

  // 走塁貢献（SB 20本 ≒ 0.5 WAR）
  const bsrWAR = (sb / 20) * ptRatio;

  // 代替選手比較基準
  const replWAR = 2.0 * ptRatio;

  const total = battingWAR + fieldingWAR + bsrWAR + replWAR;
  return Math.round(total * 10) / 10;
}

/**
 * 投手 WAR 推定（bWAR 近似）
 *   (代替ERA − 実測ERA) × IP ÷ 9 ÷ runsPerWin
 *   先発代替ERA = 5.40 / リリーフ代替ERA = 5.60 / runsPerWin = 9.0
 */
function estimatePitcherWAR(row) {
  const era    = parseFloat(row[5]);
  const ip     = parseFloat(row[10]);
  const gs     = parseInt(row[7]) || 0;
  const totalG = parseInt(row[6]) || 1;
  if (isNaN(era) || isNaN(ip) || ip <= 0) return null;

  const isStarter = gs >= totalG * 0.5;
  const replERA   = isStarter ? 5.40 : 5.60;
  const war = (replERA - era) * ip / 9 / 9.0;
  return Math.round(war * 10) / 10;
}

// ===== Baseball-Reference データ取得 =====
/**
 * Baseball-Reference の選手ページを CORS プロキシ経由で取得し、
 * 年度別の WAR・FIP をキャッシュする。
 * @param {string} brefId  例: "willide03" / "suzukic01"
 * @param {boolean} isPitcher
 */
async function fetchBRefData(brefId, isPitcher) {
  // キャッシュ済み or 取得中 の場合はスキップ
  // ※ _brefCache は「取得成功後」にのみセットする（失敗時はセットしない → リトライ可能）
  if (!brefId || _brefCache[brefId] || _brefInFlight.has(brefId)) return;
  _brefInFlight.add(brefId);  // 取得中フラグ（重複リクエスト防止）
  try {
    const pageUrl = `https://www.baseball-reference.com/players/${brefId[0]}/${brefId}.shtml`;

    // 共通ヘルパーで並列プロキシ取得（_fetchViaProxy）
    // ※ 選手ページは静的なのでWayback Machine（archive.org）も使用
    const text = await _fetchViaProxy(pageUrl, 'BRef', true);
    if (!text) {
      console.warn('[BRef] 全プロキシ失敗 → スキップ（次回生成時に再試行可能）');
      _brefInFlight.delete(brefId);
      return;
    }
    // 取得成功後にキャッシュを初期化（失敗時はキャッシュなし → リトライ可能）
    _brefCache[brefId] = {};
    const doc = new DOMParser().parseFromString(text, 'text/html');

    // コメントアウトされた hidden テーブルを取り出す（BRefの一部テーブルは<!-- -->で隠れている）
    const allHtml = text.replace(/<!--([\s\S]*?)-->/g, '$1');
    const doc2 = new DOMParser().parseFromString(allHtml, 'text/html');

    // ── 選手写真URLを抽出してキャッシュ ──
    // BRef は #meta 内に複数の写真を持つ場合がある（サイズ違い・チーム別など）
    // 最も大きいもの（naturalWidth が最大）を優先して使用する
    const metaDiv = doc.getElementById('meta') || doc2.getElementById('meta');
    if (metaDiv) {
      // ── 選手英語名を抽出してキャッシュ（Wikipedia検索フォールバック用）──
      const h1El = metaDiv.querySelector('h1[itemprop="name"] span, h1 span, h1');
      if (h1El) {
        const nameText = h1El.textContent.trim();
        if (nameText && nameText.length > 2) {
          _brefCache[brefId].nameEn = nameText;
          console.log('[BRef] 英語選手名取得:', nameText);
        }
      }

      const imgEls = Array.from(metaDiv.querySelectorAll('img[src]'));
      let bestPhoto = null, bestArea = 0;
      for (const imgEl of imgEls) {
        const rawSrc = imgEl.getAttribute('src') || '';
        const photoUrl = rawSrc.startsWith('http') ? rawSrc
          : rawSrc.startsWith('/') ? 'https://www.baseball-reference.com' + rawSrc : null;
        if (!photoUrl || photoUrl.includes('generic')) continue;
        // width/height 属性またはナチュラルサイズで面積を計算
        const w = parseInt(imgEl.getAttribute('width')  || imgEl.naturalWidth  || 0);
        const h = parseInt(imgEl.getAttribute('height') || imgEl.naturalHeight || 0);
        const area = w * h;
        if (area > bestArea) { bestArea = area; bestPhoto = photoUrl; }
      }
      if (bestPhoto) {
        _brefCache[brefId].photoUrl = bestPhoto;
        console.log('[BRef] 写真URL取得（最大サイズ）:', bestPhoto);
      }
    }

    // ── テーブルからデータを行単位でキャッシュするヘルパー ──
    const parseStatsTable = (tableEl, getStats) => {
      if (!tableEl) return;
      tableEl.querySelectorAll('tbody tr').forEach(tr => {
        if (tr.classList.contains('thead') || tr.classList.contains('minors_table')) return;
        // 新旧BRefフォーマット両対応（year_ID / year_id）
        const yearTh = tr.querySelector('th[data-stat="year_ID"], th[data-stat="year_id"], [data-stat="year_ID"], [data-stat="year_id"]');
        const year   = yearTh ? yearTh.textContent.replace(/\D/g, '').trim() : '';
        if (!year || year.length !== 4) return;

        const get = stat => {
          const td = tr.querySelector(`td[data-stat="${stat}"]`);
          return td ? td.textContent.trim() : null;
        };
        // チーム列：新旧両フォーマット対応（team_ID / team_name_abbr）
        const teamTd   = tr.querySelector('td[data-stat="team_ID"], td[data-stat="team_name_abbr"], td[data-stat="team_id"]');
        const teamText = (teamTd ? teamTd.textContent.trim() : '').toUpperCase().replace(/\s+/g, '');
        const isTot    = teamText === 'TOT' || /^\d+(TM|TMS|TEAMS?)$/i.test(teamText);

        if (!_brefCache[brefId][year]) _brefCache[brefId][year] = {};
        getStats(year, get, isTot);
        if (isTot) console.log(`[BRef] TOT行: ${year}`, _brefCache[brefId][year]);
      });
    };

    // ── WAR を含むテーブルを全探索（テーブルIDに依存しない堅牢な方式） ──
    // BRef は batting_value / pitching_value 等に WAR 列があるが ID が変わる場合があるため
    // すべてのテーブルを走査して data-stat="WAR" セルを持つものを使用する
    // WAR列の候補stat名（新旧BRefフォーマット両対応）
    const _proxyWarStats = ['WAR', 'b_war', 'p_war', 'WAR_bat', 'rWAR', 'bWAR'];
    let warFound = false;
    for (const tbl of Array.from(doc2.querySelectorAll('table'))) {
      const warStatEl = tbl.querySelector(_proxyWarStats.map(s => `td[data-stat="${s}"]`).join(', '));
      if (!warStatEl) continue;
      const warStatName = warStatEl.getAttribute('data-stat');
      console.log('[BRef] WAR列テーブル発見: id=', tbl.id || '(no id)', 'stat=', warStatName);
      parseStatsTable(tbl, (year, get, isTot) => {
        const war = get(warStatName);
        if (war && war !== '' && (isTot || !_brefCache[brefId][year].war)) {
          _brefCache[brefId][year].war = war;
          warFound = true;
        }
      });
      break; // 最初に見つかったWARテーブルを使用（レギュラーシーズン優先）
    }
    if (!warFound) console.warn('[BRef] WARデータが見つかりません（プロキシ取得内容を確認してください）');

    // ── FIP を含むテーブルを全探索（投手のみ） ──
    if (isPitcher) {
      for (const tbl of Array.from(doc2.querySelectorAll('table'))) {
        if (!tbl.querySelector('td[data-stat="fip"]')) continue;
        console.log('[BRef] FIP列テーブル発見: id=', tbl.id || '(no id)');
        parseStatsTable(tbl, (year, get, isTot) => {
          const fip = get('fip');
          if (fip && fip !== '' && (isTot || !_brefCache[brefId][year].fip)) {
            _brefCache[brefId][year].fip = fip;
          }
        });
        break;
      }
    }

    const cachedYears = Object.keys(_brefCache[brefId]).filter(k => /^\d{4}$/.test(k)).sort();
    console.log('[BRef] キャッシュ完了:', brefId, cachedYears);
    cachedYears.forEach(yr => {
      const d = _brefCache[brefId][yr];
      if (d.war) console.log(`  [BRef] ${yr}: WAR=${d.war}${d.fip ? ' FIP='+d.fip : ''}`);
    });
  } catch (e) {
    console.warn('[BRef] 取得失敗:', e.message || e);
  } finally {
    _brefInFlight.delete(brefId);  // 取得中フラグを解除（成功・失敗どちらでも）
  }
}

/** BR キャッシュから WAR を返す */
function getBRefWAR(year) {
  if (!g_brefId || !_brefCache[g_brefId]) return null;
  return _brefCache[g_brefId][String(year)]?.war ?? null;
}
/** BR キャッシュから FIP を返す */
function getBRefFIP(year) {
  if (!g_brefId || !_brefCache[g_brefId]) return null;
  return _brefCache[g_brefId][String(year)]?.fip ?? null;
}

// ===== FIP 計算 =====
/**
 * Excel データから FIP を計算（BR取得できない場合のフォールバック）
 * FIP = (13×被HR + 3×BB - 2×K) / IP + 3.10
 */
function calcFIP(row) {
  const ip = parseFloat(row[10]);
  if (!ip || ip <= 0) return null;
  const hr = parseInt(row[13]) || 0;
  const bb = parseInt(row[14]) || 0;
  const k  = parseInt(row[15]) || 0;
  const fip = (13 * hr + 3 * bb - 2 * k) / ip + 3.10;
  return Math.round(fip * 100) / 100;
}
/** FIP を文字列でフォーマット（3桁表示） */
function fmtFIP(row) {
  const year = String(row[1] ?? '');
  // ① BRefキャッシュ最優先（貼り付けで取得したTOT行の公式値）
  const brFip = /^\d{4}$/.test(year) ? getBRefFIP(year) : null;
  if (brFip !== null) return brFip;
  // ② 複数チーム所属年のフォールバック: 個別チーム行をイニング加重平均で合算
  if (/^\d{4}$/.test(year) && g_dataRows) {
    const teamRows = g_dataRows.filter(r => {
      if (String(r[1] ?? '').trim() !== year) return false;
      const tm = String(r[2] ?? '').trim().toUpperCase().replace(/\s+/g, '');
      return tm !== '' && tm !== 'TOT' && !/^\d+(TM|TMS|TEAMS?)$/i.test(tm);
    });
    if (teamRows.length >= 2) {
      let numSum = 0, ipSum = 0;
      teamRows.forEach(r => {
        const ip = parseFloat(r[10]);
        if (!ip || ip <= 0) return;
        numSum += 13 * (parseInt(r[13]) || 0) + 3 * (parseInt(r[14]) || 0) - 2 * (parseInt(r[15]) || 0);
        ipSum  += ip;
      });
      if (ipSum > 0) return (Math.round((numSum / ipSum + 3.10) * 100) / 100).toFixed(2);
    }
  }
  // ③ 通常の計算（単一チームまたはTOT行）
  const calc = calcFIP(row);
  return calc !== null ? calc.toFixed(2) : '--';
}

/**
 * FIP → 総合力スコア変換
 * 先発: 5.00→60, 各0.5刻みで+10 → score = 60 + (5.00 - fip) * 20
 * リリーフ: 5.00→48、fip>=2.00: score = 48 + (5.00 - fip) * 20
 *           fip<2.00: score = 108 + (2.00 - fip) * 10
 */
function fipToScore(fip, isStarter) {
  if (isStarter) {
    return Math.round(60 + (5.00 - fip) * 20);
  } else {
    if (fip >= 2.00) return Math.round(48 + (5.00 - fip) * 20);
    return Math.round(108 + (2.00 - fip) * 10);
  }
}

/**
 * WAR 表示値を返す。
 *   ① Baseball-Reference キャッシュ（最優先・公式実測値）
 *   ② スプレッドシートの WAR 列（BRef未取得時のフォールバック）
 *   ③ 推定値（"~X.X" 形式）
 */
function resolveWAR(row, headerRow, isPitcher) {
  // ① BRef キャッシュを最優先（公式の実測値として信頼性が高い）
  const year = String(row[1] ?? '').trim();
  if (/^\d{4}$/.test(year)) {
    const brWar = getBRefWAR(year);
    if (brWar !== null) {
      console.log(`[WAR] BRefキャッシュ使用: ${year} = ${brWar}`);
      return String(brWar);
    }
  }
  // ② Excel の WAR 列（BRefが未取得の場合のフォールバック）
  const raw = getColVal(row, headerRow, 'WAR');
  if (raw !== '--') {
    console.log(`[WAR] Excel値使用: ${year} = ${raw}`);
    return raw;
  }
  // ③ 推定値（どちらも取得できない場合）
  const est = isPitcher ? estimatePitcherWAR(row) : estimateHitterWAR(row);
  return est !== null ? String(est) : '--';
}
// 通算行の場合は g_careerWAR（加重平均）を優先して返す
function resolveWAREffective(row, headerRow, isPitcher) {
  const isCareer = !/^\d{4}$/.test(String(row[1] ?? '').trim());
  if (isCareer && g_careerWAR != null) return g_careerWAR;
  return resolveWAR(row, headerRow, isPitcher);
}

  if (v >= 90) return 's-rank';

// ===== CARD THEMES =====
function getThemeVars(stars) {
  if (stars === 6) {
    // ── UR: スターダストパターン（散らばったレンズ輝きのダイヤ） ──
    // 56×56タイルに2大・2小の4つのファセットダイヤをランダム配置
    // 各ダイヤは4面のファセット陰影で②レンズ光り方を再現
    const _mkDiamond = (cx, cy, r, a1, a2, a3, a4) =>
      // 右上面(明) / 左上面 / 右下面 / 左下面(暗) / アウトライン
      `<polygon points="${cx},${cy-r} ${cx+r},${cy} ${cx},${cy}" fill="rgba(255,255,255,${a1})"/>` +
      `<polygon points="${cx},${cy-r} ${cx-r},${cy} ${cx},${cy}" fill="rgba(210,220,240,${a2})"/>` +

// ===== CARD CSS TEMPLATE =====
function getCardCSS(t) {
  return `
  #card-root * { margin:0; padding:0; box-sizing:border-box; }
  #card-root { font-family:'MS Gothic','Yu Gothic','Hiragino Kaku Gothic Pro',sans-serif; }
  #card-root .card {
    width:840px; height:530px; border-radius:16px;
    border:4px solid ${t.cardBorder}; background:${t.cardBg};
    box-shadow:${t.cardShadow}; display:flex; position:relative; overflow:hidden;
  }
  #card-root .card::after {
    content:''; position:absolute; top:0; left:0; right:0; height:50%;
    background:linear-gradient(to bottom,${t.sheen} 0%,transparent 100%);
    pointer-events:none; z-index:50; border-radius:14px 14px 0 0;
  }
  #card-root .top-banner {
    position:absolute; top:0; left:0; right:0; height:42px;
    background:${t.bannerBg}; display:flex; align-items:center;
    justify-content:space-between; padding:0 14px; z-index:20;
    border-bottom:3px solid ${t.bannerBorder}; box-shadow:0 3px 12px #00000066;
  }
  #card-root .banner-left { display:flex; align-items:center; gap:5px; flex-shrink:0; }
  #card-root .banner-awards {
    flex:1; text-align:center; padding:0 6px;
    font-size:13px; font-weight:900; letter-spacing:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    /* プリズム＋ラメ：レインボーグラデーション */
    background:linear-gradient(90deg,
      #ff4040 0%,#ff9900 14%,#ffe600 28%,#44ee44 42%,
      #00ccff 56%,#9966ff 70%,#ff44cc 85%,#ff4040 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    /* 2段階太く見せる: text-stroke で輪郭線を追加 */
    -webkit-text-stroke:0.7px rgba(255,230,80,0.55);
    /* 四方向の黒シャドウで輪郭を締め、グロー強化 */
    filter:
      drop-shadow(-1px -1px 0 #000d) drop-shadow(1px -1px 0 #000d)
      drop-shadow(-1px  1px 0 #000d) drop-shadow(1px  1px 0 #000d)
      drop-shadow(0 0 5px #fffc) drop-shadow(0 0 10px #ffcc00cc);
    background-size:200% auto; animation:prismShift 3s linear infinite;
  }
  @keyframes prismShift { to { background-position:200% center; } }
  #card-root .card-rank { color:#fff; font-size:20px; font-weight:900; letter-spacing:3px; text-shadow:2px 2px 0 #000,0 0 14px ${t.rankGlow}; flex-shrink:0; }
  #card-root .stars { color:${t.starsColor}; font-size:18px; text-shadow:1px 1px 0 #000,0 0 10px ${t.starsGlow}; letter-spacing:3px; flex-shrink:0; }
  #card-root .card-type { color:#fff; font-size:15px; font-weight:900; letter-spacing:2px; text-shadow:2px 2px 0 #000,0 0 10px ${t.typeGlow}; flex-shrink:0; white-space:nowrap; }
  #card-root .left-panel { width:285px; min-width:285px; position:relative; border-right:3px solid ${t.leftBorder}; overflow:hidden; }
  #card-root .photo-frame { position:absolute; top:0; left:0; right:0; bottom:0; background:linear-gradient(180deg,#4a3800 0%,#806000 50%,#382800 100%); }
  #card-root .photo-frame img { width:100%; height:100%; object-fit:cover; object-position:center top; display:block; }
  #card-root .photo-top-fade { position:absolute; top:0; left:0; right:0; height:55px; background:linear-gradient(to bottom,${t.photoTopColor} 0%,transparent 100%); z-index:2; }
  #card-root .photo-bot-fade { position:absolute; bottom:0; left:0; right:0; height:120px; background:linear-gradient(to top,${t.photoBotColor} 0%,${t.photoBotLight} 60%,transparent 100%); z-index:2; }
  #card-root .photo-side-fade { position:absolute; top:0; right:0; bottom:0; width:50px; background:linear-gradient(to left,${t.photoSideColor} 0%,transparent 100%); z-index:2; }
  #card-root .player-name-block { position:absolute; bottom:12px; left:0; right:0; text-align:center; z-index:5; }
  #card-root .player-name-ja { color:#fff; font-size:36px; font-weight:900; letter-spacing:4px; text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,0 0 20px ${t.nameGlow}; display:block; white-space:nowrap; }
  #card-root .player-name-en { color:${t.nameEnColor}; font-size:12px; font-weight:900; letter-spacing:2px; text-shadow:1px 1px 0 #000,-1px -1px 0 #000; display:block; margin-top:4px; white-space:nowrap; }
  #card-root .team-badge { position:absolute; top:48px; left:14px; border-radius:6px; padding:4px 14px; color:#fff; font-size:16px; font-weight:900; letter-spacing:4px; z-index:5; box-shadow:0 2px 8px #000000aa; }
  #card-root .power-display { position:absolute; top:46px; right:10px; text-align:center; z-index:5; background:rgba(0,0,0,0.60); border:2px solid ${t.powerBorder}; border-radius:8px; padding:3px 10px; }
  #card-root .power-label { color:${t.powerTextColor}; font-size:11px; font-weight:900; display:block; letter-spacing:1px; text-shadow:1px 1px 0 #000; }
  #card-root .power-value { color:${t.powerTextColor}; font-size:32px; font-weight:900; text-shadow:2px 2px 0 #000,0 0 14px ${t.nameGlow}; line-height:1; }
  #card-root .right-panel { flex:1; padding:46px 14px 8px 14px; display:flex; flex-direction:column; gap:3px; position:relative; z-index:2; background:${t.overlay}; overflow:hidden; }

  #card-root .position-badge { background:${t.posBadgeBg}; border:2px solid ${t.posBadgeBorder}; border-radius:6px; padding:3px 10px; color:#fff; font-size:13px; font-weight:900; letter-spacing:2px; text-shadow:1px 1px 0 #000; box-shadow:0 2px 6px #000000aa; }
  #card-root .player-full-name { color:#fff; font-size:20px; font-weight:900; text-shadow:2px 2px 0 #000,0 0 16px ${t.nameGlow}; letter-spacing:2px; white-space:nowrap; overflow:visible; }

  #card-root .record-bar { background:rgba(0,0,0,0.45); border:2px solid ${t.recBorder}; border-radius:8px; padding:4px 5px; display:flex; align-items:center; justify-content:space-between; margin-top:4px; }

// ===== 野手・総合力 加重平均計算 =====
/**
 * 野手（捕手含む）の総合力を加重平均で算出する。
 * 基準値を超える場合は 100 超の値を返す（キャップなし）。
 *
 * 重みの考え方（ミート/パワーを 1.0 とした相対値）:
 *   ミート・パワー      : 1.0
 *   スピード・チャンス・選球眼・三振耐性 : 0.5
 *   守備 DRS (1000inn換算): 0.5  → score = 50 + drs_per1000 × 2.5
 *   対左投手 (±差分)    : 0.25 → score = 50 + vsLeft × 2.5
 *   リード (捕手)        : 1.0  → score = 50 + lead × 5
 *   盗塁阻止率 % (捕手)  : 0.5  → score = csRate × 2
 */
/**
 * WAR 実測値 → 評価スコア変換
 *   WAR=0→40, 1→50, 2→60, ... 6→100, 8→120, 10→140
 *   （一定: warScore = 40 + war × 10）
 * @param {number} war - 実測 WAR 値
 * @returns {number} 評価スコア
 */
function warToScore(war) {
  return 50 + war * 10;
}

/**
 * @param {string|number|null} realWar - スプレッドシートの実測 WAR 値。
 *   '--' または null の場合は WAR なしとして扱い、calcHitterOverall の
 *   加重平均のみを総合力とする。
 */
function calcHitterOverall(row, isCatcher, realWar = null) {
  // ── 能力値（0–100+ の絶対スコア。0はデータなしとして除外） ──
  const meet   = safeNum(row[44]);
  const power  = safeNum(row[45]);
  const speed  = safeNum(row[46]);
  const chance = safeNum(row[47]);
  const eye    = safeNum(row[48]);
  const kres   = safeNum(row[49]);

  // ── 守備 DRS ──
  // 最大イニングのポジション（主ポジ）DRS を基本採用。
  // それ以外でイニングが主ポジの 60% 超のポジションがあれば、それらを含めた最大 DRS を採用。
  // score = 50 + bestDRS × 2.5
  let drsScore = null;
  let defInn = 0;  // 守備イニング合計（盗塁換算にも流用）
  {
    let maxInn = 0;
    const posList = [];
    for (let i = 0; i < 8; i++) {
      const inn = parseFloat(row[28 + i * 2]) || 0;
      // 外野3ポジションはBK列以降の修正DRS値を優先使用
      const drs = _getCorrectedDrs(row, i, safeNum(row[29 + i * 2]) ?? 0);
      if (inn > 0) {
        defInn += inn;
        posList.push({ inn, drs });
        if (inn > maxInn) maxInn = inn;
      }
    }
    if (posList.length > 0 && maxInn > 0) {
      const primaryDrs = posList.find(p => p.inn === maxInn)?.drs ?? 0;
      let bestDrs = primaryDrs;
      for (const p of posList) {
        if (p.inn > maxInn * 0.6 && p.drs > bestDrs) bestDrs = p.drs;
      }
      // ベストDRSがプラスの場合: 50 + bestDRS × 2.5（従来通り）
      // ベストDRSがマイナスの場合: 50 + bestDRS（ペナルティを緩和）
      drsScore = bestDrs >= 0
        ? 50 + bestDrs * 2.5
        : 50 + bestDrs;
    }
  }

  // ── 対左投手: ±差分値 → score = 50 + vsLeft × 2.5 ──
  const vsLeftRaw   = safeNum(row[52]);
  const vsLeftScore = vsLeftRaw !== null ? 50 + vsLeftRaw * 2.5 : null;

  // ── 加重平均 ──
  let wSum = 0, wTotal = 0;
  // 絶対スコア系（0 = データなし として除外）
  const addAbs = (val, w) => {
    if (val !== null && val > 0) { wSum += val * w; wTotal += w; }
  };
  // 変換済みスコア系（負にもなり得るので null チェックのみ）
  const addConv = (val, w) => {
    if (val !== null) { wSum += val * w; wTotal += w; }
  };

  addAbs(meet  * 1.2,       1.5);  // ミートは1.2倍した値をスコアとして使用
  addAbs(power * 1.0,       1.3);  // パワーは等倍・重み1.3
  addAbs(speed,        isCatcher ? 0.25 : 0.5);  // 捕手は走力の重みを低減
  addAbs(chance,       0.5);
  addAbs(eye,          0.5);
  addAbs(kres,         0.5);
  addConv(drsScore,    0.5);
  addConv(vsLeftScore, 0.25);

  // ── 盗塁（500イニング換算）区分線形スコア ──
  // SB=0→40, 10→60, 20→80, 30→100, 40→120, 50→140（+2/盗塁）
  // SB>50→140+(SB-50)×1（+1/盗塁）  重み 0.5
  //
  // 正規化基準: max(守備イニング, 試合数×8.5)
  // DH等で守備イニングが極端に少ない場合も試合数ベースで補正し
  // 「少イニング × 500 = 爆発」を防ぐ
  {
    const rawG    = getHitterGames(row);
    const gamesInn = (!isNaN(rawG) && rawG >= 10 && rawG <= 162) ? rawG * 8.5 : 0;
    // 守備イニングと試合数推定の大きい方を採用（DH時は試合数ベースが優先される）
    let inn500 = Math.max(defInn, gamesInn);
    if (inn500 > 0) {
      const sbRaw  = getSB(row);
      const sbNorm = sbRaw * 500 / inn500;   // 500イニング換算
      const sbScore = sbNorm <= 50
        ? 40 + sbNorm * 2              // 0〜50 : +2/盗塁
        : 140 + (sbNorm - 50);         // 50超  : +1/盗塁
      addConv(sbScore, isCatcher ? 0.25 : 0.5);  // 捕手は盗塁の重みを低減
    }
  }

  // ── 捕手専用 ──
  if (isCatcher) {
    const lead   = safeNum(row[53]);
    const csRate = safeNum(row[54]);
    if (lead !== null)   addConv((60 + lead * 5) * 1.1, 1.5); // +10→121, 0→66, -10→11
    // 盗塁阻止スコア: 0%→35, 10%→50, 20%→65, 30%→80, 40%→95, 50%→110（+1.5/1%）
    if (csRate !== null) addConv(35 + csRate * 1.5,   1.0);
  }

  const A = wTotal > 0 ? Math.round(wSum / wTotal) : 70;

  // ── HR能ボーナス（ExcelのAY列 = row[50] のHR値を使用） ──
  // 最終スコアにHR能×2を加算してホームラン能力の高い打者を評価
  const hrAbility = safeNum(row[50]);
  const hrBonus   = (hrAbility !== null && hrAbility > 0) ? hrAbility * 2 : 0;

  // ── 安打数ボーナス（単年のみ・通算行は適用なし） ──
  //   安打180以上190未満 → +3 / 190以上200未満 → +4 / 200以上 → +5
  let hitsBonus = 0;
  const _isCareerRowH = !/^\d{4}$/.test(String(row[1] ?? '').trim());
  if (!_isCareerRowH) {
    // 安打数はヘッダー名で取得（無ければ安打列 row[6] にフォールバック）
    let hitsN = parseInt(getFirstColVal(row, (g_headers && g_headers[0]) || null, ['安打', 'H', 'Hits']));
    if (isNaN(hitsN)) hitsN = parseInt(row[6]);
    if (!isNaN(hitsN)) {
      if (hitsN >= 200)      hitsBonus = 5;
      else if (hitsN >= 190) hitsBonus = 4;
      else if (hitsN >= 180) hitsBonus = 3;
    }
  }

  // ── 能力値ボーナス（規定打席到達・単年のみ・通算行は適用なし） ──
  //   三振耐性110超 → +2 / 選球眼110超 → +2 / チャンス110超 → +2（各独立に加算）
  //   ※ kres=三振耐性(row49), eye=選球眼(row48), chance=チャンス(row47) は上部で定義済み
  let abilityBonus = 0;
  if (!_isCareerRowH) {
    const _hdrA = (g_headers && g_headers[0]) || null;
    const abA = parseInt(getFirstColVal(row, _hdrA, ['AB', '打数', 'At Bats'])) || 0;
    const bbA = parseInt(getFirstColVal(row, _hdrA, ['BB', '四球', 'Walks', 'BB+HBP'])) || 0;
    if ((abA + bbA) >= 503) { // 規定打席相当
      if (kres   !== null && kres   > 110) abilityBonus += 2;
      if (eye    !== null && eye    > 110) abilityBonus += 2;
      if (chance !== null && chance > 110) abilityBonus += 2;
    }
  }

  // ── WAR 実測値がある場合のみ総合力にブレンド ──
  const warNum = (realWar !== null && realWar !== '--') ? parseFloat(realWar) : NaN;
  let finalScore;
  if (!isNaN(warNum)) {
    finalScore = Math.round((A + warToScore(warNum)) / 2) + hrBonus + hitsBonus + abilityBonus;
  } else {
    finalScore = A + hrBonus + hitsBonus + abilityBonus;
  }

  // ── 成績フロア（最低保証・単年のみ・通算行は適用なし） ──
  //   本塁打20以上 → 総合力70保証 / 30以上 → 75保証
  //   規定打席到達(打数+四球≧503)かつ
  //     打率.280以上 → 70保証 / .300以上 → 75保証 / .320以上 → 80保証
  //   複数該当時は最も高い下限を適用する
  if (!_isCareerRowH) {
    const _hdr = (g_headers && g_headers[0]) || null;
    const hrN  = parseInt(row[9]) || 0;
    const avgN = parseFloat(String(fmtRate(row[15])).replace(/^\./, '0.')) || 0;
    const abN  = parseInt(getFirstColVal(row, _hdr, ['AB', '打数', 'At Bats'])) || 0;
    const bbN  = parseInt(getFirstColVal(row, _hdr, ['BB', '四球', 'Walks', 'BB+HBP'])) || 0;
    const qualified = (abN + bbN) >= 503; // 規定打席相当

    let floor = 0;
    if (hrN >= 30)      floor = Math.max(floor, 75);
    else if (hrN >= 20) floor = Math.max(floor, 70);
    if (qualified) {
      if (avgN >= 0.320)      floor = Math.max(floor, 80);
      else if (avgN >= 0.300) floor = Math.max(floor, 75);
      else if (avgN >= 0.280) floor = Math.max(floor, 70);
    }
    if (floor > 0 && finalScore < floor) finalScore = floor;
  }

  // ── 試合数による総合力の底上げ（単年のみ・通算行は適用なし） ──
  //   121試合以上138試合未満 かつ 総合力65未満 → 本来 + ROUNDDOWN((65-本来)÷2)
  //   138試合以上            かつ 総合力70未満 → 本来 + ROUNDDOWN((70-本来)÷2)
  if (!_isCareerRowH) {
    const gN = getHitterGames(row);
    if (gN >= 138) {
      if (finalScore < 70) finalScore = finalScore + Math.floor((70 - finalScore) / 2);
    } else if (gN >= 121) {
      if (finalScore < 65) finalScore = finalScore + Math.floor((65 - finalScore) / 2);
    }
  }
  return finalScore;
}

/**
 * 投手総合力スコアを算出する。
 * A = Σ(スコア×重み) / Σ重み → WAR実測値がある場合は野手と同様に (A + warScore) / 2 でブレンド。
 * 通算行では g_careerWAR（IP加重平均）を使用するため異常値にならない。
 * @param {Array} row        - スプレッドシート行
 * @param {number|null} fipValue - FIP値（BR取得 or 計算済み）。null なら row から自動計算。
 * @param {string|number|null} warValue - 実測WAR値（'--' または null の場合はWARなしとして扱う）
 */
function calcPitcherOverall(row, fipValue = null, warValue = null) {
  // ── 能力値（0–100+ の絶対スコア。0はデータなしとして除外） ──
  const ctrl   = safeNum(row[51]);   // 制球
  const change = safeNum(row[52]);   // 緩急
  const ment   = safeNum(row[53]);   // 精神
  const strk   = safeNum(row[54]);   // 奪三振
  const heavy  = safeNum(row[55]);   // 球重

  // ── 対左・対盗塁: ±差分値 → score = 50 + val × 2.5 ──
  const leftRaw  = safeNum(row[56]);
  const baseRaw  = safeNum(row[57]);
  const leftScore = leftRaw  !== null ? 50 + leftRaw  * 2.5 : null;
  const baseScore = baseRaw  !== null ? 50 + baseRaw  * 2.5 : null;

  // ── 総合球威: 球威 × 投球割合 の加重平均（7球種）× 1.25 ──
  // 球種データ: row[59+i*3]=球速, row[60+i*3]=球威, row[61+i*3]=割合 (BG列=回復量追加に伴い+1シフト)
  let pwrWSum = 0, pwrWTotal = 0;
  for (let i = 0; i < 7; i++) {
    const pwr  = parseFloat(row[60 + i * 3]) || 0;
    const rate = parseFloat(row[61 + i * 3]) || 0;
    if (pwr > 0 && rate > 0) {
      pwrWSum   += pwr * rate;
      pwrWTotal += rate;
    }
  }
  const pitchPowerScore = pwrWTotal > 0 ? (pwrWSum / pwrWTotal) * 1.25 : null;

  // ── FIP スコア（先発/リリーフ判定） ──
  const g  = parseInt(row[6]) || 1;
  const gs = parseInt(row[7]) || 0;
  const isStarterForFIP = gs >= g * 0.4;
  const fipNum = fipValue !== null ? parseFloat(fipValue)
               : (() => { const c = calcFIP(row); return c !== null ? c : NaN; })();
  const fipScore = (!isNaN(fipNum)) ? fipToScore(fipNum, isStarterForFIP) : null;

  // ── 加重平均 A = Σ(スコア×重み) / Σ重み ──
  let wSum = 0, wTotal = 0;
  // 絶対スコア系（0 = データなし として除外）
  const addAbs = (val, w) => {
    if (val !== null && val > 0) { wSum += val * w; wTotal += w; }
  };
  // 変換済みスコア系（負にもなり得るので null チェックのみ）
  const addConv = (val, w) => {
    if (val !== null) { wSum += val * w; wTotal += w; }
  };

  addAbs(ctrl,            1.0);   // 制球
  addAbs(ment,            1.0);   // 精神
  addAbs(strk,            1.0);   // 奪三振
  addAbs(change,          0.5);   // 緩急
  addAbs(heavy,           0.5);   // 球重
  addConv(leftScore,      0.25);  // 対左
  addConv(baseScore,      0.25);  // 対盗塁
  addAbs(pitchPowerScore, 2.5);   // 総合球威（×1.25済み）
  addAbs(fipScore,        2.0);   // FIP スコア

  const A = wTotal > 0 ? Math.round(wSum / wTotal) : 70;

  // ── WAR 実測値がある場合のみ総合力にブレンド（先発投手のみ）──
  // リリーフ投手は WAR の歪みが大きいため能力加重平均 A をそのまま返す
  // 通算行は IP加重平均WAR（g_careerWAR）が渡されるため異常値にならない
  const warNum = (warValue !== null && warValue !== '--')
    ? parseFloat(String(warValue).replace('~', ''))
    : NaN;
  let finalScore;
  if (!isNaN(warNum) && isStarterForFIP) {
    finalScore = Math.round((A * 3 + warToScore(warNum)) / 4);
  } else {
    finalScore = A;
  }

  const _isCareerRowOvr = !/^\d{4}$/.test(String(row[1] ?? '').trim());
  const ipNum = parseFloat(row[10]);

  // ── 投球回による底上げボーナス（単年のみ・通算行は適用なし） ──
  //   150以上175未満 かつ 総合力70未満 → 本来 + ROUNDDOWN((70-本来)÷2)
  //   175以上200未満 かつ 総合力72未満 → 本来 + ROUNDDOWN((72-本来)÷2)
  //   200以上        かつ 総合力75未満 → 本来 + ROUNDDOWN((75-本来)÷2)
  if (!_isCareerRowOvr && !isNaN(ipNum)) {
    if (ipNum >= 200) {
      if (finalScore < 75) finalScore = finalScore + Math.floor((75 - finalScore) / 2);
    } else if (ipNum >= 175) {
      if (finalScore < 72) finalScore = finalScore + Math.floor((72 - finalScore) / 2);
    } else if (ipNum >= 150) {
      if (finalScore < 70) finalScore = finalScore + Math.floor((70 - finalScore) / 2);
    }
  }

  // ── リリーフ投手の精神基準補正（投球回60未満） ──
  // カードで「先発投手」判定がない（gs < 試合数×0.5 ＝ リリーフ）かつ投球回60未満で、
  // 総合力が精神値を上回る場合のみ、(本来の総合力 + 精神) ÷ 2 に補正して過大査定を抑える。
  // 精神値が総合力以上の場合は補正しない。
  // ※ ment = safeNum(row[53]), g/gs は上部で定義済み（g=試合数, gs=先発数）
  const isStarterForCard = g > 0 && gs >= g * 0.5;
  if (!isStarterForCard && !isNaN(ipNum) && ipNum < 60 && ment !== null) {
    if (finalScore > ment) {
      finalScore = Math.round((finalScore + ment) / 2);
    }
  }

  // ── 投球回による総合力の上限制限（通算年にも適用） ──
  // 投球回が少ない選手（失点0等で能力値が過大評価されるケース）を抑制する
  //   投球回10未満 → MAX65 / 20未満 → MAX70 / 30未満 → MAX75
  if (!isNaN(ipNum)) {
    let cap = null;
    if (ipNum < 10)      cap = 65;
    else if (ipNum < 20) cap = 70;
    else if (ipNum < 30) cap = 75;
    if (cap !== null && finalScore > cap) finalScore = cap;
  }
  return finalScore;
}

// ===== CARD HTML BUILDERS =====
function buildStatBox(label, value) {
  const rank = statRank(value);
  const peak = isPeak(value);
  const isTriple = (typeof value === 'number' || (typeof value === 'string' && !isNaN(value))) && Number(value) >= 100;
  const boxCls = isTriple ? ' triple-box' : (peak ? ' peak' : '');
  const valCls = isTriple ? ' triple' : (rank ? ' ' + rank : '');
  return `<div class="stat-box${boxCls}"><span class="stat-name">${label}</span><span class="stat-val${valCls}">${value}</span></div>`;
}

/** 小型スタットボックス（盗塁能・対左・HR能用）
 *  isHR=true のとき 0–6 スケールに合わせた色付けを行う */
function buildStatBoxMini(label, value, isHR) {
  let rankCls;
  if (isHR) {
    rankCls = value >= 5 ? 'hr-s' : value >= 3 ? 'hr-a' : '';
  } else {
    rankCls = statRank(value);
  }
  const disp = (value === null || value === undefined) ? '--' : String(value);
  return `<div class="stat-box-mini"><span class="stat-name-mini">${label}</span><span class="stat-val-mini${rankCls ? ' ' + rankCls : ''}">${disp}</span></div>`;
}

function buildPitchPointBox(label, value) {
  if (value === null || value === undefined) {
    return `<div class="pitch-box neu-b"><span class="pitch-lbl">${label}</span><span class="pitch-v neu">±0</span></div>`;
  }
  const cls  = value > 0 ? 'pos' : value < 0 ? 'neg' : 'neu';
  const disp = value > 0 ? '+' + value : value === 0 ? '±0' : String(value);
  return `<div class="pitch-box ${cls}-b"><span class="pitch-lbl">${label}</span><span class="pitch-v ${cls}">${disp}</span></div>`;
}

function buildDrsSection(drsData) {
  if (!drsData || drsData.length === 0) return '';
  // イニング降順で並べ替えてから最大8ポジションまで表示（4列×2行）
  const displayData = [...drsData]
    .sort((a, b) => parseFloat(b.inn) - parseFloat(a.inn))
    .slice(0, 8);
  const isMulti = displayData.length >= 5;
  const barClass = isMulti ? 'drs-bar drs-multi' : 'drs-bar drs-single';
  drsData = displayData;
  const items = drsData.map((d, i) => {
    const n = safeNum(d.drs) || 0;
    const cls = n > 0 ? 'pos' : n < 0 ? 'neg' : 'neu';
    const disp = n > 0 ? '+' + n : n === 0 ? '±0' : String(n);
    // 2列グリッド時はdividerなし、1列時はdividerあり
    const sep = (!isMulti && i > 0) ? '<div class="drs-div"></div>' : '';
    return sep + `<div class="drs-item"><span class="drs-pos">${d.pos}</span><span class="drs-num ${cls}">${disp}</span><span class="drs-inn">${d.inn} inn</span></div>`;
  }).join('');
  return `<div class="${barClass}">${items}</div>`;
}

// ===== PITCHER CARD BUILDER =====
function buildPitcherCard(row, headers, photoURL, t, isPeakYear, nameEn) {
  const name   = row[0] || '---';
  const year   = row[1] || '';
  // 通算行（年度が4桁でない）はキャリア最多試合チームを使用（_doGenerateで事前計算済み）
  const _isCareerRow = !/^\d{4}$/.test(String(year).trim());
  const teamCode = normalizeTeamCode(
    (_isCareerRow && g_careerTeam) ? g_careerTeam : String(row[2] || '')
  );
  const wins   = row[3] || 0;
  const losses = row[4] || 0;
  const era    = row[5] || '--';
  const totalG = row[6] || 0;
  const gs     = row[7] || 0;
  const ip     = row[10] || '--';
  const k      = row[15] || 0;
  const whip   = row[17] || '--';
  const sv     = getFirstColVal(row, headers[0], ['SV','セーブ','Saves','Save','S']);
  const war    = fmtWAR(resolveWAREffective(row, headers[0], true));

  const stam   = row[50] || 0, ctrl   = row[51] || 0, change = row[52] || 0,
        ment   = row[53] || 0, strk   = row[54] || 0, heavy  = row[55] || 0;

  // 球種名: 各スロットのヘッダーを優先し、なければデフォルト名にフォールバック
  // 球種データ: row[59+i*3]=球速, row[60+i*3]=球威, row[61+i*3]=割合 (BG列=回復量追加に伴い+1シフト)
  const pitchNames = ['フォーシーム','スライダー','チェンジアップ','カーブ','カットボール','ツーシーム','スプリット'];
  const finalPitchNames = pitchNames.map((def, i) => {
    const h = headers[0][59 + i * 3];
    return (h != null && String(h).trim()) ? String(h).trim() : def;
  });

  const pitches = [];
  for (let i = 0; i < 7; i++) {
    const speed = row[59 + i * 3];
    const power = row[60 + i * 3];
    const rate  = parseFloat(row[61 + i * 3]) || 0;
    if (rate > 0) {
      pitches.push({ name: finalPitchNames[i] || pitchNames[i], speed, power, rate });
    }
  }
  // 投球割合の多い順、同率は球威の高い順に並べ替え
  pitches.sort((a, b) => b.rate - a.rate || (parseFloat(b.power) || 0) - (parseFloat(a.power) || 0));

  // FIP: BR取得値 → 計算値 の優先順で渡す
  const _fipForOverall = (() => {
    const brF = getBRefFIP(String(year));
    if (brF !== null) return parseFloat(brF);
    return calcFIP(row);
  })();
  // WAR: 通算行は resolveWAREffective が g_careerWAR（IP加重平均）を返す
  const _warForOverall = resolveWAREffective(row, headers[0], true);
  const overallScore = calcPitcherOverall(row, _fipForOverall, _warForOverall);

  const isStarter   = gs >= totalG * 0.5;
  const posBadge    = isStarter ? '先発投手' : 'リリーフ';
  const cardTypeLabel = isStarter
    ? (strk >= 90 ? '先発エース' : '先発投手')
    : (strk >= 90 ? 'クローザー' : 'リリーフ');

  const teamStyle    = getTeamStyle(teamCode);
  const teamBadgeHtml = `<div class="team-badge" style="background:${teamStyle.bg};border:2px solid ${teamStyle.border};text-shadow:1px 1px 0 #000,0 0 8px ${teamStyle.glow};">${teamCode === 'NEW' ? 'NYY' : teamCode}</div>`;

  // 初期列伝（統計ベース、後でAI上書き）
  const retsudenText = `${year}年、防御率 ${era}、${wins}勝${losses}敗、奪三振 ${k}、WHIP ${whip}、${ip}回投球。` +
    `スタミナ${stam}・制球${ctrl}・緩急${change}・精神${ment}・奪三振${strk}・球重${heavy}。`;

  const leftVal  = safeNum(row[56]);
  const baseVal  = safeNum(row[57]);
  const recovVal = safeNum(row[58]);  // 回復量 (BG列)

  // 上段（4列1行）: コアステータス
  const statBoxesTop = [
    buildStatBox('スタミナ', stam),
    buildStatBox('制　球',   ctrl),
    buildStatBox('緩　急',   change),
    buildStatBox('精　神',   ment),
  ].join('');
  // 下段: 奪三振(1fr) + 球重(1fr) + [対左/対盗塁/回復量 ミニ3マス](2fr)
  const statBoxesBotMain = [
    buildStatBox('奪三振', strk),
    buildStatBox('球　重', heavy),
  ].join('');
  const statBoxesMini =
    `<div class="stats-mini-group">` +
      buildStatBoxMini('対　左', leftVal,  false) +
      buildStatBoxMini('対盗塁', baseVal,  false) +
      buildStatBoxMini('回復量', recovVal, false) +
    `</div>`;

  const pitchRows = pitches.map(p => {
    const rawSpd = parseFloat(p.speed);
    const rawPwr = parseFloat(p.power);
    const spdCls = !isNaN(rawSpd)
      ? (rawSpd >= 160 ? ' ps-elite' : rawSpd >= 155 ? ' ps-hot' : '')
      : '';
    const pwrCls = !isNaN(rawPwr)
      ? (rawPwr >= 100 ? ' pp2-elite' : rawPwr > 90 ? ' pp2-hot' : '')
      : '';
    return `<tr><td class="pn" data-pitch="${escapeHtml(p.name)}">${p.name}</td><td class="ps${spdCls}">${p.speed}</td><td class="pp2${pwrCls}">${p.power}</td><td class="pr">${fmtPct(p.rate)}</td></tr>`;
  }).join('');

  const photoSrc   = photoURL ? `<img src="${photoURL}" alt="${name}" onerror="this.style.display='none'">` : '';
  const seasonLabel = isPeakYear ? `${year} PEAK` : `${year}`;

  return `
    <div class="top-banner">
      <span class="banner-left"><span class="card-rank">${t.rank}</span><span class="stars">${t.stars}</span></span>
      <span class="banner-awards" style="display:none;"></span>
      <span class="card-type">${cardTypeLabel}</span>
    </div>
    <div class="left-panel">
      <div class="photo-frame">${photoSrc}</div>
      <div class="photo-top-fade"></div><div class="photo-bot-fade"></div><div class="photo-side-fade"></div>
      ${teamBadgeHtml}
      <div class="power-display">
        <span class="power-label">総合力</span>
        <span class="power-value" style="${overallScore >= 100 ? 'font-size:26px;' : ''}">${overallScore}</span>
      </div>
      <div class="player-name-block">
        <span class="player-name-ja">${name}</span>
        ${nameEn ? `<span class="player-name-en">${escapeHtml(nameEn)}</span>` : ''}
      </div>
    </div>
    <div class="right-panel">
      <div class="header-row">
        <span class="position-badge">${posBadge}</span>
        <span class="player-full-name">${name}</span>
        <span class="season-badge">${seasonLabel}</span>
      </div>
      <div class="record-bar">
        <div class="rec-item"><span class="rec-label">防御率</span><span class="rec-val hl">${era}</span></div>
        <div class="rec-item"><span class="rec-label">勝利</span><span class="rec-val hl">${wins}</span></div>
        <div class="rec-item"><span class="rec-label">敗北</span><span class="rec-val">${losses}</span></div>
        <div class="rec-item"><span class="rec-label">セーブ</span><span class="rec-val pp">${sv}</span></div>
        <div class="rec-item"><span class="rec-label">イニング</span><span class="rec-val${String(ip).length >= 6 ? ' ip-long' : ''}">${ip}</span></div>
        <div class="rec-item"><span class="rec-label">奪三振</span><span class="rec-val pp">${k}</span></div>
        <div class="rec-item"><span class="rec-label">WAR</span><span class="rec-val hl">${war}</span></div>
      </div>
      <div class="sec-title">■ ゲームステータス</div>
      <div class="stats-grid">${statBoxesTop}</div>
      <div class="stats-grid-bot">${statBoxesBotMain}${statBoxesMini}</div>
      <table class="pitch-table">
        <thead><tr><th class="pitch-sec-th">■ 球種データ</th><th class="pitch-col-th" style="width:18%;">球速</th><th class="pitch-col-th" style="width:18%;">球威</th><th class="pitch-col-th" style="width:18%;">割合</th></tr></thead>
        <tbody>${pitchRows}</tbody>
      </table>
      <div class="retsuden" id="retsuden-area"><strong>【列伝】</strong> <span class="ai-loading">AI生成中...</span></div>
    </div>`;
}

// ===== HITTER CARD BUILDER =====
function buildHitterCard(row, headers, photoURL, t, isCatcher, isPeakYear, nameEn) {
  const name     = row[0] || '---';
  const year     = row[1] || '';
  // 通算行（年度が4桁でない）はキャリア最多試合チームを使用（_doGenerateで事前計算済み）
  const _isCareerRow = !/^\d{4}$/.test(String(year).trim());
  const teamCode = normalizeTeamCode(
    (_isCareerRow && g_careerTeam) ? g_careerTeam : String(row[2] || '')
  );
  const avg  = fmtRate(row[15]);
  const obp  = fmtRate(row[16]);
  const ops  = fmtOPS(row[17]);
  const hr   = row[9]  || 0;
  const rbi  = row[10] || 0;
  const sb   = getSB(row, headers[0]);
  const war  = fmtWAR(resolveWAREffective(row, headers[0], false));

  const meet  = row[44] || 0, power  = row[45] || 0, speed  = row[46] || 0,
        chance = row[47] || 0, eye   = row[48] || 0, kres   = row[49] || 0,
        hrAbil = (row[50] !== null && row[50] !== undefined && row[50] !== '') ? parseInt(row[50]) || 0 : null,
        steal  = row[51] || 0, vsLeft = row[52] || 0;
  const lead   = row[53], csRate = row[54];

  const pitchLabels = ['FB','2C','CT','SL','CB','CH','SF'];
  const pitchVals   = pitchLabels.map((lbl, i) => ({ lbl, val: safeNum(row[55 + i]) }));
  const allPitchNull = pitchVals.every(p => p.val === null);

  const posLabels = ['C','1B','2B','3B','SS','LF','CF','RF'];
  const drsData   = [];
  // BK列以降に補正DRSセクションがあるか（ある場合、補正値が空のポジションは守備判定対象外）
  const _hasCorrSec = _hasCorrectedDrsSection();
  for (let i = 0; i < 8; i++) {
    const inn = row[28 + i * 2];
    if (!inn || inn === '--' || inn === null || inn === '') continue;
    if (_hasCorrSec) {
      // 補正DRSセクションがある場合：補正値が登録されたポジションのみ表示
      // （イニングはごくわずか等で守備判定から外したポジションは補正値が空＝非表示）
      const corrected = _lookupCorrectedDrs(row, posLabels[i]);
      if (corrected === null) continue; // 守備判定対象外 → カードに記載しない
      drsData.push({ pos: posLabels[i], inn: String(inn), drs: corrected });
    } else {
      // 旧データ（補正セクションなし）：従来通り元のDRS値を表示
      const origDrs = safeNum(row[29 + i * 2]) || 0;
      drsData.push({ pos: posLabels[i], inn: String(inn), drs: origDrs });
    }
  }

  // ポジションバッジ: _getPrimaryPosJa() で DRS優先・通算DRSフォールバック・MLB API の順で決定
  const posBadge = isCatcher ? '捕手' : (_getPrimaryPosJa(row) || '野手');

  const realWar = resolveWAREffective(row, headers[0], false);  // 実測値 or 推定値（通算行は加重平均）
  const overallScore = calcHitterOverall(row, isCatcher, realWar);

  let cardTypeLabel;
  if (isCatcher)       cardTypeLabel = power >= 85 ? '大砲捕手' : '守備型捕手';
  else if (power >= 100) cardTypeLabel = 'スラッガー';
  else if (speed >= 80)  cardTypeLabel = '俊足外野手';
  else if (eye >= 85)    cardTypeLabel = 'OBP型打者';
  else                   cardTypeLabel = '野手';

  const teamStyle    = getTeamStyle(teamCode);
  const teamBadgeHtml = `<div class="team-badge" style="background:${teamStyle.bg};border:2px solid ${teamStyle.border};text-shadow:1px 1px 0 #000,0 0 8px ${teamStyle.glow};">${teamCode === 'NEW' ? 'NYY' : teamCode}</div>`;

  // 上段（4列1行）: コアステータス
  const statBoxesTop = [
    buildStatBox('ミート',   meet),
    buildStatBox('パワー',   power),
    buildStatBox('スピード', speed),
    buildStatBox('チャンス', chance),
  ].join('');
  // 下段: 選球眼(1fr) + 三振耐性(1fr) + [盗塁能/対左/HR能 ミニ3マス](2fr)
  const hrVal = hrAbil !== null ? hrAbil : '--';
  const statBoxesBotMain = [
    buildStatBox('選球眼',   eye),
    buildStatBox('三振耐性', kres),
  ].join('');
  const statBoxesMini =
    `<div class="stats-mini-group">` +
      buildStatBoxMini('盗塁能',   steal,  false) +
      buildStatBoxMini('対左投手', vsLeft, false) +
      buildStatBoxMini('HR能',     hrVal,  true)  +
    `</div>`;

  const pitchBoxes = pitchVals.map(p => buildPitchPointBox(p.lbl, p.val)).join('');
  const eraNote    = allPitchNull ? `<div class="era-note"><span>時代的<br>データなし</span></div>` : '';

  let defSection = '';
  if (isCatcher) {
    // 守備DRS: イニング上位2ポジションのみ表示
    const topDrs = [...drsData].sort((a, b) => parseFloat(b.inn) - parseFloat(a.inn)).slice(0, 2);
    const catDrs = topDrs.length > 0
      ? buildDrsSection(topDrs)
      : `<div class="drs-bar"><div class="drs-item"><span class="drs-pos">C</span><span class="drs-num neu">±0</span></div></div>`;
    const leadDisp = lead   !== null && lead   !== undefined ? lead   : 0;
    const csDisp   = csRate !== null && csRate !== undefined ? csRate : '--';
    // 守備DRSと捕手能力を横並び1行で表示
    defSection = `
      <div class="combo-row" style="align-items:center;">
        <div style="display:flex;flex-direction:column;gap:2px;flex:1;">
          <div class="sec-title">■ 守備 DRS</div>
          ${catDrs}
        </div>
        <div style="display:flex;flex-direction:column;gap:2px;flex:1.2;">
          <div class="sec-title">■ 捕手能力</div>
          <div class="catcher-bar" style="padding:4px 8px;">
            <div class="ca-item">
              <span class="ca-label">リード</span>
              <span class="ca-val lead" style="font-size:20px;">${leadDisp}</span>
            </div>
            <div class="ca-item">
              <span class="ca-label">阻止率</span>
              <span class="ca-val cs" style="font-size:20px;">${csDisp}</span>
              <span class="ca-unit">%</span>
            </div>
          </div>
        </div>
      </div>`;
  } else {
    defSection = `
      <div class="sec-title">■ 守備 DRS</div>
      ${drsData.length > 0
        ? buildDrsSection(drsData)
        : '<div class="drs-bar"><span style="color:#888;font-size:11px;">データなし</span></div>'}`;
  }

  const opsNum      = parseFloat(ops);
  const seasonSuffix = isPeakYear
    ? ((!isNaN(opsNum) && opsNum >= 1.0) || (hr >= 50) ? 'MVP' : 'PEAK')
    : '';
  const seasonLabel  = isPeakYear ? `${year} ${seasonSuffix}` : `${year}`;
  const photoSrc     = photoURL ? `<img src="${photoURL}" alt="${name}" onerror="this.style.display='none'">` : '';

  return `
    <div class="top-banner">
      <span class="banner-left"><span class="card-rank">${t.rank}</span><span class="stars">${t.stars}</span></span>
      <span class="banner-awards" style="display:none;"></span>
      <span class="card-type">${cardTypeLabel}</span>
    </div>
    <div class="left-panel">
      <div class="photo-frame">${photoSrc}</div>
      <div class="photo-top-fade"></div><div class="photo-bot-fade"></div><div class="photo-side-fade"></div>
      ${teamBadgeHtml}
      <div class="power-display">
        <span class="power-label">総合力</span>
        <span class="power-value" style="${overallScore >= 100 ? 'font-size:26px;' : ''}">${overallScore}</span>
      </div>
      <div class="player-name-block">
        <span class="player-name-ja">${name}</span>
        ${nameEn ? `<span class="player-name-en">${escapeHtml(nameEn)}</span>` : ''}
      </div>
    </div>
    <div class="right-panel">

// ===== EXCEL 変更ハンドラ（年代選択UIを更新） =====
function onExcelChange(input) {
  if (!input.files || !input.files[0]) return;
  const file = input.files[0];
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const wb   = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const ws   = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
      if (rows.length < 3) return;

      g_rows     = rows;
      g_headers  = rows.slice(0, 2);
      g_dataRows = rows.slice(2).filter(r => r[0] && r[0] !== null);
      g_isPitcher = rows[0][3] === '勝利' || rows[0][3] === '勝';
      g_isCatcher = !g_isPitcher && g_dataRows.some(r =>
        r[53] !== null && r[53] !== undefined && r[53] !== '--' && String(r[53]).trim() !== '');

      // ピーク年検出：総合力スコア（WAR込み）が最高の年を選択
      // ※ Excel読み込み直後はBRef WARが未取得のためWARなしで計算。
      //   BRefデータ取得後に refreshPeakYear() を呼ぶと自動更新される。
      recalcPeakYear();

      // ドロップダウン生成
      const sel = document.getElementById('year-select');
      sel.innerHTML = '';
      g_dataRows.forEach(r => {
        const yr  = r[1];
        const opt = document.createElement('option');
        opt.value = yr;
        opt.textContent = yr + '年' + (String(yr) === String(g_peakYear) ? ' ★ピーク' : '');
        if (String(yr) === String(g_peakYear)) opt.style.color = '#ffcc44';
        sel.appendChild(opt);
      });
      sel.value = g_peakYear;

      // 年代情報更新
      updateYearInfo(g_peakYear);

      // 年代選択パネル・BRef IDパネルを表示
      document.getElementById('year-selector-section').style.display = 'flex';
      document.getElementById('bref-section').style.display = 'block';
    } catch(err) {
      console.warn('Excel先読みエラー:', err);
    }
  };
  reader.readAsArrayBuffer(file);
}
