  const results = [];
  // 文を分割（ピリオド・改行で区切り、空文字除去）
  const sentences = text.replace(/\n+/g, ' ').split(/(?<=[.!?])\s+/).filter(s => s.trim().length > 10);
  console.log('[_parseWikiEpisodes] 文数:', sentences.length, '先頭3文:', sentences.slice(0,3));

  // チーム名→日本語略称マップ
  const TEAM_JA = {
    'Yankees':'ヤンキース','Red Sox':'レッドソックス','Dodgers':'ドジャース',
    'Giants':'ジャイアンツ','Cubs':'カブス','Cardinals':'カージナルス',
    'Mets':'メッツ','Braves':'ブレーブス','Phillies':'フィリーズ',
    'Padres':'パドレス','Rockies':'ロッキーズ','Diamondbacks':'ダイヤモンドバックス',
    'Marlins':'マーリンズ','Nationals':'ナショナルズ','Pirates':'パイレーツ',
    'Brewers':'ブリュワーズ','Reds':'レッズ','Astros':'アストロズ',
    'Athletics':'アスレチックス','Mariners':'マリナーズ','Angels':'エンゼルス',
    'Rangers':'レンジャーズ','Royals':'ロイヤルズ','Twins':'ツインズ',
    'White Sox':'ホワイトソックス','Tigers':'タイガース','Indians':'インディアンス',
    'Guardians':'ガーディアンズ','Blue Jays':'ブルージェイズ','Rays':'レイズ',
    'Orioles':'オリオールズ','Expos':'エクスポズ','Devil Rays':'デビルレイズ',
  };
  const teamJa = name => {
    for (const [en, ja] of Object.entries(TEAM_JA)) {
      if (name.includes(en)) return ja;
    }
    return name;
  };

  for (const s of sentences) {
    if (results.length >= 5) break;

    // 殿堂入り
    if (/Hall of Fame/i.test(s)) {
      results.push('野球殿堂入りを果たし、その功績は球史に永遠に刻まれた不朽の名選手として讃えられる。');
      continue;
    }

    // カムバック賞
    if (/Comeback Player/i.test(s) && !results.some(r => r.includes('カムバック'))) {
      const yearM = s.match(/(\d{4})/);
      if (yearM) {
        results.push(`${yearM[1]}年のカムバック賞は、逆境を乗り越えて復活を果たした不屈の精神の証として球史に刻まれた。`);
      } else {
        results.push('カムバック賞を受賞し、試練を乗り越えて輝きを取り戻した不屈の精神がファンの心に深く刻まれた。');
      }
      continue;
    }

    // リリーバー・オブ・ザ・イヤー / クローザー賞
    if (/Reliever of the Year|Relief.*Award|Mariano Rivera Award/i.test(s) && !results.some(r => r.includes('リリーバー') || r.includes('クローザー'))) {
      results.push('リリーバー・オブ・ザ・イヤーに輝き、その年のリーグ最高のリリーフ投手として公式に認められた栄誉。');
      continue;
    }

    // ハート・アンド・ハッスル賞（MLB選手会OB＝MLBPAA）
    if (/Heart and Hustle/i.test(s) && !results.some(r => r.includes('ハート・アンド・ハッスル'))) {
      const teamJa = _teamEngToJa(s);
      if (teamJa) {
        results.push(`MLB選手会OBが選ぶ${teamJa} ハート・アンド・ハッスル賞を受賞し、プロ意識と全力プレーが球界から公式に認められた。`);
      } else {
        results.push('MLB選手会OBが選ぶハート・アンド・ハッスル賞を受賞し、プロ意識と全力プレーが球界全体から公式に認められた。');
      }
      continue;
    }

    // ロベルト・クレメンテ賞
    if (/Roberto Clemente/i.test(s) && /award|winner|won|recipient/i.test(s) && !results.some(r => r.includes('クレメンテ'))) {
      results.push('ロベルト・クレメンテ賞を受賞し、野球を通じた地域貢献・慈善活動がMLB全体から最高の評価を受けた。');
      continue;
    }

    // ハンク・アーロン賞
    if (/Hank Aaron Award/i.test(s) && !results.some(r => r.includes('ハンク・アーロン'))) {
      results.push('ハンク・アーロン賞を受賞し、リーグ最高の打者として公式に認定された名誉は球史に輝く勲章。');
      continue;
    }

    // ルー・ゲーリッグ記念賞
    if (/Lou Gehrig.*Award|Gehrig.*Memorial/i.test(s) && !results.some(r => r.includes('ゲーリッグ'))) {
      results.push('ルー・ゲーリッグ記念賞を受賞し、グラウンド内外における高い人格と社会貢献がMLBから最高の評価を受けた。');
      continue;
    }

    // ブランチ・リッキー賞
    if (/Branch Rickey Award/i.test(s) && !results.some(r => r.includes('リッキー'))) {
      results.push('ブランチ・リッキー賞を受賞し、地域社会への貢献と野球の発展への尽力が高く評価された。');
      continue;
    }

    // マービン・ミラー賞
    if (/Marvin Miller.*Year|Marvin Miller.*Award/i.test(s) && !results.some(r => r.includes('マービン'))) {
      results.push('マービン・ミラー賞を受賞し、選手組合と野球界全体への貢献が球界から最高の評価を受けた。');
      continue;
    }

    // エドガー・マルティネス賞（最優秀DH賞）
    if (/Edgar Martinez.*Award|Outstanding.*DH Award/i.test(s) && !results.some(r => r.includes('マルティネス') || r.includes('DH'))) {
      results.push('エドガー・マルティネス賞を受賞し、その年のリーグ最高の指名打者として公式に認定された栄誉。');
      continue;
    }

    // プラチナグラブ賞
    if (/Platinum Glove/i.test(s) && !results.some(r => r.includes('プラチナグラブ'))) {
      results.push('プラチナグラブ賞を受賞し、両リーグを通じた最高の守備選手として球界全体から認められた至高の名誉。');
      continue;
    }

    // 永久欠番
    const retiredM = s.match(/(?:number|jersey|uniform)\s*#?(\d{1,2})\s+(?:was\s+)?retired/i)
                  || s.match(/retired\s+his\s+(?:number|jersey|uniform)\s*#?(\d{1,2})/i);
    if (retiredM) {
      results.push(`背番号${retiredM[1]}番は球団によって永久欠番に制定され、その功績がいかに偉大であったかを永く物語る。`);
      continue;
    }

    // 背番号
    const jerseyM = s.match(/wore\s+(?:uniform\s+)?(?:number\s+)?#?(\d{1,2})|(?:number|jersey|uniform)\s+#?(\d{1,2})/i);
    if (jerseyM && !results.some(r => r.includes('背番号'))) {
      const num = jerseyM[1] || jerseyM[2];
      results.push(`背番号${num}番を背負い、その番号はファンにとってチームのシンボルとして深く刻まれている。`);
      continue;
    }

    // ワールドシリーズ
    if (/World Series/i.test(s)) {
      const nM = s.match(/(\d+)[- ]?times?\s+World Series/i);
      if (nM) {
        results.push(`ワールドシリーズ${nM[1]}回出場を経験し、大舞台でチームを牽引した真のクラッチプレーヤー。`);
      } else if (/won|champion|title/i.test(s)) {
        results.push('ワールドシリーズ制覇を経験し、球団の栄光を手繰り寄せた歴史的な貢献を残した。');
      } else {
        results.push('ワールドシリーズの舞台を経験し、球団の黄金時代を支えた重要な存在として語り継がれる。');
      }
      continue;
    }

    // 完全試合・ノーヒットノーラン（投手）
    if (isPitcher && /perfect game/i.test(s)) {
      results.push('完全試合を達成した伝説の一夜は、投手として至高の境地に達した証として球史に刻まれる。');
      continue;
    }
    if (isPitcher && /no-hitter|no hitter/i.test(s)) {
      results.push('ノーヒットノーランを成し遂げた歴史的快投は、投球の完璧さを世界に証明した輝かしい偉業。');
      continue;
    }

    // 伝説的選手との比較（投手/野手共通）
    // 例: "compared to Bob Feller and Sandy Koufax"
    const compareM = s.match(/(?:compare[ds]?\s+to|likened\s+to)\s+(?:(?:Hall\s+of\s+Fam(?:er|e)|former|legendary)\s+)?([A-Z][a-z]+(?:\s+[A-Z][a-z]+)+)(?:\s+(?:and|or)\s+([A-Z][a-z]+(?:\s+[A-Z][a-z]+)+))?/i);
    if (compareM && !results.some(r => r.includes('比較') || r.includes('例えられ'))) {
      const l1 = (compareM[1] || '').trim();
      const l2 = compareM[2] ? compareM[2].trim() : null;
      if (l1.length >= 5 && l1.length < 35) {
        const legendStr = l2 ? `${l1}や${l2}` : l1;
        results.push(`${legendStr}と比較されるほどの卓越した才能を持つと評価され、デビュー当初から球界屈指の逸材として注目を集めた。`);
        continue;
      }
    }

    // 独特な投球フォーム/メカニクス（投手専用）
    // 例: "unusual pitching mechanics" / "unlike any other pitcher's delivery"
    if (isPitcher &&
        /unique|unusual|unorthodox|distinctive|unconventional|unlike\s+(?:any|most|other)/i.test(s) &&
        /delivery|mechanics|motion|windup|pitching|arm\s+action|release\s+point/i.test(s) &&
        !results.some(r => r.includes('フォーム') || r.includes('メカニクス') || r.includes('投球動作'))) {
      if (/full[- ]?body|whole[- ]?body|entire[- ]?body|torqu|torso|dynamic|violent|explosive/i.test(s)) {
        results.push('全身をダイナミックに使った独特の投球フォームは他の投手の追随を許さない唯一無二のスタイルで、打者のタイミングを完全に狂わせた。');
      } else {
        results.push('他の投手とは一線を画す独特の投球フォームが代名詞で、その特異なメカニクスが打者にとって最大の難題となっていた。');
      }
      continue;
    }

    // 逸材・早熟の天才（投手/野手共通）
    if (/(?:prodigy|phenom(?:enon)?|wunderkind|generational\s+talent|once[- ]in[- ](?:a[- ])?generation|sensation)/i.test(s) &&
        !results.some(r => r.includes('逸材') || r.includes('天才') || r.includes('一世代'))) {
      results.push('一世代に一人現れるかどうかという稀代の逸材として高く評価され、球界に与えたインパクトはキャリアを通じて計り知れない存在だった。');
      continue;
    }

    // オールスター（2回以上）
    const asM = s.match(/(\d+)[- ]?times?\s+All.Star/i);
    if (asM && parseInt(asM[1]) >= 2) {
      const n = parseInt(asM[1]);
      results.push(`${n}度のオールスター選出は、その卓越した実力がリーグ全体から認められ続けた確固たる証。`);
      continue;
    }
    if (/All.Star/i.test(s) && /selected|named|chosen|earned/i.test(s) && !results.some(r => r.includes('オールスター'))) {
      results.push('オールスターに選出された実績は、その年のリーグを代表する投手としての高い評価を示す栄誉。');
      continue;
    }

    // ゴールドグラブ（複数回）
    const ggM = s.match(/(\d+)[- ]?times?\s+Gold Glove/i);
    if (ggM && parseInt(ggM[1]) >= 2) {
      results.push(`${ggM[1]}度のゴールドグラブ賞受賞は、守備の名手として球史に輝く栄誉として永く語られる。`);
      continue;
    }

    // 連続試合出場
    if (/consecutive.*game|iron man|games played.*streak/i.test(s)) {
      const cnM = s.match(/(\d{3,4})\s*consecutive\s*game/i);
      if (cnM) {
        results.push(`${cnM[1]}試合連続出場という鉄人伝説は、不屈のプロ意識と卓越した耐久性を証明する偉業。`);
      } else {
        results.push('連続試合出場記録を築いた鉄人ぶりは、誰もが認める不屈のプロフェッショナリズムの証。');
      }
      continue;
    }

    // 球種の異名（"Airbender" など ── 投手専用）
    if (isPitcher && !results.some(r => r.includes('代名詞') || r.includes('魔球'))) {
      const pitchNickM =
        s.match(/(?:changeup|curveball|slider|fastball|sinker|cutter|pitch(?:es)?)\s+(?:nickname?d?|called|known\s+as|dubbed?)\s+(?:the\s+)?["']?([A-Za-z][A-Za-z\s]{2,25})["']?/i)
        || s.match(/["']([A-Za-z][A-Za-z\s]{2,25})["']\s+(?:changeup|curveball|slider|fastball|sinker|cutter|pitch)/i)
        || s.match(/nickname?d?\s+(?:the\s+)?["']([A-Za-z][A-Za-z\s]{2,25})["']/i);
      if (pitchNickM) {
        const pitchNick = (pitchNickM[1] || '').trim();
        if (pitchNick.length > 2 && pitchNick.length < 30 && !/the|his|her|that|this|which/i.test(pitchNick)) {
          results.push(`"${pitchNick}"の異名を持つ代名詞球種は球界屈指の魔球として知れ渡り、打者に対して圧倒的な支配力を誇示した。`);
          continue;
        }
      }
    }

    // 選手の異名（ニックネーム）── 大文字小文字違いの重複を防ぐ
    const nickM = s.match(/nicknamed?\s+"([^"]{5,50})"/i) || s.match(/known as\s+"([^"]{5,50})"/i);
    if (nickM) {
      const nn = nickM[1].trim().toLowerCase();
      if (!results.some(r => r.toLowerCase().includes(nn))) {
        results.push(`"${nickM[1]}"の異名を持ち、そのプレースタイルとキャラクターでファンに深く愛され続けた。`);
      }
      continue; // 重複でも次の文へ
    }

    // 移籍・トレード
    const tradeM = s.match(/traded?\s+(?:to|by)\s+(?:the\s+)?([A-Z][a-zA-Z ]{3,25}?)(?:\s+(?:in|on|for)|\s*[,.])/i);
    if (tradeM && !results.some(r => r.includes('移籍') || r.includes('トレード'))) {
      const team = teamJa(tradeM[1].trim());
      const yearM = s.match(/(\d{4})/);
      if (yearM) {
        results.push(`${yearM[1]}年に${team}へ移籍し、新天地でも変わらぬ実力を発揮して活躍を続けた。`);
      } else {
        results.push(`${team}へのトレードという転機を経て、新たな環境でも存在感を示し続けた。`);
      }
      continue;
    }

    // フリーエージェント移籍
    const faM = s.match(/(?:signed?|agreed?)\s+(?:a\s+)?(?:free[\s-]?agent\s+)?(?:contract\s+)?with\s+(?:the\s+)?([A-Z][a-zA-Z ]{3,25}?)(?:\s+(?:in|on|as|for)|\s*[,.])/i);
    if (faM && !results.some(r => r.includes('移籍') || r.includes('FA') || r.includes('契約'))) {
      const team = teamJa(faM[1].trim());
      const yearM = s.match(/(\d{4})/);
      if (yearM) {
        results.push(`${yearM[1]}年にFA権を行使して${team}と契約し、新天地での活躍に期待が高まった。`);
      } else {
        results.push(`フリーエージェントとして${team}に加入し、新たなキャリアの章を切り開いた。`);
      }
      continue;
    }

    // 複数球団在籍（選手紹介文に複数チームが列挙される）
    const multiTeamM = s.match(/played\s+for\s+(?:the\s+)?([A-Z][a-zA-Z ]{3,25}?),\s+(?:the\s+)?([A-Z][a-zA-Z ]{3,25}?)/i);
    if (multiTeamM && !results.some(r => r.includes('在籍'))) {
      const t1 = teamJa(multiTeamM[1].trim());
      const t2 = teamJa(multiTeamM[2].trim());
      results.push(`${t1}・${t2}など複数球団に在籍し、移籍を経るたびに新たな力をチームにもたらし続けた。`);
      continue;
    }

    // 出身地・生まれ（"born in City, State" も "born Month D, YYYY, in City, State" も対応）
    // "Texas)" の ")" も終端として認識するよう [,.)» ] を含める
    const birthM = s.match(/born(?:[^.]*?,\s*\d{4}[^.]*?)?\s+in\s+([A-Z][a-zA-Z\s]+?),\s+([A-Z][a-zA-Z\s]+?)(?:\s+on|\s*[,.)\s]|$)/i);
    if (birthM && !results.some(r => r.includes('生まれ') || r.includes('出身'))) {
      const city  = birthM[1].trim();
      // "Covina, Los Angeles County, California" のように途中に "County" が挟まる場合は
      // state として "Los Angeles County" が取れてしまうため、County部分を除去して再取得する
      const rawState = birthM[2].trim().replace(/[),.]+$/, '');
      // "Los Angeles County" → "California" が文中に続く場合を考慮して County を無視
      const countyStripM = s.match(/,\s*[A-Z][a-zA-Z\s]+County,\s*([A-Z][a-zA-Z\s]+?)(?:\s*[,.)]\s*|$)/i);
      const state = (countyStripM ? countyStripM[1].trim().replace(/[),.]+$/, '') : rawState);
      if (/^Japan$/i.test(state)) {
        // 日本出身: city部分を都道府県として漢字変換
        const prefKanji = _jakenFromRomaji(city) || `${city}（日本）`;
        results.push(`${prefKanji}出身。地元で磨いた野球センスがプロの世界で確かに開花した。`);
      } else {
        const stateJa  = _STATE_JA_MAP[state] || `${state}州`;
        const cityDisp = _cityEngToKana(city) || city;
        results.push(`${stateJa}${cityDisp}出身。地元で磨いた野球センスがプロの世界で確かに開花した。`);
      }
      continue;
    }

    // 高校時代のオールアメリカン・全米選抜
    if (/(?:high school|senior|prep)/i.test(s) && /All-American|All-USA|all-state/i.test(s)) {
      if (!results.some(r => r.includes('高校') || r.includes('全米'))) {
        const isUsaToday = /All-USA/i.test(s);
        results.push(isUsaToday
          ? '高校時代にUSAトゥデイ全米オールUSAチームに選出されるほどの逸材として、各球団のスカウトから熱い視線を浴びていた。'
          : '高校時代に全米オールアメリカンチームに選ばれる傑出した才能の持ち主として、プロスカウトの強い注目を集めた。');
        continue;
      }
    }

    // 複数スポーツ選手→野球を選択
    const multiSportM = s.match(/(?:letter of intent|committed?|offer(?:ed)?)\s+(?:to\s+)?(?:play\s+)?(?:football|basketball|soccer)\s+(?:at|for)\s+([A-Z][a-zA-Z\s&]{3,30})/i)
      || s.match(/play\s+(?:football|basketball)\s+(?:at|for)\s+([A-Z][a-zA-Z\s&]{3,30})/i);
    if (multiSportM && !results.some(r => r.includes('野球を選') || r.includes('フットボール') || r.includes('バスケ'))) {
      const _rawUniv = multiSportM[1].trim();
      const _jaUniv = _univEngToJa(_rawUniv);
      const univ = _jaUniv || _rawUniv
        .replace(/\s+University$/i, '大学').replace(/\s+College$/i, 'カレッジ').replace(/\s+State$/i, '州立大');
      const sport = /football/i.test(s) ? 'フットボール' : 'バスケットボール';
      results.push(`${univ}への${sport}奨学金を蹴って野球の道を選んだ経歴は、身体能力の高さと野球への強い信念を物語る。`);
      continue;
    }

    // ドラフト全体指名順位（詳細版）
    // "27th overall pick" / "selected him 27th overall" / "27th pick overall" いずれも対応
    const draftOverallM = s.match(/(\d+)(?:st|nd|rd|th)\s+overall\b/i)
      || s.match(/(\d+)(?:st|nd|rd|th)\s+(?:overall\s+)?(?:pick|selection)\b/i);
    if (draftOverallM && !results.some(r => r.includes('ドラフト') || r.includes('全体'))) {
      const pick = draftOverallM[1];
      const yr2 = (s.match(/(?:in\s+(?:the\s+)?)?(\d{4})\s+(?:MLB\s+|Major\s+League\s+)?[Dd]raft/i) || s.match(/(\d{4})/) || [])[1];
      // チーム名：「TEAM selected him」または「by/from the TEAM」の両形式に対応
      const teamOM = s.match(/(?:the\s+)?([A-Z][a-zA-Z ]{3,25})\s+(?:selected|drafted)\s+(?:him|her)\b/i)
        || s.match(/(?:by|from)\s+(?:the\s+)?([A-Z][a-zA-Z ]{3,25})\b/i);
      const teamO = teamOM ? teamJa(teamOM[1].trim()) : null;
      if (yr2 && teamO) {
        results.push(`${yr2}年ドラフトで${teamO}から全体${pick}位という高評価で指名を受け、メジャーへの扉を開いた。`);
      } else if (yr2) {
        results.push(`${yr2}年ドラフト全体${pick}位という高順位での指名は、当時から球界が将来の大物と見込んでいた証。`);
      } else {
        results.push(`ドラフト全体${pick}位という高評価での指名は、アマチュア時代の傑出した才能が広く認められていた証。`);
      }
      continue;
    }

    // 契約金・サイニングボーナス（$50M未満）
    const bonusM = s.match(/\$(\d+(?:\.\d+)?)\s*(?:million|M)\b/i);
    if (bonusM && /(?:sign(?:ing)?\s*bonus|offered|presented)/i.test(s) && !results.some(r => r.includes('契約金') || r.includes('ボーナス'))) {
      const amt = parseFloat(bonusM[1]);
      if (amt > 0 && amt < 50) {
        const amtStr = amt >= 1 ? `${amt}百万` : `${Math.round(amt * 100)}万`;
        results.push(`ドラフト指名時に${amtStr}ドルの契約金が提示されたことは、球団がいかにその将来性を高く評価していたかを示していた。`);
        continue;
      }
    }

    // Baseball America 有望株ランキング（数字 or 英単語序数に対応）
    {
      const _ordWords = { first:1,second:2,third:3,fourth:4,fifth:5,sixth:6,seventh:7,eighth:8,ninth:9,tenth:10 };
      // 数字：「No. 6 prospect」「6th prospect」「ranked 6th」いずれも対応
      const prospectsNumM = s.match(/No\.?\s*(\d+)\s+prospect[^.]*?Baseball\s+America/i)
        || s.match(/Baseball\s+America[^.]*?No\.?\s*(\d+)\s+prospect/i)
        || s.match(/(?:Baseball\s+America)[^\d]*?(\d+)(?:st|nd|rd|th)/i)
        || s.match(/ranked\s+(\d+)(?:st|nd|rd|th)[^\d]*?(?:prospect|Baseball America)/i)
        || s.match(/(\d+)(?:st|nd|rd|th)[^\d]{0,15}(?:prospect|Baseball America)/i);
      // 英単語序数（"sixth"）
      const prospectsWordM = /(?:Baseball\s+America|prospect\s+ranking)/i.test(s)
        && s.match(new RegExp(`\\b(${Object.keys(_ordWords).join('|')})\\b`, 'i'));
      if ((prospectsNumM || prospectsWordM) && !results.some(r => r.includes('有望株') || r.includes('プロスペクト') || r.includes('ランク'))) {
        const rankN = prospectsNumM
          ? prospectsNumM[1]
          : _ordWords[(prospectsWordM[1] || '').toLowerCase()];
        if (rankN) {
          results.push(`Baseball Americaの有望株ランキングで${rankN}位に輝くなど、将来のスター候補として球界の期待を一身に集めた。`);
          continue;
        }
      }
    }

    // ドラフト・デビュー
    const draftM = s.match(/drafted\s+by\s+(?:the\s+)?([A-Z][a-zA-Z ]{3,25}?)\s+(?:in\s+)?(?:the\s+)?(\d{4})/i);
    if (draftM) {
      const team = teamJa(draftM[1].trim());
      results.push(`${draftM[2]}年に${team}からドラフト指名されてメジャーへの扉を開き、着実に実力を磨いて一流選手へと成長した。`);
      continue;
    }
    const debutM = s.match(/(?:made his|MLB)\s*debut\s*(?:in\s+)?(\d{4})/i);
    if (debutM) {
      results.push(`${debutM[1]}年にMLBデビューを果たし、以来一貫してトップレベルのパフォーマンスを披露し続けた。`);
      continue;
    }

    // サイクルヒット（野手）
    if (!isPitcher && /hit for the cycle/i.test(s)) {
      results.push('サイクルヒットを達成するなど、打者としての多彩な能力を一試合で余すことなく披露した。');
      continue;
    }

    // ポストシーズン活躍
    if (/postseason|playoff|ALCS|NLCS|ALDS|NLDS/i.test(s) && /record|MVP|hero|clutch/i.test(s)) {
      results.push('ポストシーズンの大舞台で最高の輝きを放ち、チームを勝利へと導く真のクラッチプレーヤーぶりを示した。');
      continue;
    }

    // トミー・ジョン手術 / 重大手術からの復帰
    if (/Tommy John|UCL|ulnar collateral|reconstructive.*elbow|elbow.*surgery|elbow.*repl/i.test(s)) {
      if (!results.some(r => r.includes('手術') || r.includes('復帰'))) {
        results.push('トミー・ジョン手術という試練を乗り越えてマウンドへと帰還し、不屈の精神でキャリアを継続した。');
        continue;
      }
    }

    // 大型長期契約（$50M以上）
    const bigCM = s.match(/\$(\d+(?:\.\d+)?)\s*(?:million|M)\b/i);
    if (bigCM && /(?:sign|deal|contract|extension|agreement)/i.test(s) && !results.some(r => r.includes('契約'))) {
      const amt = parseFloat(bigCM[1]);
      if (amt >= 50) {
        const yearM2 = s.match(/(\d+)[- ]?year/i);
        const yrs = yearM2 ? `${yearM2[1]}年総額` : '総額';
        results.push(`${yrs}${Math.round(amt)}百万ドルという大型契約は、MLBが認めた実力の証であり選手としての評価の高さを示す。`);
        continue;
      }
    }

    // シルバースラッガー（1回でも）
    if (/Silver Slugger/i.test(s) && !results.some(r => r.includes('シルバースラッガー'))) {
      const ssN = s.match(/(\d+)[- ]?times?\s+Silver Slugger/i);
      if (ssN) {
        results.push(`${ssN[1]}度のシルバースラッガー賞は、攻撃力の高さをリーグ全体に証明し続けた輝かしい勲章。`);
      } else {
        results.push('シルバースラッガー賞を受賞し、その打撃力がリーグ最高水準にあることを公式に認められた。');
      }
      continue;
    }

    // サイ・ヤング賞
    if (/Cy Young/i.test(s) && !results.some(r => r.includes('サイ・ヤング'))) {
      const cyN = s.match(/(\d+)[- ]?times?\s+Cy Young/i);
      if (cyN) {
        results.push(`${cyN[1]}度のサイ・ヤング賞はリーグ最高投手として時代を席巻した輝かしい勲章。`);
      } else {
        results.push('サイ・ヤング賞を受賞し、その年のリーグ最高投手として球史に名を刻んだ。');
      }
      continue;
    }

    // MVP
    if (/Most Valuable Player|league MVP/i.test(s) && /won|award|named|selected/i.test(s) && !results.some(r => r.includes('MVP'))) {
      const mvpN = s.match(/(\d+)[- ]?times?\s+(?:MVP|Most Valuable)/i);
      if (mvpN) {
        results.push(`${mvpN[1]}度のMVP受賞は、時代を支配したスーパースターとしての地位を確固たるものにした。`);
      } else {
        results.push('MVPに輝き、その年のリーグを代表する最高の選手として球史にその名を刻んだ。');
      }
      continue;
    }

    // Players Choice Awards / 最優秀投手賞（選手投票）
    if (/Players(?:'|\s+)Choice|Players(?:'|\s+)Association\s+Award/i.test(s) &&
        !results.some(r => r.includes('最優秀') || r.includes('選手投票'))) {
      const _isAL2 = /american league|\bAL\b/i.test(s);
      const _isNL2 = /national league|\bNL\b/i.test(s);
      const _lg2   = _isAL2 ? 'AL' : _isNL2 ? 'NL' : '';
      if (/outstanding pitcher/i.test(s)) {
        results.push(`${_lg2 ? _lg2 + ' ' : ''}最優秀投手賞を選手投票で受賞し、同僚から認められた真の実力者として球史にその名を刻んだ。`);
        continue;
      }
      if (/outstanding player/i.test(s)) {
        results.push(`${_lg2 ? _lg2 + ' ' : ''}最優秀選手賞を選手投票で受賞し、グラウンドで戦う仲間たちから最高の評価を勝ち取った。`);
        continue;
      }
      if (/outstanding reliever/i.test(s)) {
        results.push(`${_lg2 ? _lg2 + ' ' : ''}最優秀救援投手賞を選手投票で受賞し、ブルペンの絶対的守護神として公式に認められた。`);
        continue;
      }
      if (/outstanding rookie/i.test(s)) {
        results.push(`${_lg2 ? _lg2 + ' ' : ''}最優秀新人賞を選手投票で受賞し、仲間の投票による最高の新人として球界デビューを飾った。`);
        continue;
      }
      results.push('MLBPAの選手投票による最優秀賞に輝き、同僚から最高の評価を受けた選手としてその名を残した。');
      continue;
    }

    // ウォーレン・スパーン賞（最優秀左腕投手）
    if (/Warren Spahn Award/i.test(s) && !results.some(r => r.includes('スパーン') || r.includes('左腕'))) {
      results.push('ウォーレン・スパーン賞を受賞し、その年のメジャーリーグ最優秀左腕投手として公式に認定された栄誉。');
      continue;
    }

    // 三冠王
    if (/triple crown/i.test(s) && /won|earned|captured|clinch/i.test(s) && !results.some(r => r.includes('三冠'))) {
      results.push('打率・本塁打・打点の三冠王を獲得し、その年のリーグ最強打者として球史に不滅の足跡を刻んだ。');
      continue;
    }

    // Bob Gibson賞 / Cy Youngに準ずる投手賞
    if (/Bob Gibson Award/i.test(s) && !results.some(r => r.includes('ギブソン'))) {
      results.push('ボブ・ギブソン賞を受賞し、その年のリーグ最高右腕投手として球界全体から認められた栄誉。');
      continue;
    }

    // Sporting News / Baseball America 年間賞
    if (/Sporting News.{0,30}(?:Player|Pitcher) of the Year/i.test(s) && !results.some(r => r.includes('スポーティングニュース'))) {
      const isSNP = /pitcher/i.test(s);
      results.push(`スポーティングニュース誌の年間最優秀${isSNP ? '投手' : '選手'}賞を受賞し、メディアからも折り紙付きの最高の評価を得た。`);
      continue;
    }

    // 出身地（州・都市）
    const bornM = s.match(/born\s+(?:in|on)?\s+(?:[A-Z][a-z]+\s+\d+,\s+\d{4},?\s+in\s+)?([A-Z][a-zA-Z ]+),\s*([A-Z][a-zA-Z ]+)/i);
    if (bornM && !results.some(r => r.includes('出身'))) {
      const city  = bornM[1].trim();
      const state = bornM[2].trim();
      if (/^Japan$/i.test(state)) {
        // 日本出身: city部分を都道府県として漢字変換
        const prefKanji = _jakenFromRomaji(city) || `${city}（日本）`;
        results.push(`${prefKanji}出身で、生まれ育った地でプロへの夢を育み、メジャーリーグで頂点へと駆け上がった。`);
      } else {
        // 州名・国名を日本語に変換（_STATE_JA_MAP を共用）
        const stateStr  = _STATE_JA_MAP[state] || `${state}州`;
        const cityDisp2 = _cityEngToKana(city) || city;
        results.push(`${stateStr}${cityDisp2}出身で、生まれ育った地でプロへの夢を育み、メジャーリーグで頂点へと駆け上がった。`);
      }
      continue;
    }

    // 出身大学（community college含む）
    // ※ [A-Za-z &'.-] はスペースを含み文全体をキャプチャする恐れがあるため
    //   「University of X」形式 と「X University」形式を別々に処理し、
    //   タイトルケース（先頭大文字）単語のみ許可することで誤マッチを防ぐ
    if (/attended|played.{0,40}(?:college|university)|graduated\s+from|studied\s+at/i.test(s)) {
      const univM =
        // "University/College of [Name]" 形式（"University of Washington" 等）
        s.match(/(?:University|College)\s+of\s+([A-Z][a-z]+(?:[\s-][A-Za-z]+){0,2})/i)
        // "[CapName] University/College/Tech" 形式（頭文字大文字ワードのみ）
        || s.match(/([A-Z][a-z]+(?:\s+[A-Z][a-z]+){0,3})\s+(?:University|College|Tech)\b/);
      if (univM && !results.some(r => r.includes('大学') || r.includes('カレッジ'))) {
        const univ = univM[1].trim();
        const isCC = /community|junior|JC/i.test(s);

        let univDisp;
        if (isCC) {
          // CC固有名から "Community"/"Junior"/"JC" を除いて静的マップを照合
          const univBase = univ.replace(/\s*(?:community|junior|jc)\s*/gi, '').trim();
          const jaFromMap = _univEngToJa(univBase) || _univEngToJa(univ);
          if (jaFromMap) {
            // マップ結果に既に「カレッジ」「大学」が含まれる場合はそのまま使用
            univDisp = /カレッジ|大学/.test(jaFromMap) ? jaFromMap : jaFromMap + 'コミュニティカレッジ';
          } else {
            // 未登録: 固有名部分を単語ごとカタカナ変換して "コミュニティカレッジ" を付与
            // 例: "Mohawk Valley" → "モホーク・バレー" → "モホーク・バレー・コミュニティカレッジ"
            const kana = univBase.split(/\s+/).map(w => _engWordToKana(w) || w).join('・');
            univDisp = kana + '・コミュニティカレッジ';
          }
        } else {
          // 4年制大学: 静的マップ照合 → 未登録は単語ごとカタカナ変換
          const jaFromMap = _univEngToJa(univ);
          if (jaFromMap) {
            univDisp = jaFromMap;
          } else {
            // 例: "Loyola Marymount" → "ロヨラ・マリーマウント大学"
            const kana = univ.split(/\s+/).map(w => _engWordToKana(w) || w).join('・');
            univDisp = kana + '大学';
          }
        }
        results.push(`${univDisp}出身で、学生時代から将来を嘱望されたエリートプレーヤーとしてプロの世界へと飛び込んだ。`);
        continue;
      }
    }

    // ドラフト全体順位
    const pickM = s.match(/(\d+)(?:st|nd|rd|th)\s+(?:overall\s+)?pick/i)
               || s.match(/selected\s+(\d+)(?:st|nd|rd|th)\s+overall/i)
               || s.match(/(\d+)(?:st|nd|rd|th)\s+pick\s+overall/i);
    if (pickM && !results.some(r => r.includes('指名'))) {
      const pick = parseInt(pickM[1]);
      const teamDM = s.match(/by\s+(?:the\s+)?([A-Z][a-zA-Z ]{3,25}?)(?:\s+in|\s*[,.])/i);
      const teamStr = teamDM ? `${teamJa(teamDM[1].trim())}に` : '';
      const pickStr = pick <= 5 ? `全体${pick}位` : `全体${pick}位`;
      results.push(`ドラフト${teamStr}${pickStr}指名という高い評価を受けてプロ入りし、その期待に応えるキャリアを築いた。`);
      continue;
    }

    // ドラフトラウンド
    const roundM = s.match(/(?:drafted?|selected?)\s+(?:in\s+)?(?:the\s+)?(\d+)(?:st|nd|rd|th)\s+round/i);
    if (roundM && !results.some(r => r.includes('指名'))) {
      const round = parseInt(roundM[1]);
      const teamDM2 = s.match(/by\s+(?:the\s+)?([A-Z][a-zA-Z ]{3,25}?)(?:\s+in|\s*[,.])/i);
      const teamStr2 = teamDM2 ? `${teamJa(teamDM2[1].trim())}に` : '';
      if (round === 1) {
        results.push(`ドラフト1巡目で${teamStr2}指名される高評価を受けてプロ入りし、その才能をメジャーの舞台で存分に発揮した。`);
      } else if (round <= 3) {
        results.push(`ドラフト${round}巡目から這い上がり、努力と才能でメジャーのトッププレーヤーへと成長した。`);
      } else {
        results.push('下位指名からメジャーの第一線へと登り詰めた努力の人として、多くの選手たちの手本となった。');
      }
      continue;
    }

    // 投球スタイル（投手）
    if (isPitcher) {
      // 球速
      const velM = s.match(/(?:fastball|heater)\s+(?:that\s+)?(?:reaches?|tops?|hits?|clocks?)\s+(\d{2,3})\s*mph/i)
                || s.match(/(\d{2,3})\s*mph\s+fastball/i);
      if (velM && !results.some(r => r.includes('投球') || r.includes('速球'))) {
        const mph = parseInt(velM[1]);
        if (mph >= 100) {
          results.push(`${mph}mphを超える圧倒的な速球を武器に、打者を力でねじ伏せるパワーピッチャーとして君臨した。`);
        } else if (mph >= 95) {
          results.push(`常時${mph}mph前後の速球を軸に、精度の高い変化球を組み合わせた投球スタイルで打者を翻弄した。`);
        }
        continue;
      }
      // 変化球主体・技巧派
      if (/curveball|slider|changeup|knuckleball|sinker|cutter/i.test(s) && /known|signature|devastating|wipeout|elite/i.test(s)) {
        const pitchJa = { curveball:'カーブ', slider:'スライダー', changeup:'チェンジアップ',
                          knuckleball:'ナックルボール', sinker:'シンカー', cutter:'カットボール' };
        const pitchM = s.match(/curveball|slider|changeup|knuckleball|sinker|cutter/i);
        const pitchName = pitchM ? (pitchJa[pitchM[0].toLowerCase()] || pitchM[0]) : '変化球';
        if (!results.some(r => r.includes('投球') || r.includes(pitchName))) {
          results.push(`得意の${pitchName}を代名詞とする技巧派投手として、独自の投球スタイルで長年打者たちを苦しめた。`);
          continue;
        }
      }
      // 奪三振スタイル
      if (/strikeout|swing and miss|whiff/i.test(s) && /known|dominant|elite|high/i.test(s)) {
        if (!results.some(r => r.includes('奪三振') || r.includes('三振'))) {
          results.push('圧倒的な奪三振能力を誇る本格派として、打者にとって最も対戦したくない投手の一人に挙げられた。');
          continue;
        }
      }
    }

    // 打撃スタイル（野手）
    if (!isPitcher) {
      // パワーヒッター
      if (/power hitter|slugger|home run hitter|long ball/i.test(s) && /known|regarded|considered/i.test(s)) {
        if (!results.some(r => r.includes('打撃') || r.includes('スラッガー'))) {
          results.push('卓越した長打力を誇るスラッガーとして、対戦投手にとって最も警戒を要する打者であり続けた。');
          continue;
        }
      }
      // コンタクトヒッター・アベレージヒッター
      if (/contact hitter|pure hitter|high average|bat control/i.test(s) && /known|regarded|considered/i.test(s)) {
        if (!results.some(r => r.includes('打撃') || r.includes('打率'))) {
          results.push('優れたバットコントロールと確実性を誇る巧打者として、どの球種にも対応できる技術の持ち主だった。');
          continue;
        }
      }
      // スイッチヒッター
      if (/switch.hitter|switch hit/i.test(s)) {
        if (!results.some(r => r.includes('両打'))) {
          results.push('両打ちの器用さを活かして左右どちらの投手にも対応し、打線において得難い存在感を放ち続けた。');
          continue;
        }
      }
      // 選球眼
      if (/walk|on-base|plate discipline|patient/i.test(s) && /known|regarded|excellent|elite/i.test(s)) {
        if (!results.some(r => r.includes('選球') || r.includes('出塁'))) {
          results.push('卓越した選球眼と忍耐強いアプローチで出塁率を高め、打線の起点として機能し続けた。');
          continue;
        }
      }
    }
  }

  return [...new Set(results)];
}

// ── MLB Stats API から出身地（構造化データ）を取得 ──────────────
// Wikipedia本文の正規表現解析より遥かに正確（birthCity / birthStateProvince / birthCountry）
const _birthInfoCache = {};
async function _fetchMlbBirthInfo(mlbId) {
  if (!mlbId) return null;
  if (_birthInfoCache[mlbId] !== undefined) return _birthInfoCache[mlbId];
  try {
    const res = await fetch(`https://statsapi.mlb.com/api/v1/people/${mlbId}`);
    if (!res.ok) { _birthInfoCache[mlbId] = null; return null; }
    const d = await res.json();
    const p = d?.people?.[0];
    if (!p) { _birthInfoCache[mlbId] = null; return null; }
    const info = {
      city:    (p.birthCity || '').trim(),
      state:   (p.birthStateProvince || '').trim(),
      country: (p.birthCountry || '').trim(),
    };
    _birthInfoCache[mlbId] = (info.city || info.country) ? info : null;
    console.log('[BirthInfo]', JSON.stringify(_birthInfoCache[mlbId]));
    return _birthInfoCache[mlbId];
  } catch (e) {
    console.warn('[BirthInfo] 取得失敗:', e.message);
    _birthInfoCache[mlbId] = null;
    return null;
  }
}

/**
 * MLB Stats API の出身データから列伝用の出身行を生成する。
 * 変換不能な部分は英語のまま残すのではなく、確実に訳せる範囲で組み立てる。
 * @returns {string|null}
 */
function _birthLineFromBirthInfo(info) {
  if (!info) return null;
  const closing = '地元で磨いた野球センスがプロの世界で確かに開花した。';
  const country = info.country;

  // ── 日本出身：birthStateProvince に都道府県（例 "Iwate"）、birthCity に市名（例 "Oshu"）──
  if (/^japan$/i.test(country)) {
    const pref = _jakenFromRomaji(info.state) || _jakenFromRomaji(info.city);
    if (pref) return `${pref}出身。${closing}`;
    return info.city ? `日本・${info.city}出身。${closing}` : `日本出身。${closing}`;
  }

  // ── 米国出身：州名を日本語化＋都市名をカタカナ化 ──
  // MLB APIは州を略号（"TX"等）で返すことがあるため、まず正式名に展開してから日本語化する
  if (/^(usa|united states)$/i.test(country)) {
    const _US_STATE_ABBR = {
      AL:'Alabama', AK:'Alaska', AZ:'Arizona', AR:'Arkansas', CA:'California', CO:'Colorado',
      CT:'Connecticut', DE:'Delaware', FL:'Florida', GA:'Georgia', HI:'Hawaii', ID:'Idaho',
      IL:'Illinois', IN:'Indiana', IA:'Iowa', KS:'Kansas', KY:'Kentucky', LA:'Louisiana',
      ME:'Maine', MD:'Maryland', MA:'Massachusetts', MI:'Michigan', MN:'Minnesota',
      MS:'Mississippi', MO:'Missouri', MT:'Montana', NE:'Nebraska', NV:'Nevada',
      NH:'New Hampshire', NJ:'New Jersey', NM:'New Mexico', NY:'New York',
      NC:'North Carolina', ND:'North Dakota', OH:'Ohio', OK:'Oklahoma', OR:'Oregon',
      PA:'Pennsylvania', RI:'Rhode Island', SC:'South Carolina', SD:'South Dakota',
      TN:'Tennessee', TX:'Texas', UT:'Utah', VT:'Vermont', VA:'Virginia', WA:'Washington',
      WV:'West Virginia', WI:'Wisconsin', WY:'Wyoming', DC:'District of Columbia',
    };
    let stRaw = info.state;
    if (/^[A-Z]{2}$/.test(stRaw)) stRaw = _US_STATE_ABBR[stRaw] || stRaw;
    const stateJa = (stRaw === 'District of Columbia') ? 'ワシントンD.C.'
                  : (_STATE_JA_MAP[stRaw] || (stRaw ? `${stRaw}州` : ''));
    const cityJa  = _cityEngToKana(info.city) || info.city;
    if (stateJa && cityJa) return `${stateJa}${cityJa}出身。${closing}`;
    if (stateJa)           return `${stateJa}出身。${closing}`;
    return null;
  }

  // ── その他の国：国名を日本語化（_STATE_JA_MAP の国名エントリを利用）──
  const countryJa = _STATE_JA_MAP[country] || country;
  const cityJa = _cityEngToKana(info.city) || info.city;
  if (countryJa && cityJa) return `${countryJa}・${cityJa}出身。${closing}`;
  if (countryJa)           return `${countryJa}出身。${closing}`;
  return null;
}

// ── 列伝を生成してカードに反映（APIキー不要） ─────────────────
async function fetchRetsudenFromAPI(row) {
  const yearKey = String(row[1] || '');
  const isCareer = !/^\d{4}$/.test(yearKey);

  // ① 通算行の場合：全キャリア受賞歴を一括取得して _awardsJaByYear に格納
  if (isCareer && g_mlbId) {
    await _fetchAndCacheAllAwards(g_mlbId);
  }

  // ② MLB Stats API からシーズン成績・受賞歴を取得
  let mlbData = { stats: {}, awards: [] };
  if (g_mlbId && row[1]) {
    console.log(`[MLB Stats API] ID=${g_mlbId} year=${row[1]} 取得中…`);
    mlbData = await fetchMlbSeasonData(g_mlbId, row[1], g_isPitcher);
    console.log('[MLB Stats API] 受賞数:', mlbData.awards.length, '/ stats keys:', Object.keys(mlbData.stats).length);
  }

  // ③ リーグ年度別ランキング取得（1位のみアワードとして使用）
  let rankData = {};
  if (g_mlbId && row[1] && /^\d{4}$/.test(yearKey)) {
    try {
      const { leagueId, leagueLabel } = getLeagueInfo(row[2]);
      const localStats = g_isPitcher
        ? { era: row[5], k: parseInt(row[15]) || null, wins: parseInt(row[3]) || null, whip: row[17] }
        : { avg: row[15], hr: parseInt(row[9]) || null, rbi: parseInt(row[10]) || null,
            ops: row[17], sb: getSB(row) };
      const leaders = await fetchLeagueLeaders(row[1], g_isPitcher, leagueId);
      rankData = buildRankData(leaders, g_mlbId, leagueLabel, localStats);
      _rankDataByYear[String(row[1])] = rankData;  // 年度別キャッシュに保存
      console.log('[LeagueLeaders] rankData:', JSON.stringify(rankData));
    } catch (e) {
      console.warn('[LeagueLeaders] 取得失敗:', e.message);
    }
  }

  // ③ 前年比較による軌跡分析（同期・g_dataRows 使用）
  const trajectory = analyzeCareerTrajectory(row);
  if (trajectory.isBreakthrough) console.log('[Trajectory] 覚醒シーズン検出');
  else if (trajectory.isImprovement) console.log('[Trajectory] 成長シーズン検出');
  else if (trajectory.isPeakSeason) console.log('[Trajectory] キャリアベスト検出');

  // ④ Wikipedia からエピソードを取得（列伝が乏しい場合のフォールバック用・通算／通常年共通）
  // g_mlbNameEn が未設定の場合は BRef キャッシュから英語名をフォールバックとして使用
  let wikiEpisodes = [];
  let _wikiName = g_mlbNameEn;
  if (!_wikiName && g_brefId) {
    // 貼り付けで取得済みの BRef キャッシュから英語名を使う
    _wikiName = _brefCache[g_brefId]?.nameEn || null;
    if (_wikiName) console.log('[Wiki] BRef から英語名を取得:', _wikiName);
  }
  if (_wikiName) {
    wikiEpisodes = await fetchWikipediaEpisodes(_wikiName, g_isPitcher);
  }

  // ④-b 出身地はMLB Stats APIの構造化データを最優先で使用
  // Wikipedia正規表現解析由来の出身行（精度が不安定）をAPI由来の正確な行に差し替える
  if (g_mlbId) {
    const birthInfo = await _fetchMlbBirthInfo(g_mlbId);
    const apiBirthLine = _birthLineFromBirthInfo(birthInfo);
    if (apiBirthLine) {
      wikiEpisodes = wikiEpisodes.filter(ep => !ep.includes('出身') && !ep.includes('生まれ'));
      wikiEpisodes.unshift(apiBirthLine);
    }
  }

  // 通算カード: APIで歴代率系順位が確定した後に列伝の該当箇所を再構築できるようパラメータを保存
  // 非通算カード: 不要なので null にリセット
  _careerRetsudenRebuildParams = isCareer
    ? { row, mlbData, rankData, trajectory, wikiEpisodes }
    : null;

  const retsuden = buildRetsudenFromMLBData(row, mlbData, rankData, trajectory, wikiEpisodes);
  // MLB公式アワード + リーグリーダー1位タイトルをマージ（重複除去）
  const apiAwards   = (mlbData.awards || []).map(awardToJa).filter(Boolean);
  const rankAwards  = rankDataToAwards(rankData);
  const awardsJa    = [...new Set([...apiAwards, ...rankAwards])];
  if (rankAwards.length) console.log('[LeagueLeaders] 追加アワード:', rankAwards);

  // 通算行：全年度の受賞歴を awardsJa に集計（重複あり＝カウント可能）
  // _buildCareerCardType の cnt() が「3回首位打者」「5回SS」等を正しく数えるために必要
  if (isCareer) {
    // ① 公式アワード（MVP, GG, SS, ROY など）を全年度から集計
    Object.values(_awardsJaByYear).forEach(yearAwards => {
      awardsJa.push(...yearAwards);
    });
    // ② 統計タイトル（首位打者, 本塁打王 など）を _rankDataByYear から集計
    Object.values(_rankDataByYear).forEach(rd => {
      awardsJa.push(...rankDataToAwards(rd));
    });
    console.log('[Career] awardsJa 集計完了:', awardsJa.length, '件',
      awardsJa.slice(0, 10).join(' / '));
  }

  // 捕手専用：盗塁阻止率が40%以上（単年）または37%以上（通算）はリーグNo.1タイトルとして追加
  // ※ league-leading の目安。ExcelのcsRate(row[54])を参照
  if (g_isCatcher) {
    const csRateVal  = parseFloat(row[54]);
    const isCareerRow = !/^\d{4}$/.test(String(row[1] ?? '').trim());
    const csThreshold = isCareerRow ? 37 : 40;
    if (!isNaN(csRateVal) && csRateVal >= csThreshold && !awardsJa.includes('盗塁阻止率No.1')) {
      awardsJa.push('盗塁阻止率No.1');
    }
  }

  const cardType  = buildCardType(row, awardsJa);

  // 年度別アワードキャッシュに保存（通算行は除外）
  if (!isCareer) _awardsJaByYear[yearKey] = awardsJa;

  // 変化球異名（投手のみ）
  const pitchNicknames = g_isPitcher ? (getPitchNicknames(g_mlbNameEn) || {}) : {};

  return { retsuden, cardType, pitchNicknames, awardsJa, isCareer };
}

/**
 * バナーにテキストをセットし、幅に合わせてフォントサイズを自動縮小する共通処理。
 */
function _setBannerText(bannerEl, text) {
  if (!bannerEl) return;
  if (!text) {
    bannerEl.textContent = '';
    bannerEl.style.display = 'none';
    return;
  }
  bannerEl.textContent = `タイトル: ${text}`;
  bannerEl.style.display = '';
  bannerEl.style.fontSize = '';
  bannerEl.style.letterSpacing = '';
  requestAnimationFrame(() => {
    let fs = 13;
    bannerEl.style.fontSize = `${fs}px`;
    bannerEl.style.letterSpacing = '2px';
    while (bannerEl.scrollWidth > bannerEl.offsetWidth && fs > 8) {
      fs -= 0.5;
      bannerEl.style.fontSize = `${fs}px`;
      if (fs <= 11) bannerEl.style.letterSpacing = '1px';
      if (fs <= 9)  bannerEl.style.letterSpacing = '0.5px';
    }
  });
}

/**
 * タイトル加点ボーナスを計算する。
 * 基本スコアが100以上の場合は加点しない。
 * 通算カードでは各タイトル種は複数受賞でも1回分のみカウント。
 */
function _calcTitleBonus(awardsJa, isCareer) {
  const BONUS_MAP = {
    MVP:5, WSMVP:3, LCSMVP:3, CY:5,
    ERA:2, K:2, W:2, SV:2, HLD:2,
    ROY:3, AVG:2, HR:2, RBI:2, SB:3,
    OPS:2, CSR:3, GG:2, SS:2,
    HAA:1, RC:1, CB:1,
  };
  let abbrs;
  if (isCareer) {
    // 通算: _awardsJaByYear の全アワード + _rankDataByYear のrank=1 を統合しタイプ別に重複除去
    const allAwards = Object.values(_awardsJaByYear).flat();
    const fromAwards = allAwards.map(a => _abbrevAward(a)).filter(Boolean);
    const rankKeyMap = { era:'ERA', k:'K', wins:'W', sv:'SV', hld:'HLD',
                         avg:'AVG', hr:'HR', rbi:'RBI', ops:'OPS', sb:'SB' };
    const fromRank = [];
    Object.values(_rankDataByYear).forEach(rd => {
      Object.entries(rankKeyMap).forEach(([key, abbr]) => {
        if (rd[key]?.rank === 1) fromRank.push(abbr);
      });
    });
    abbrs = [...new Set([...fromAwards, ...fromRank])];
  } else {
    // 単年: awardsJa をそのまま使用（同年で重複はないが念のため除去）
    abbrs = [...new Set(awardsJa.map(a => _abbrevAward(a)).filter(Boolean))];
  }
  const rawBonus = abbrs.reduce((sum, abbr) => sum + (BONUS_MAP[abbr] || 0), 0);
  // 通算カードは加点を半減（ROUND(÷2)）
  return isCareer ? Math.round(rawBonus / 2) : rawBonus;
}

/** スコア → 星数変換（_doGenerateと同じロジック） */
function _scoreToStars(score) {
  return score > 99 ? 6
       : score >= 90 ? 5
       : score >= 80 ? 4
       : score >= 70 ? 3
       : score >= 60 ? 2
       : score >= 50 ? 1 : 0;
}

/**
 * タイトル加点をDOMの総合力表示に反映する。
 * 基本スコアが100以上の場合は何もしない。
 * 星数が変わった場合はカードテーマごと再描画する。
 */
function _applyTitleBonus(awardsJa, isCareer) {
  const bonus = _calcTitleBonus(awardsJa, isCareer);
  if (bonus <= 0) return;

  // 100点以下は全加点、100点を超える分はROUND(超過分÷3)で計算
  let newScore;
  if (g_baseOverallScore >= 100) {
    // 既に100以上：全加点をROUND(÷3)で追加
    newScore = g_baseOverallScore + Math.round(bonus / 3);
  } else if (g_baseOverallScore + bonus > 100) {
    // 100を超える場合：100までは全点、超えた分をROUND(÷3)
    const over = (g_baseOverallScore + bonus) - 100;
    newScore = 100 + Math.round(over / 3);
  } else {
    // 100以内に収まる：全加点適用
    newScore = g_baseOverallScore + bonus;
  }
  const newStars = _scoreToStars(newScore);

  console.log(`[TitleBonus] base=${g_baseOverallScore} bonus=${bonus}${isCareer ? '(通算÷2)' : ''} → ${newScore} stars:${currentStars}→${newStars}`);

  if (newStars !== currentStars) {
    // 星数が変わった → テーマごと再描画
    _reapplyCardTheme(newScore);
  } else {
    // 同じ星数 → 数値のみ更新
    const powerEl = document.querySelector('#card-root .power-value');
    if (powerEl) {
      powerEl.textContent = String(newScore);
      if (newScore >= 100) powerEl.style.fontSize = '26px';
    }
  }
}

// 列伝エリアを更新（カード描画後に呼ぶ）
function updateRetsuden(text) {
  g_lastRetsuden = text || '';   // テーマ再適用時に再描画できるよう保存
  const el = document.getElementById('retsuden-area');
  if (!el) return;

  const normalized = (text || '').replace(/\\n/g, '\n');
  let segments = normalized.split('\n').map(l => l.trim()).filter(l => l);

  // ── 内部レンダリングヘルパー ──
  const render = (segs) => {
    const body = segs.map(s => escapeHtml(s)).join('　');
    el.innerHTML = `<strong>【列伝】</strong> ${body}`;
  };

  // ── オーバーフロー判定（scrollHeight へのアクセスがレイアウトを強制計算させる） ──
  const isOverflow = () => el.scrollHeight > el.clientHeight + 2;

  // ① まず全文表示
  render(segments);
  if (!isOverflow()) return;

  // ── Step 1: （）内の補足注釈を削除（mph→km/h変換優先・その他括弧説明除去） ──
  // ・"92.8mph（約149.3km/h）" → "約149km/h"  ← mph表記をkm/hに置換
  // ・"最速99.3mph（約159.8km/h）" → "最速約160km/h"
  // ・"身長5'11"（約180cm）" → "身長5'11""  ← km/h以外の括弧は除去
  const stripParens = (segs) =>
    segs.map(s => {
      // ① mphの後に（...km/h...）が続くパターン → km/h値のみ残す
      let r = s.replace(
        /(\d+(?:\.\d+)?)mph（([^）]{1,40})）/g,
        (_, mph, inner) => {
          const kmhM = inner.match(/(\d+(?:\.\d+)?)km\/h/);
          if (kmhM) {
            // 括弧内にkm/h値が明記されていればそれを採用
            return `約${Math.round(parseFloat(kmhM[1]))}km/h`;
          }
          // 明記なければ計算（1mph = 1.60934km/h）
          return `約${Math.round(parseFloat(mph) * 1.60934)}km/h`;
        }
      );
      // ② 単体のmph（括弧なし）→ km/hに変換
      r = r.replace(
        /(\d+(?:\.\d+)?)mph(?!（)/g,
        (_, mph) => `約${Math.round(parseFloat(mph) * 1.60934)}km/h`
      );
      // ③ 残りの（）補足を除去
      r = r.replace(/（[^）]{1,60}）/g, '').replace(/\s{2,}/g, ' ').trim();
      return r;
    });

  segments = stripParens(segments);
  render(segments);
  if (!isOverflow()) return;

  // ── Step 2: 複数文セグメントの末尾一文を削除（自然な文末を保つ） ──
  // 単一文（「。」が末尾のみ）は手を加えない → "組み合わせ。" "手にし。" を防止
  // 複数文ある場合のみ、最後の「。」の前の文末で切る
  const trimLastSentence = (segs) =>
    segs.map(s => {
      const lastDot  = s.lastIndexOf('。');
      if (lastDot < 0) return s; // 句点なし → そのまま
      const prevDot  = s.lastIndexOf('。', lastDot - 1);
      // 前の句点が存在し、かつ末尾句点と十分離れている（≥10字）場合のみ削る
      if (prevDot >= 0 && (lastDot - prevDot) >= 10) {
        return s.slice(0, prevDot + 1); // 自然な「。」で終わる
      }
      return s; // 単一文はそのまま → Step 3の丸ごと削除に委ねる
    });

  segments = trimLastSentence(segments);
  render(segments);
  if (!isOverflow()) return;

  // ── Step 3: 末尾セグメントを1つずつ削除（最低1行は残す） ──
  while (segments.length > 1) {
    segments = segments.slice(0, -1);
    render(segments);
    if (!isOverflow()) return;
  }

  // ── Step 4: 1セグメントになっても収まらない場合 ──
  // セグメント内に複数文あれば前の文末まで切る。それでも駄目なら強制カット
  let seg = segments[0];
  // Step 4a: セグメント内の途中の「。」で切る
  const dotIdx = seg.lastIndexOf('。', seg.length - 2); // 末尾の「。」の一つ前を探す
  if (dotIdx > 10) {
    render([seg.slice(0, dotIdx + 1)]);
    if (!isOverflow()) return;
    seg = seg.slice(0, dotIdx + 1);
  }
  // Step 4b: それでも収まらなければ10文字ずつ削る
  while (seg.length > 20) {
    seg = seg.slice(0, -10);
    const cutAt = Math.max(seg.lastIndexOf('。'), seg.lastIndexOf('」'));
    const shortened = cutAt > 10 ? seg.slice(0, cutAt + 1) : seg.trimEnd() + '…';
    render([shortened]);
    if (!isOverflow()) return;
  }
}

function buildFallbackRetsuden(row) {
  const year = row[1] || '?';
  const name = row[0] || '---';

  if (g_isPitcher) {
    const era  = parseFloat(row[5]) || 99;
    const wins = row[3]  || 0;
    const loss = row[4]  || 0;
    const k    = row[15] || 0;
    const whip = row[17] || '--';
    const ip   = row[10] || '--';
    const totalG = row[6] || 0;
    const gs     = row[7] || 0;
    const strk = row[54] || 0;
    const ctrl = row[51] || 0;

    const isStarter = gs >= totalG * 0.5;
    const typeLabel = isStarter ? '先発' : 'リリーフ';

    if (!isStarter && era < 2.50) {
      return `${year}年、防御率${row[5]}・WHIP${whip}・${k}奪三振。チームの勝利の方程式を支えた絶対的${typeLabel}。`;
    }
    if (era < 2.50 && wins >= 15) {
      return `${year}年、${wins}勝${loss}敗・防御率${row[5]}・${k}奪三振。WHIP${whip}でリーグを圧倒。`;
    }
    if (strk >= 90) {
      return `${year}年、${wins}勝・防御率${row[5]}・${k}奪三振。剛腕で相手打線を翻弄したシーズン。`;
    }
    return `${year}年、${wins}勝${loss}敗・防御率${row[5]}・${k}奪三振・WHIP${whip}。チームを支えた安定感。`;
  } else {
    const avg  = fmtRate(row[15]);
    const obp  = fmtRate(row[16]);
    const ops  = fmtOPS(row[17]);
    const opsN = parseFloat(ops) || 0;
    const hr   = row[9]  || 0;
    const rbi  = row[10] || 0;
    const sb   = getSB(row);
    const speed  = row[46] || 0;

    if (g_isCatcher) {
      const lead   = row[53] ?? '--';
      const csRate = row[54] ?? '--';
      return `${year}年、打率${avg}・OPS${ops}・打点${rbi}。リード${lead}・盗塁阻止率${csRate}%でバッテリーを統率。`;
    }
    if (opsN >= 1.0 || hr >= 50) {
      return `${year}年、${hr}本塁打・${rbi}打点・OPS${ops}。出塁率${obp}と長打力でチームを牽引したシーズン。`;
    }
    if (hr >= 30) {
      return `${year}年、${hr}本塁打・${rbi}打点・打率${avg}・OPS${ops}。長打と安打でクリーンアップを担った。`;
    }
    if (speed >= 80 && sb >= 20) {
      return `${year}年、打率${avg}・${sb}盗塁・出塁率${obp}。俊足を武器に打線を活性化させたシーズン。`;
    }
    return `${year}年、打率${avg}・OPS${ops}・${hr}本塁打・${rbi}打点。チームの中軸として活躍したシーズン。`;
  }
}

/**
 * blob: URL または通常の画像URL を base64 data URL に変換する。
 * Canvas 経由で描画し JPEG として出力。変換不可の場合は空文字を返す。
 */
function imgSrcToDataUrl(src) {
  return new Promise((resolve) => {
    if (!src || src === '') { resolve(''); return; }
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        canvas.width  = img.naturalWidth  || img.width;
        canvas.height = img.naturalHeight || img.height;
        canvas.getContext('2d').drawImage(img, 0, 0);
        resolve(canvas.toDataURL('image/jpeg', 0.88));
      } catch (e) {
        // tainted canvas（外部ドメイン画像など）は無視
        resolve('');
      }
    };
    img.onerror = () => resolve('');
    img.src = src;
  });
}

function generateCard() {
  clearError();

  const excelInput = document.getElementById('excel-file');
  const photoInput = document.getElementById('photo-file');

  if (!excelInput.files || !excelInput.files[0]) {
    showError('❌ エクセルファイルを選択してください。');
    return;
  }

  // すでにg_rowsが読み込まれている場合はそれを使う
  if (g_rows && g_dataRows) {
    _doGenerate(photoInput);
    return;
  }

  // 未読み込みの場合は読み込む
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const wb   = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const ws   = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
      if (rows.length < 3) {
        showError('❌ データが少なすぎます。正しいエクセルファイルか確認してください。');
        return;
      }
      g_rows     = rows;
      g_headers  = rows.slice(0, 2);
      g_dataRows = rows.slice(2).filter(r => r[0] && r[0] !== null);
      g_isPitcher = rows[0][3] === '勝利' || rows[0][3] === '勝';
      g_isCatcher = !g_isPitcher && g_dataRows.some(r =>
        r[53] !== null && r[53] !== undefined && r[53] !== '--' && String(r[53]).trim() !== '');
      _doGenerate(photoInput);
    } catch (err) {
      showError('❌ 読み込みエラー: ' + err.message);
      console.error(err);
    }
  };
  reader.readAsArrayBuffer(excelInput.files[0]);
}

/**
 * チームコードを標準表記に正規化する。
 * BRefや入力データで使われる非標準略称を公式略称に変換する。
 * 例: "NEW"→"NYY", "SAN"→"SF", "TAM"→"TB"
 */
function normalizeTeamCode(code) {
  if (!code) return code;
  const s = String(code).trim().toUpperCase();
  // 表示用の略称正規化のみ行う（末尾数字は除去しない: "SEA2"はそのまま"SEA2"）
  const MAP = {
    'ST.':  'STL',  // St. Louis Cardinals
    'TAM':  'TB',   // Tampa Bay Rays/Devil Rays
    'NEW':  'NYY',  // New York Yankees
    'KAN':  'KC',   // Kansas City Royals
    'SAN':  'SF',   // San Francisco Giants
    'WAS':  'WSH',  // Washington Nationals
    'LOS':  'LAD',  // Los Angeles Dodgers
    // CHIはカブス(CHC)とホワイトソックス(CWS)で曖昧なため自動変換しない
  };
  return MAP[s] || s;
}

/**
 * 野手裏面カードのチーム表示
 * 複数球団年（移籍あり）の場合: 最多試合チームコード + 総球団数 例: "NYY3"
 * 単一球団年の場合: そのままのチームコード 例: "NYY"
 */
function hitterTeamDisplay(row, allRows) {
  const year    = String(row[1] ?? '');
  const teamRaw = normalizeTeamCode(String(row[2] || ''));
  const sameYear = allRows.filter(r => String(r[1] ?? '') === year);
  const nonTot   = sameYear.filter(r => normalizeTeamCode(String(r[2] || '')) !== 'TOT');
  if (nonTot.length <= 1) return teamRaw;
  // 複数球団: G 最多のチームをプライマリとし、球団総数を付与
  const primary = nonTot.reduce((best, r) =>
    (parseInt(r[6]) || 0) > (parseInt(best[6]) || 0) ? r : best, nonTot[0]);
  const primaryCode = normalizeTeamCode(String(primary[2] || ''));
  if (teamRaw === 'TOT') return primaryCode + nonTot.length;
  return teamRaw;
}

/**
 * 通算行のチーム表示: キャリアを通じて最も試合数が多いチームコードを返す。
 * 複数チームで同一年に在籍した場合は TOT/合算行を除いた個別行を使用。
 * @param {Array[]} allRows   g_dataRows
 * @param {boolean} isPitcher 投手なら true（現在は使用しないが将来の拡張用に残す）
 */
function careerPrimaryTeam(allRows, isPitcher) {
  const isCareer = r => !/^\d{4}$/.test(String(r[1] ?? '').trim());
  const isTot    = r => {
    const t = String(r[2] || '').trim().toUpperCase().replace(/\s+/g, '');
    return t === 'TOT' || /^\d+(TM|TMS|TEAMS?)$/i.test(t);
  };
  // 単年・個別チーム行のみ対象
  const singles = allRows.filter(r => !isCareer(r) && !isTot(r));
  if (!singles.length) return '--';

  // チームごとに「在籍シーズン数」を集計（投手のr[6]はGS/G/IPが混在するため行数で判定）
  // "SEA2"→"SEA" のように末尾数字を除去してからチーム名を正規化（集計用のみ）
  const seasonsMap = {};
  singles.forEach(r => {
    const raw  = String(r[2] || '').trim().toUpperCase().replace(/\d+$/, ''); // 末尾数字除去
    const team = normalizeTeamCode(raw); // 略称正規化（"NEW"→"NYY" 等）
    if (!team) return;
    seasonsMap[team] = (seasonsMap[team] || 0) + 1; // 1行 = 1シーズン
  });

  // 最多在籍シーズンのチームを返す
  const result = Object.entries(seasonsMap).reduce(
    (best, [team, s]) => s > best[1] ? [team, s] : best,
    ['--', -1]
  )[0];
  console.log('[CareerTeam DEBUG] チーム別在籍年数:', JSON.stringify(seasonsMap), '→ 最多:', result);
  return result;
}

// ── 順位ランクHTML生成 ──
// style='career' → 緑色・歴代順位バッジ
// rank 1-3     → 金/銀/銅グロー
// rank 4-7     → 赤グロー
// それ以外     → 装飾なし（元テキストをそのまま返す）
function _rankWrapHtml(val, rank, style = null) {
  if (style === 'career') {
    return `<span class="rank-val rank-val-career">${val}</span>` +
           `<span class="rank-badge rank-badge-career">${rank}</span>`;
  }
  if (rank < 1 || rank > 7) return val;
  return `<span class="rank-val rank-val-${rank}">${val}</span>` +
         `<span class="rank-badge rank-badge-${rank}">${rank}</span>`;
}

// ── 通算行：MLBキャリア歴代順位を非同期取得してDOMに適用 ──────────────────────────
/**
 * MLB Stats API の career leaders を各カテゴリ取得し、
 * _careerRankData にランクを格納してから _applyCareerRowRanks() を呼ぶ。
 * @param {string} mlbId  MLB選手ID
 * @param {boolean} isPitcher
 */
async function _fetchAndApplyCareerRanks(mlbId, isPitcher) {
  if (!mlbId) return;
  const cats = isPitcher
    ? ['earnedRunAverage','wins','holds','saves','inningsPitched','strikeouts',
       'battingAverageAgainst','walksAndHitsPerInningPitched']
    : ['gamesPlayed','atBats','hits','homeRuns','runsBattedIn',
       'baseOnBalls','stolenBases','battingAverage','onBasePercentage','onBasePlusSlugging'];
  const statGroup = isPitcher ? 'pitching' : 'hitting';
  const catStr = cats.join(',');
  try {
    const url = `https://statsapi.mlb.com/api/v1/stats/leaders` +
      `?leaderCategories=${catStr}&sportId=1&statType=career` +
      `&statGroup=${statGroup}&limit=100`;
    const res = await fetch(url);
    if (!res.ok) { console.warn('[CareerRank] HTTP', res.status); return; }
    const data = await res.json();
    (data.leagueLeaders || []).forEach(cat => {
      const leaders = cat.leaders || [];
      const entry = leaders.find(l => Number(l.person?.id) === Number(mlbId));
      if (!entry) return;
      const rank = parseInt(String(entry.rank).replace(/\D/g,''), 10) || 99;
      if (rank <= 99) {
        _careerRankData[cat.leaderCategory] = { rank, value: entry.value };
        console.log(`[CareerRank] ${cat.leaderCategory}: rank=${rank}`);
      }
    });
    _applyCareerRowRanks();
    // 率系歴代順位が API で確定したので、通算列伝の該当テキストを再構築して更新
    if (_careerRetsudenRebuildParams) {
      const { row, mlbData, rankData, trajectory, wikiEpisodes } = _careerRetsudenRebuildParams;
      const newRetsuden = buildRetsudenFromMLBData(row, mlbData, rankData, trajectory, wikiEpisodes);
      updateRetsuden(newRetsuden);
      console.log('[CareerRank] 通算列伝を率系API順位で再構築完了');
    }
  } catch(e) {
    console.warn('[CareerRank] 取得失敗:', e.message);
  }
}

/**
 * 既に描画済みの通算行セルに歴代順位バッジ（緑）を適用する。
 * _careerRankData が更新されるたびに呼び出す。
 */
function _applyCareerRowRanks() {
  const backFace = document.getElementById('card-back-face');
  if (!backFace) return;
  backFace.querySelectorAll('td[data-career-key]').forEach(td => {
    const key = td.dataset.careerKey;
    const val = td.dataset.careerVal ?? '';
    const entry = _careerRankData[key];
    if (entry && entry.rank >= 1 && entry.rank <= 99) {
      td.setAttribute('data-career-rank', entry.rank);
      td.innerHTML = _rankWrapHtml(escapeHtml(val), entry.rank, 'career');
    } else {
      td.removeAttribute('data-career-rank');
      td.innerHTML = escapeHtml(val);
    }
  });
}

// 既に描画済みの裏面テーブルに王冠マークを適用（DOM更新）
function _applyBackTableCrowns() {
  const backFace = document.getElementById('card-back-face');
  if (!backFace) return;
  backFace.querySelectorAll('td[data-statkey][data-year]').forEach(td => {
    const year  = td.dataset.year;
    const key   = td.dataset.statkey;
    const val   = td.dataset.val ?? '';        // 元の数値テキスト
    const rdYear = _rankDataByYear[year];
    if (!rdYear) return;
    const entry = rdYear[key];
    const rank  = entry ? entry.rank : 99;
    if (rank <= 7) {
      td.setAttribute('data-rank', rank);
      td.innerHTML = _rankWrapHtml(val, rank);
    } else {
      td.removeAttribute('data-rank');
      td.innerHTML = val;                      // 装飾なし→元テキストに戻す
    }
  });
}

// 未取得年度のリーグ順位データを非同期で一括取得し、王冠マークを更新
async function _enrichBackCrownsAsync() {
  if (!g_dataRows || !g_mlbId) return;
  const _capturedGenId = g_genId; // このカード生成のIDを保持
  const hdr = g_headers ? g_headers[0] || [] : [];

  // 未取得年度とその行データを収集
  // 年度ごとに全行を保持し、チームコード取得時にTOT行を避ける
  const yearRowsAll = {};
  g_dataRows.forEach(r => {
    const y = String(r[1] ?? '');
    if (/^\d{4}$/.test(y)) {
      if (!yearRowsAll[y]) yearRowsAll[y] = [];
      yearRowsAll[y].push(r);
    }
  });

  // 未取得年度のみ処理
  const years = Object.keys(yearRowsAll)
    .filter(y => !_rankDataByYear[y])
    .sort();
  if (years.length === 0) {
    // 全年度取得済み：王冠・通算バナーを即時更新して終了
    _applyBackTableCrowns();
    if (_capturedGenId === g_genId) _refreshCareerBanner();
    // 通算歴代順位を取得（年度別とは独立して実行）
    if (g_mlbId) {
      Object.keys(_careerRankData).forEach(k => delete _careerRankData[k]);
      _fetchAndApplyCareerRanks(g_mlbId, g_isPitcher);
    }
    return;
  }

  // 全年度を並列フェッチ（速度優先。件数は最大20年程度なので並列でも問題なし）
  const fetchOne = async (year) => {
    if (_rankDataByYear[year]) return;  // 取得済みならスキップ
    try {
      const rows = yearRowsAll[year];
      const totRow = rows.find(r => String(r[2] ?? '').toUpperCase() === 'TOT') || rows[rows.length - 1];
      const teamRow = rows.find(r => {
        const tc = String(r[2] ?? '').toUpperCase();
        return tc !== 'TOT' && tc !== '' && tc !== '--';
      }) || rows[0];
      const { leagueId } = getLeagueInfo(String(teamRow[2] ?? ''));
      const leaders = await fetchLeagueLeaders(year, g_isPitcher, leagueId);
      _rankDataByYear[year] = buildRankData(leaders, g_mlbId, '', {});
      console.log(`[Crowns] ${year} L=${leagueId}`, JSON.stringify(_rankDataByYear[year]));
    } catch (e) {
      console.warn(`[Crowns] ${year} 取得失敗:`, e.message);
      _rankDataByYear[year] = {};
    }
    _applyBackTableCrowns();  // 各年度完了次第即座に更新
  };
  await Promise.all(years.map(fetchOne));

  // 全年度完了後：最終まとめ更新 + 通算バナー再描画
  _applyBackTableCrowns();
  // 世代IDが変わっていなければ（別カードが生成されていなければ）バナー更新
  if (_capturedGenId === g_genId) _refreshCareerBanner();

  // 通算行：歴代順位を非同期取得（年度別フェッチと並行して開始）
  // _careerRankData をリセットして新しい選手のデータを取得
  if (g_mlbId) {
    Object.keys(_careerRankData).forEach(k => delete _careerRankData[k]);
    _fetchAndApplyCareerRanks(g_mlbId, g_isPitcher);
  }
}

// 裏面HTMLを生成してDOMに注入
function buildAndAttachCardBack() {
  const backFace = document.getElementById('card-back-face');
  if (!backFace || !g_dataRows || !g_headers) return;

  const hdr  = g_headers[0] || [];
  const name = (g_dataRows[0] && g_dataRows[0][0]) ? String(g_dataRows[0][0]) : '';

  // 通算行判定: 年度が4桁数字でない行（"通算"/"Career"等）
  const isCareerRow = r => !/^\d{4}$/.test(String(r[1] ?? '').trim());

  // 通算行のWAR: _doGenerateで事前計算済みの g_careerWAR を使用
  // （未計算の場合はここで加重平均を再計算してフォールバック）
  const _careerWAR = g_careerWAR ?? (() => {
    const yr2r = {};
    g_dataRows.filter(r => !isCareerRow(r)).forEach(r => {
      const yr = String(r[1] ?? '');
      if (yr) { if (!yr2r[yr]) yr2r[yr] = []; yr2r[yr].push(r); }
    });
    const cRows = Object.values(yr2r).map(rows => {
      const tot = rows.find(r => String(r[2] || '').toUpperCase() === 'TOT');
      return tot || rows[0];
    });
    const getWt = r => {
      if (g_isPitcher) return parseFloat(r[10]) || 0;
      const ab = parseFloat(getFirstColVal(r, hdr, ['AB','打数','At Bats']));
      return isNaN(ab) ? 0 : ab;
    };
    let wS = 0, wT = 0;
    cRows.forEach(row => {
      const raw = resolveWAR(row, hdr, g_isPitcher);
      const num = parseFloat(String(raw ?? '').replace('~', ''));
      const w   = getWt(row);
      if (!isNaN(num) && w > 0) { wS += num * w; wT += w; }
    });
    return wT > 0 ? (wS / wT).toFixed(1) : null;
  })();

  // ── 列定義 ──
  let cols;
  // 通算行に使うチーム: _doGenerateで事前計算済みの g_careerTeam を使用
  // （未計算の場合のみここで再計算）
  const _careerTeam = normalizeTeamCode(g_careerTeam ?? careerPrimaryTeam(g_dataRows, g_isPitcher));

  if (g_isPitcher) {
    cols = [
      { label: '年度',   fn: r => r[1] ?? '--' },
      { label: 'チーム', fn: r => isCareerRow(r) ? _careerTeam : normalizeTeamCode(String(r[2] ?? '')) || '--' },
      { label: '防御率', fn: r => r[5] ?? '--',                                                         careerKey: 'earnedRunAverage' },
      { label: '勝利',   fn: r => r[3] ?? '--',                                                         careerKey: 'wins' },
      { label: '敗北',   fn: r => r[4] ?? '--' },
      { label: 'HLD',    fn: r => getFirstColVal(r, hdr, ['HLD','ホールド','H','Hold']),                careerKey: 'holds' },
      { label: 'SV',     fn: r => getFirstColVal(r, hdr, ['SV','セーブ','Saves','Save','S']),           careerKey: 'saves' },
      { label: 'IP',     fn: r => r[10] ?? '--',                                                        careerKey: 'inningsPitched' },
      { label: '被HR',   fn: r => getFirstColVal(r, hdr, ['被本塁打','HR','HRA','HR_A']) },
      { label: '四死球', fn: r => getFirstColVal(r, hdr, ['四死球','BB','四球','BBI','BB+HBP']) },
      { label: 'K',      fn: r => r[15] ?? '--',                                                        careerKey: 'strikeouts' },
      { label: '被打率', fn: r => getFirstColVal(r, hdr, ['被打率','BAA','AVG Against','OBA']),         careerKey: 'battingAverageAgainst' },
      { label: 'FIP',    fn: r => fmtFIP(r) },
      { label: 'WHIP',   fn: r => r[17] ?? '--',                                                        careerKey: 'walksAndHitsPerInningPitched' },
      { label: 'WAR',    fn: r => isCareerRow(r) ? (_careerWAR ?? '--') : fmtWAR(resolveWAR(r, hdr, true)) },
    ];
  } else {
    cols = [
      { label: '年度',   fn: r => r[1] ?? '--' },
      { label: 'チーム', fn: r => isCareerRow(r) ? _careerTeam : hitterTeamDisplay(r, g_dataRows) },
      { label: '試合',   fn: r => { const g = getHitterGames(r, hdr); return g || '--'; },              careerKey: 'gamesPlayed' },
      { label: '打数',   fn: r => getFirstColVal(r, hdr, ['AB','打数','At Bats']),                      careerKey: 'atBats' },
      { label: '安打',   fn: r => getFirstColVal(r, hdr, ['H','安打','Hits']),                          careerKey: 'hits' },
      { label: '本塁打', fn: r => r[9] ?? '--',                                                         careerKey: 'homeRuns' },
      { label: '打点',   fn: r => r[10] ?? '--',                                                        careerKey: 'runsBattedIn' },
      { label: '四球',   fn: r => getFirstColVal(r, hdr, ['BB','四球','Walks','BB+HBP']),               careerKey: 'baseOnBalls' },
      { label: '三振',   fn: r => getFirstColVal(r, hdr, ['SO','K','三振','Strikeouts']) },
      { label: '盗塁',   fn: r => getSB(r, hdr),                                                        careerKey: 'stolenBases' },
      { label: '打率',   fn: r => fmtRate(r[15]),                                                       careerKey: 'battingAverage' },
      { label: '出塁率', fn: r => fmtRate(r[16]),                                                       careerKey: 'onBasePercentage' },
      { label: 'OPS',    fn: r => fmtOPS(r[17]),                                                        careerKey: 'onBasePlusSlugging' },
      { label: 'WAR',    fn: r => isCareerRow(r) ? (_careerWAR ?? '--') : fmtWAR(resolveWAR(r, hdr, false)) },
    ];
  }

  // ── ハイライト列の定義 ──
  // 投手: WARをcb-hi、防御率・勝利・SV・Kをcb-pp
  // 野手: WAR・OPS・出塁率をcb-hi、打率・本塁打・打点をcb-pp
  const hiLabels = g_isPitcher
    ? new Set(['WAR'])
    : new Set(['WAR', 'OPS', '出塁率']);
  const ppLabels = g_isPitcher
    ? new Set(['防御率', '勝利', 'SV', 'K'])
    : new Set(['打率', '本塁打', '打点']);

  // ── 列名 → rankDataキー マッピング（年度別リーグ順位） ──
  const _COL_RANK_MAP = {
    '防御率':'era', '勝利':'wins', 'SV':'sv', 'K':'k', 'WHIP':'whip', 'HLD':'hld',
    '打率':'avg', '本塁打':'hr', '打点':'rbi', '盗塁':'sb', 'OPS':'ops', 'WAR':'war',
  };

  // ── テーブルHTML ──
  const thead = '<tr>' + cols.map(c => `<th>${escapeHtml(c.label)}</th>`).join('') + '</tr>';
  const tbody = g_dataRows.map(row => {
    const rowYear = String(row[1] ?? '');
    const rdYear  = /^\d{4}$/.test(rowYear) ? (_rankDataByYear[rowYear] || null) : null;
    const cells = cols.map((c, i) => {
      const v = c.fn(row);
      const s = (v === null || v === undefined || v === '') ? '--' : String(v);
      let cls = '';
      if      (i === 0)               cls = ' class="cb-year"';
      else if (i === 1)               cls = ' class="cb-team"';
      else if (hiLabels.has(c.label)) cls = ' class="cb-hi"';
      else if (ppLabels.has(c.label)) cls = ' class="cb-pp"';
      // 王冠マーク
      const rankKey   = _COL_RANK_MAP[c.label];
      const rankEntry = (rankKey && rdYear) ? rdYear[rankKey] : null;
      const rank      = rankEntry ? rankEntry.rank : 99;
      // 年度別リーグ順位（1-7 に拡張）
      const rankAttrs = rankKey
        ? ` data-statkey="${rankKey}" data-year="${rowYear}" data-val="${escapeHtml(s)}"` +
          (rank <= 7 ? ` data-rank="${rank}"` : '')
        : '';
      // 通算行: 歴代順位バッジ用に data-career-key / data-career-val を付与
      const careerAttrs = (isCareerRow(row) && c.careerKey)
        ? ` data-career-key="${c.careerKey}" data-career-val="${escapeHtml(s)}"`
        : '';
      // 初期表示: 年度行は rank≤7 で装飾、通算行は後で _applyCareerRowRanks() が更新
      const inner = (rank <= 7 && rankKey && !isCareerRow(row))
        ? _rankWrapHtml(escapeHtml(s), rank)
        : escapeHtml(s);
      return `<td${cls}${rankAttrs}${careerAttrs}>${inner}</td>`;
    });
    return '<tr>' + cells.join('') + '</tr>';
  }).join('');

  // 投球腕・打席の表示テキストを生成
  const _handCode2Ja = c => c === 'L' ? '左' : c === 'R' ? '右' : c === 'S' ? '両' : '';
  let handLabel = '';
  if (g_pitchHand || g_batSide) {
    const ph = _handCode2Ja(g_pitchHand);
    const bs = _handCode2Ja(g_batSide);
    if (g_isPitcher && ph) {
      handLabel = `${ph}投${bs ? bs + '打' : ''}`;
    } else if (!g_isPitcher && (ph || bs)) {
      handLabel = `${ph ? ph + '投' : ''}${bs ? bs + '打' : ''}`;
    }
  }
  const handHtml = handLabel
    ? `<span class="card-back-banner-hand">${escapeHtml(handLabel)}</span>`
    : `<span></span>`; // レイアウト維持用の空スパン

  backFace.innerHTML =
    `<div class="card-back-card">` +
      `<div class="card-back-banner">` +
        `<div class="card-back-banner-center">` +
          `<span class="card-back-banner-name">${escapeHtml(name)}</span>` +
          `<span class="card-back-banner-sep">|</span>` +
          `<span class="card-back-banner-label">年度別成績</span>` +
        `</div>` +
        handHtml +
      `</div>` +
      `<div class="card-back-scroll">` +
        `<table class="card-back-tbl">` +
          `<thead>${thead}</thead><tbody>${tbody}</tbody>` +
        `</table>` +
      `</div>` +
    `</div>`;

  // 未取得年度の順位データを非同期で補完し、王冠マークを更新
  _enrichBackCrownsAsync();

  // 裏面 face クリックで表面へ（右端 ~38px＝約1cm はスクロールバー領域のため除外）
  backFace.style.cursor = 'pointer';
  backFace.addEventListener('click', function(e) {
    const rect = backFace.getBoundingClientRect();
    if (e.clientX > rect.right - 38) return;  // 右端1cmはフリップしない
    flipToFront();
  });
}

                + (seasonRight ? seasonRight.offsetWidth + 10 : 100)
                + 30; // gap 等の余裕

      if (fs <= 14) ls = 0;

      fnEl.style.letterSpacing = ls + 'px';
    }
  }
