// ── BRef ページ貼り付け解析（ペースト方式） ──
// ユーザーがBRefページをCtrl+A→Ctrl+CしてCtrl+Vした際に呼ばれる
function _initBRefPasteArea() {
  const area = document.getElementById('bref-paste-area');
  if (!area || area._pasteInitialized) return;
  area._pasteInitialized = true;
  area.addEventListener('paste', function(e) {
    e.preventDefault();
    const statusEl = document.getElementById('bref-paste-status');
    if (!g_brefId) {
      statusEl.style.color = '#ff8888';
      statusEl.textContent = 'BRef IDを先に設定してください';
      return;
    }
    const html  = e.clipboardData.getData('text/html');
    const plain = e.clipboardData.getData('text/plain');

    const byteSize = Math.max((html||'').length, (plain||'').length);
    area.value = `解析中… (HTML:${Math.round((html||'').length/1024)}KB / TEXT:${Math.round((plain||'').length/1024)}KB 受信)`;
    statusEl.style.color = '#ffd700';
    statusEl.textContent = '解析中...';

    setTimeout(() => {
      try {
        let result = { warCount: 0, years: [] };

        // ① レンダリングページコピー（Ctrl+A+C）: clipboard HTMLにdata-stat属性がある
        if (html) {
          result = _parseBRefPastedHtml(html, g_brefId, g_isPitcher ?? false);
          if (result.warCount > 0) console.log('[BRef貼り付け] HTML解析で取得');
        }

        // ② ソースページコピー（Ctrl+U → Ctrl+A+C）: plain textにHTML全文が入る
        if (result.warCount === 0 && plain && plain.includes('<table')) {
          result = _parseBRefPastedHtml(plain, g_brefId, g_isPitcher ?? false);
          if (result.warCount > 0) console.log('[BRef貼り付け] ソースHTMLで取得');
        }

        // ③ タブ区切りテキスト解析（WAR精度向上・FIP補完のため常時実行）
        // ※HTMLパスでWARが取れた場合も実行し、BRef表示値でWARを上書き・FIPを補完する
        if (plain && !plain.includes('<table')) {
          const textResult = _parseBRefPlainText(plain, g_brefId);
          if (textResult.warCount > 0) {
            if (result.warCount === 0) {
              result.years = Object.keys(_brefCache[g_brefId]).filter(k => /^\d{4}$/.test(k)).sort();
            }
            result.warCount = Math.max(result.warCount, textResult.warCount);
            console.log('[BRef貼り付け] タブ区切りテキストでWAR確定（精度向上）');
          }
          if (textResult.fipCount > 0) {
            result.fipCount = (result.fipCount || 0) + textResult.fipCount;
            console.log('[BRef貼り付け] タブ区切りテキストでFIP補完:', textResult.fipCount, '年分');
          }
        }

        if (result.warCount > 0) {
          statusEl.style.color = '#77cc88';
          const fipNote = result.fipCount > 0 ? `・FIP ${result.fipCount}年分` : '';
          statusEl.textContent = `✓ WAR ${result.warCount}年分${fipNote} 取得しました！`;
          area.value = `✓ WAR ${result.warCount}年分${fipNote} 取得完了 (${result.years.join(', ')})`;
          refreshPeakYear();
          document.getElementById('war-manual-section').style.borderColor = '#3a6';
        } else {
          statusEl.style.color = '#ff8888';
          statusEl.textContent = `⚠️ WARデータが見つかりませんでした（HTML:${Math.round((html||'').length/1024)}KB / TEXT:${Math.round((plain||'').length/1024)}KB受信）`;
          area.value = `✗ WARデータ未検出`;
        }
      } catch(err) {
        statusEl.style.color = '#ff8888';
        statusEl.textContent = `エラー: ${err.message}`;
        area.value = `✗ エラー発生`;
        console.error('[BRef貼り付け] パースエラー:', err);
      }
    }, 50);
  });
}

/**
 * BRefページのHTML/テキストを解析してWAR・FIPデータを _brefCache に格納する
 * @returns {{ warCount: number, fipCount: number }}
 */
function _parseBRefPastedHtml(content, brefId, isPitcher) {
  if (!content || !brefId) return { warCount: 0, fipCount: 0, years: [] };

  // HTML コメント内に隠れているテーブルを展開（ソース貼り付け時に重要）
  const allHtml = content.replace(/<!--([\s\S]*?)-->/g, '$1');
  const doc = new DOMParser().parseFromString(allHtml, 'text/html');

  console.log('[BRef貼り付け] テーブル数:', doc.querySelectorAll('table').length);

  if (!_brefCache[brefId]) _brefCache[brefId] = {};

  // 選手名抽出（あれば）
  const h1El = doc.querySelector('h1[itemprop="name"] span, h1 span, h1');
  if (h1El && h1El.textContent.trim().length > 2) {
    _brefCache[brefId].nameEn = h1El.textContent.trim();
    console.log('[BRef貼り付け] 選手名:', _brefCache[brefId].nameEn);
  }

  // ── 選手写真URL抽出（貼り付けHTMLにheadshot imgが含まれる場合に自動取得） ──
  // BRef URL例: https://www.baseball-reference.com/req/2025011210/images/headshots/2/26c834ff_sabr.jpg
  // 優先タイプ: sabr > br > mlbam > davis（より良質な写真を優先）
  // ※ _BREF_HASHES 未登録の選手でもBRefページ貼り付けで写真URLを自動取得できる
  if (!_brefCache[brefId].photoUrl) {
    const TYPE_PRIORITY = ['sabr', 'br', 'mlbam', 'davis', 'milb'];
    let bestPhoto = null;
    let bestPriority = Infinity;
    // DOMParser の img.src はベースURLが about:blank のため getAttribute を使用
    doc.querySelectorAll('img[src]').forEach(img => {
      const raw = img.getAttribute('src') || '';
      // クリップボードHTMLには通常絶対URL, ソース貼り付け時はパスのみの場合もある
      const m = raw.match(/(?:https?:\/\/www\.baseball-reference\.com)?\/req\/\d+\/images\/headshots\/[0-9a-f]\/([0-9a-f]{8})_(\w+)\.jpg/i);
      if (!m) return;
      const type = m[2].toLowerCase();
      const pri = TYPE_PRIORITY.indexOf(type);
      if (pri !== -1 && pri < bestPriority) {
        bestPriority = pri;
        // 相対パスの場合は絶対URLに変換
        bestPhoto = raw.startsWith('http') ? raw : `https://www.baseball-reference.com${raw}`;
      }
    });
    if (bestPhoto) {
      _brefCache[brefId].photoUrl = bestPhoto;
      console.log('[BRef貼り付け] 写真URL自動取得:', bestPhoto);
    }
  }

  // テーブル行パースヘルパー
  const parseTable = (tableEl, callback) => {
    if (!tableEl) return;
    tableEl.querySelectorAll('tbody tr').forEach(tr => {
      if (tr.classList.contains('thead') || tr.classList.contains('minors_table')) return;
      // th と td の両方を探す（新旧BRefフォーマット両対応: year_ID / year_id）
      const yearEl = tr.querySelector('[data-stat="year_ID"], [data-stat="year_id"]');
      const year = yearEl ? yearEl.textContent.replace(/\D/g, '').trim() : '';
      if (!year || year.length !== 4) return;
      const get = stat => {
        const td = tr.querySelector(`td[data-stat="${stat}"]`);
        return td ? td.textContent.trim() : null;
      };
      // "TOT" / "2TM" / "3TM" / "2 Teams" / "2 TM" 等すべてを合算行と判定
      // 新BRefフォーマット: team_name_abbr / 旧: team_ID
      const teamRaw = (tr.querySelector('[data-stat="team_ID"], [data-stat="team_name_abbr"], [data-stat="team_id"]')?.textContent ?? '')
        .trim().toUpperCase().replace(/\s+/g, '');
      const isTotRow = teamRaw === 'TOT' || /^\d+(TM|TMS|TEAMS?)$/i.test(teamRaw);
      callback(year, get, isTotRow);
    });
  };

  // WAR テーブルを探す
  // 投手ページには pitching_value（投球WAR）と batting_value（打撃WAR）の両方がある。
  // batting_value が先に来ると打撃WARを拾ってしまうため、投手時は pitching_value を優先する。
  // 優先順: ① id が "pitching_value" / "batting_value" / "fielding_value" のいずれかに合致するテーブル
  //         ② それ以外の WAR 含有テーブル（フォールバック）
  // 新BRefフォーマット: b_war(野手) / p_war(投手)  旧: WAR / WAR_bat / rWAR / bWAR
  const warStatNames = ['WAR', 'WAR_bat', 'rWAR', 'bWAR', 'b_war', 'p_war'];
  let warCount = 0;
  let warStatUsed = '';

  // 投手: players_value_pitching / pitching_value を優先、野手: players_value_batting / batting_value を優先
  // 新旧両フォーマットに対応
  const allTables = Array.from(doc.querySelectorAll('table'));
  const preferredIds = isPitcher
    ? ['pitching_value', 'players_value_pitching']
    : ['batting_value',  'players_value_batting'];
  const excludedIds  = isPitcher
    ? ['batting_value',  'players_value_batting']
    : ['pitching_value', 'players_value_pitching'];

  // 候補テーブルを「優先ID → その他 → 除外ID」の順に並べる
  const sortedTables = [
    ...allTables.filter(t =>  preferredIds.includes(t.id)),
    ...allTables.filter(t => !preferredIds.includes(t.id) && !excludedIds.includes(t.id)),
    ...allTables.filter(t =>  excludedIds.includes(t.id)),
  ];

  outer: for (const tbl of sortedTables) {
    for (const statName of warStatNames) {
      if (tbl.querySelector(`td[data-stat="${statName}"]`)) {
        warStatUsed = statName;
        console.log(`[BRef貼り付け] WARテーブル発見: id="${tbl.id}" stat="${statName}"`);
        parseTable(tbl, (year, get, isTot) => {
          const war = get(statName);
          if (war && war !== '') {
            if (!_brefCache[brefId][year]) _brefCache[brefId][year] = {};
            if (isTot || !_brefCache[brefId][year].war) {
              _brefCache[brefId][year].war = war;
              warCount++;
              console.log(`[BRef貼り付け] ${year}: WAR=${war}`);
            }
          }
        });
        break outer;
      }
    }
  }

  if (warCount === 0) {
    // デバッグ: 全テーブルの data-stat 一覧を出力
    const allStats = new Set();
    doc.querySelectorAll('td[data-stat]').forEach(td => allStats.add(td.getAttribute('data-stat')));
    console.warn('[BRef貼り付け] WARデータ未検出。検出されたdata-stat一覧:', [...allStats].sort().join(', '));
  }

  // FIP テーブルを探す（投手のみ）
  let fipCount = 0;
  if (isPitcher) {
    for (const tbl of Array.from(doc.querySelectorAll('table'))) {
      if (!tbl.querySelector('td[data-stat="fip"]')) continue;
      parseTable(tbl, (year, get, isTot) => {
        const fip = get('fip');
        if (fip && fip !== '') {
          if (!_brefCache[brefId][year]) _brefCache[brefId][year] = {};
          if (isTot || !_brefCache[brefId][year].fip) {
            _brefCache[brefId][year].fip = fip;
            fipCount++;
          }
        }
      });
      break;
    }
  }

  const years = Object.keys(_brefCache[brefId]).filter(k => /^\d{4}$/.test(k)).sort();
  console.log('[BRef貼り付け] 取得完了:', brefId, years);
  return { warCount, fipCount, years };
}

/**
 * BRefページのタブ区切りテキスト（レンダリングページのCtrl+A+C）から
 * WAR・FIPデータを抽出してキャッシュに格納する。
 *
 * BRefのピッチャーページには複数のテーブルがあり、
 *   pitching_standard : FIP列あり、WAR列なし
 *   pitching_value    : WAR列あり、FIP列なし
 * のように異なるテーブルに分散している。
 * 各テーブルのヘッダー行を個別に検出し、データを年ごとにマージする。
 */
function _parseBRefPlainText(text, brefId) {
  if (!text || !brefId) return { warCount: 0, fipCount: 0 };
  if (!_brefCache[brefId]) _brefCache[brefId] = {};

  const lines = text.split(/\r?\n/);

  // 現在アクティブなテーブルの列マッピング
  // Season/Year列が見つかるたびにリセット（テーブル切り替え検出）
  let activeMap = null; // { seasonCol, teamCol, warCol, fipCol, isPitchingTable }

  // yearData[year] = {
  //   tot:      { warStr, fipStr },   // TOT/合算行（最優先）
  //   first:    { warStr, fipStr },   // 先頭個別チーム行（FIPフォールバック用）
  //   teamWars: Map<teamNorm, warStr> // チームごとのWAR（重複排除・合算用）
  // }
  const yearData = {};

  for (const line of lines) {
    const cells = line.split('\t');
    if (cells.length < 3) continue;

    // ── ヘッダー行の検出 ──
    // "Season" または "Year" 列があればテーブルの新規ヘッダーとみなす
    const sIdx = cells.findIndex(c => c.trim() === 'Season' || c.trim() === 'Year');
    if (sIdx >= 0) {
      const wIdx = cells.findIndex(c => c.trim() === 'WAR');
      const fIdx = cells.findIndex(c => c.trim() === 'FIP');
      const tIdx = cells.findIndex(c => c.trim() === 'Team' || c.trim() === 'Tm');
      // ERA列があれば投球テーブル、なければ打撃テーブル等と判定
      const hasEra  = cells.some(c => c.trim() === 'ERA');
      const hasIp   = cells.some(c => c.trim() === 'IP');
      const hasObp  = cells.some(c => c.trim() === 'OBP');
      // ERA or IP があれば投球テーブル、OBP があれば打撃テーブル
      const isPitchingTable = (hasEra || hasIp) && !hasObp;
      // WAR または FIP のいずれかがあるテーブルのみアクティブにする
      if (wIdx >= 0 || fIdx >= 0) {
        activeMap = {
          seasonCol:       sIdx,
          teamCol:         tIdx >= 0 ? tIdx : 2,
          warCol:          wIdx,   // -1 = このテーブルにはWAR列なし
          fipCol:          fIdx,   // -1 = このテーブルにはFIP列なし
          isPitchingTable,         // 投球テーブルかどうか
        };
        console.log(`[BRef text] テーブルヘッダー検出: Season=${sIdx}, WAR=${wIdx}, FIP=${fIdx}, 投球=${isPitchingTable}`);
      } else {
        // WAR/FIPどちらもないテーブル（試合日程等）はスキップ
        activeMap = null;
      }
      continue;
    }

    if (!activeMap) continue;

    // ── データ行の解析 ──
    const year = cells[activeMap.seasonCol]?.trim().replace(/\D/g, '');
    if (!year || year.length !== 4) continue;

    // TOT/合算行の判定（"TOT" / "2TM" / "3TM" / "2 Teams" 等）
    const teamCellNorm = (cells[activeMap.teamCol] || '').trim().toUpperCase().replace(/\s+/g, '');
    const isTot = teamCellNorm === 'TOT' || /^\d+(TM|TMS|TEAMS?)$/i.test(teamCellNorm);

    const warRaw = activeMap.warCol >= 0 ? cells[activeMap.warCol]?.trim() : null;
    const fipRaw = activeMap.fipCol >= 0 ? cells[activeMap.fipCol]?.trim() : null;

    const warStr = (warRaw && !isNaN(parseFloat(warRaw))) ? warRaw : null;
    const fipStr = (fipRaw && !isNaN(parseFloat(fipRaw))) ? fipRaw : null;

    // どちらも取得できなければスキップ
    if (warStr === null && fipStr === null) continue;

    if (!yearData[year]) yearData[year] = {
      tot:      { warStr: null, fipStr: null },
      first:    { warStr: null, fipStr: null },
      teamWars: new Map(),
    };

    if (isTot) {
      // TOT行：投球テーブルの値のみ採用（打撃テーブルの合算WARは無視）
      if (warStr !== null && activeMap.isPitchingTable) yearData[year].tot.warStr = warStr;
      if (fipStr !== null) yearData[year].tot.fipStr = fipStr;
    } else {
      // 個別チーム行
      // first: FIPフォールバック用に先頭行を記録（投球テーブルのみWARを採用）
      if (warStr !== null && activeMap.isPitchingTable && yearData[year].first.warStr === null) yearData[year].first.warStr = warStr;
      if (fipStr !== null && yearData[year].first.fipStr === null) yearData[year].first.fipStr = fipStr;
      // teamWars: 投球テーブルのWARのみ記録（打撃WARが混入しないよう isPitchingTable でガード）
      if (warStr !== null && activeMap.isPitchingTable && !yearData[year].teamWars.has(teamCellNorm)) {
        yearData[year].teamWars.set(teamCellNorm, warStr);
      }
    }
  }

  // ── パス2: TOT行優先でキャッシュへ書き込み ──
  let warCount = 0, fipCount = 0;
  for (const [year, data] of Object.entries(yearData)) {
    if (!_brefCache[brefId][year]) _brefCache[brefId][year] = {};

    // デバッグ: yearData の内容を出力
    console.log(`[BRef text] ${year}: tot.warStr=${data.tot.warStr}, first.warStr=${data.first.warStr}, teamWars=[${[...data.teamWars.entries()].map(([t,w])=>`${t}:${w}`).join(', ')}]`);

    // WAR の決定（優先順・信頼度付き）：
    //   ① TOT行の値（最優先・BRef公式合算値） → 信頼度：高
    //   ② 2チーム以上が teamWars に記録されている → WARは加算統計なので合計 → 信頼度：高
    //      （同一チームが複数テーブルに登場しても teamWars で重複排除済み）
    //   ③ それ以外 → first.warStr（単一チーム年の通常パス） → 信頼度：低
    //      ※ 打撃成績テーブルなど別テーブルの値が混入する可能性があるため、
    //         HTMLで既にキャッシュ済みの場合は上書きしない
    let warStr = data.tot.warStr;
    let warReliable = (warStr !== null); // TOT行は信頼度高
    if (!warStr) {
      const teamWarNums = [...data.teamWars.values()]
        .map(w => parseFloat(w))
        .filter(n => !isNaN(n));
      if (teamWarNums.length >= 2) {
        // 複数チーム年：チームごとのWARを合算（WAR is additive）
        warStr = teamWarNums.reduce((a, b) => a + b, 0).toFixed(1);
        warReliable = true; // 複数チーム合算も信頼度高
        console.log(`[BRef text] ${year}: WAR合算 [${[...data.teamWars.entries()].map(([t,w])=>`${t}:${w}`).join(', ')}] = ${warStr}`);
      } else {
        // 単一チーム年 or teamWars が空（first.warStr をそのまま使用）
        warStr = data.first.warStr;
        warReliable = false; // フォールバック値は信頼度低
      }
    }
    if (warStr) {
      const existingWar = _brefCache[brefId][year].war;
      // 信頼度が高い場合は常に上書き。
      // 信頼度が低い場合（first.warStr フォールバック）は、
      // HTMLパーサーが既にキャッシュしている値を守る（打撃WARなど誤値の混入を防ぐ）
      if (warReliable || !existingWar) {
        _brefCache[brefId][year].war = warStr;
        warCount++;
        console.log(`[BRef text] ${year}: WAR=${warStr}${data.tot.warStr ? ' (TOT行)' : ''}${!warReliable ? ' (フォールバック)' : ''}`);
      } else {
        console.log(`[BRef text] ${year}: WAR=${warStr} はフォールバック値のためHTML取得値(${existingWar})を保持`);
        warCount++; // 年数カウントは加算（既存の良い値が使われる）
      }
    }

    // FIP の決定（優先順）：
    //   ① TOT行の値（FIPは率統計なので合算できない）
    //   ② 個別チーム行の先頭（単一チーム年のフォールバック）
    const fipStr = data.tot.fipStr ?? data.first.fipStr ?? null;
    if (fipStr) {
      _brefCache[brefId][year].fip = fipStr;
      fipCount++;
      console.log(`[BRef text] ${year}: FIP=${fipStr}${data.tot.fipStr ? ' (TOT行)' : ' (チーム行FB)'}`);
    }
  }

  return { warCount, fipCount };
}

// 書式: "2005:3.2, 2006:2.1, 2007:1.8"
function onWarManualInput(val) {
  // 入力中のプレビュー（何もしない、applyWarManualで適用）
}
function applyWarManual() {
  const val = document.getElementById('war-manual-input').value.trim();
  const statusEl = document.getElementById('war-manual-status');
  if (!val) { statusEl.textContent = '入力がありません'; return; }
  if (!g_brefId) { statusEl.textContent = 'BRef IDを先に設定してください'; return; }

  // パース: "2005:3.2, 2006:2.1" 形式
  const entries = val.split(/[,\n]+/);
  let count = 0;
  if (!_brefCache[g_brefId]) _brefCache[g_brefId] = {};
  for (const entry of entries) {
    const m = entry.trim().match(/^(\d{4})\s*[:：]\s*([\-\d.]+)/);
    if (!m) continue;
    const [, year, warVal] = m;
    if (!_brefCache[g_brefId][year]) _brefCache[g_brefId][year] = {};
    _brefCache[g_brefId][year].war = warVal;
    count++;
    console.log(`[WAR手動入力] ${year}: ${warVal}`);
  }
  if (count > 0) {
    statusEl.textContent = `✓ ${count}年分のWARを設定しました`;
    statusEl.style.color = '#77cc88';
    refreshPeakYear();
  } else {
    statusEl.textContent = '⚠️ 有効な入力がありません（例: 2005:3.2）';
    statusEl.style.color = '#ff8888';
  }
}

  let info = '';

// ── ピーク年再計算：総合力（WAR込み）が最高の単年を g_peakYear にセット ──
// BRef WARが取得済みであれば自動的に反映される
function recalcPeakYear() {
  if (!g_dataRows || !g_dataRows.length) return;
  // 単年行のみ対象（「通算」など年度が4桁でない行は除外）
  const yearRows = g_dataRows.filter(r => /^\d{4}$/.test(String(r[1] ?? '').trim()));
  if (!yearRows.length) return;

  let bestRow = yearRows[0];
  let bestScore = -Infinity;

  for (const r of yearRows) {
    const yr = String(r[1] ?? '');
    // BRef キャッシュから WAR を取得（未取得時は null → WAR なしで計算）
    let warVal = null;
    if (g_brefId && _brefCache[g_brefId]) {
      const warRaw = _brefCache[g_brefId][yr]?.war;
      if (warRaw != null) {
        const w = parseFloat(String(warRaw).replace('~', ''));
        if (!isNaN(w)) warVal = w;
      }
    }
    // 総合力スコアを計算（WAR利用可能ならブレンド済みスコアになる）
    const score = g_isPitcher
      ? calcPitcherOverall(r, null, warVal)
      : calcHitterOverall(r, g_isCatcher, warVal);

    if (score > bestScore) {
      bestScore = score;
      bestRow   = r;
    }
  }
  g_peakYear = bestRow ? bestRow[1] : null;
  console.log('[Peak] ピーク年再計算:', g_peakYear, '(スコア:', bestScore, ')');
}

// ── ピーク年再計算 → ドロップダウン＆year-info を更新 ──
function refreshPeakYear() {
  recalcPeakYear();
  const sel = document.getElementById('year-select');
  if (sel) {
    Array.from(sel.options).forEach(opt => {
      const isPk = String(opt.value) === String(g_peakYear);
      opt.textContent = opt.value + '年' + (isPk ? ' ★ピーク' : '');
      opt.style.color = isPk ? '#ffcc44' : '';
    });
  }
  updateYearInfo(sel ? sel.value : g_peakYear);
}

// ── MLB Stats API からシーズン成績・受賞歴を取得 ────────────────
async function fetchMlbSeasonData(mlbId, year, isPitcher) {
  if (!mlbId) return { stats: {}, awards: [] };
  try {
    const group = isPitcher ? 'pitching' : 'hitting';
    const [statsRes, awardsRes] = await Promise.all([
      fetch(`https://statsapi.mlb.com/api/v1/people/${mlbId}/stats?stats=season&season=${year}&group=${group}&sportId=1`),
      fetch(`https://statsapi.mlb.com/api/v1/people/${mlbId}/awards`)
    ]);
    const statsData  = statsRes.ok  ? await statsRes.json()  : {};
    const awardsData = awardsRes.ok ? await awardsRes.json() : {};

    const seasonStats = statsData?.stats?.[0]?.splits?.[0]?.stat || {};

    // 受賞歴をシーズンでフィルタ（nameとidの両方を保持）
    const allAwards = awardsData?.awards || [];
    const yearAwards = allAwards
      .filter(a => {
        const s = a.season || (a.date ? String(a.date).substring(0,4) : '');
        return s === String(year);
      })
      .map(a => ({ name: a.name || '', id: a.id || '' }))
      .filter(a => a.name || a.id);

    return { stats: seasonStats, awards: yearAwards };
  } catch (e) {
    console.warn('MLB Stats API 取得エラー:', e.message);
    return { stats: {}, awards: [] };
  }
}

/**
 * キャリア全受賞歴を一括取得して _awardsJaByYear に年度別に格納する。
 * 通算カード表示時に呼ぶことで、個別年度を見ていなくても表示できるようにする。
 */
async function _fetchAndCacheAllAwards(mlbId) {
  if (!mlbId) return;
  try {
    const res = await fetch(`https://statsapi.mlb.com/api/v1/people/${mlbId}/awards`);
    if (!res.ok) return;
    const data = await res.json();
    const allAwards = data?.awards || [];
    allAwards.forEach(a => {
      const year = String(a.season || (a.date ? String(a.date).substring(0,4) : ''));
      if (!/^\d{4}$/.test(year)) return;
      const award = { name: a.name || '', id: a.id || '' };
      const ja = awardToJa(award);
      if (!ja) return;
      if (!_awardsJaByYear[year]) _awardsJaByYear[year] = [];
      if (!_awardsJaByYear[year].includes(ja)) _awardsJaByYear[year].push(ja);
    });
    console.log('[CareerAwards] 全受賞歴キャッシュ完了:', Object.keys(_awardsJaByYear));
  } catch(e) {
    console.warn('[CareerAwards] 取得エラー:', e.message);
  }
}

// 「受賞」ではなく「選出」と表現すべき栄誉（チーム選抜系）
// buildBatterRetsuden・buildPitcherRetsuden でテンプレート分岐に使用
const _SELECTION_AWARDS = new Set([
  'ALL-MLBファーストチーム',
  'ALL-MLBセカンドチーム',
  'ALL-MLBチーム',
]);

function awardToJa(award) {
  const n = (award.name || award.id || '').toLowerCase();

  // ① 月間・週間・オールスター等のシーズン外小賞は即スキップ（nullを返す）
  // "monthly" "of the month" "of the week" を含む賞は月間/週間賞として除外
  if (n.includes('monthly') || n.includes('of the month') || n.includes('of the week')) return null;
  if (n.includes('pitcher of the month') || n.includes('hitter of the month') ||
      n.includes('player of the week'))                                       return null;
  if (n.includes('all-star game mvp') || n.includes('allstar game mvp'))      return null;
  if (n.includes('minor league') || n.includes('milb') ||
      n.includes('triple-a')    || n.includes('double-a'))                    return null;

  // ② リーグ識別
  const isAL = n.includes('american league') || n.includes(' al ') || n.startsWith('al ');
  const isNL = n.includes('national league')  || n.includes(' nl ') || n.startsWith('nl ');
  const lg   = isAL ? 'AL' : isNL ? 'NL' : '';

  // ② チーム名識別（チーム固有賞のプレフィクスに使用）
  // リーグ略称や人名由来賞との混同を避けるため、チーム名が含まれるか専用マップで判定
  const awardTeamJa = _teamEngToJa(n);
  // チーム名が検出されてもリーグMVP・サイ・ヤング等の全球団共通賞には使わない
  // （pitcherOfYear等のチーム内賞にのみ適用）

  // ③ 具体的なMVP種別を「リーグMVP」より先にチェック（順序が重要！）
  if (n.includes('world series') && n.includes('mvp'))  return 'ワールドシリーズMVP';
  if (n.includes('championship series'))                return 'リーグ優勝シリーズMVP';
  // ワールドシリーズ制覇（優勝リング）- MVPと区別して「優勝」として返す
  if (n.includes('world series') &&
      (n.includes('championship') || n.includes('champion') ||
       n.includes('ring') || n.includes('winner') || n.includes('title'))) {
    return 'ワールドシリーズ優勝';
  }
  if (n.includes('all-star') || n.includes('allstar'))  return null; // オールスター選出は表示しない

  // ④ リーグMVP（シーズンMVPのみ）
  // AL/NLまたはBBWAAの明記がないMVPはチーム賞・球団賞として除外する
  if (n.includes('most valuable player') || n.includes('mvp')) {
    if (!isAL && !isNL && !n.includes('bbwaa')) return null;
    return lg ? `${lg} MVP` : 'MVP';
  }

  // ⑤ MLBPAA ハート・アンド・ハッスル賞（チーム別）
  // MLBPAA = Major League Baseball Players Alumni Association（MLB選手会OB）
  if (n.includes('heart and hustle')) {
    const teamJa = _teamEngToJa(n);
    return teamJa ? `MLB選手会OB ${teamJa} ハート・アンド・ハッスル賞` : 'MLB選手会OB ハート・アンド・ハッスル賞';
  }

  // ⑥ その他タイトル・表彰
  if (n.includes('cy young'))
    return lg ? `${lg}サイ・ヤング賞` : 'サイ・ヤング賞';
  // 「新人王(Rookie of the Year)」は厳密に "rookie of the year" を含む賞のみを対象とする
  // ※「Topps All-Star Rookie」「All-Rookie Team」「Topps Rookie of the Month」等の
  //   月間新人賞・新人選抜チーム表彰を誤って年間新人王扱いしないよう、ROY以外は別ルートへ
  // ① 新人選抜チーム系（タイトルではなく選出表彰）→ 列伝・肩書に出さない
  if (n.includes('all-rookie') || n.includes('all rookie') ||
      n.includes('rookie all-star') || n.includes('all-star rookie') ||
      n.includes('rookie team')) {
    return null;
  }
  // ② 年間新人王（BBWAA等のRookie of the Year）のみを「新人王」として扱う
  if (n.includes('rookie of the year')) {
    if (awardTeamJa && !isAL && !isNL) return `${awardTeamJa}新人賞`; // チーム独自新人賞
    return lg ? `${lg}新人王` : '新人王';
  }
  if (n.includes('gold glove'))           return 'ゴールドグラブ賞';
  if (n.includes('silver slugger'))       return 'シルバースラッガー賞';
  if (n.includes('platinum glove'))       return 'プラチナグラブ賞';
  if (n.includes('fielding bible'))       return 'フィールディング・バイブル賞';
  if (n.includes('wilson defensive'))     return 'ウィルソン守備賞';
  if (n.includes('hank aaron'))           return 'ハンク・アーロン賞';
  if (n.includes('roberto clemente'))     return 'ロベルト・クレメンテ賞';
  if (n.includes('lou gehrig'))           return 'ルー・ゲーリッグ記念賞';
  if (n.includes('tony conigliaro'))      return 'トニー・コニリアロ賞';
  if (n.includes('branch rickey'))        return 'ブランチ・リッキー賞';
  if (n.includes('marvin miller'))        return 'マービン・ミラー賞';
  if (n.includes('edgar martinez'))       return 'エドガー・マルティネス賞';
  if (n.includes('jackie robinson'))      return 'ジャッキー・ロビンソン賞';
  if (n.includes('willie mays'))          return 'ウィリー・メイズ賞';
  if (n.includes('joe torre'))            return 'ジョー・トーレ賞';
  if (n.includes('commissioner') && n.includes('historic')) return 'コミッショナー歴史的功績賞';
  if (n.includes('comeback player'))      return 'カムバック賞';
  if (n.includes('reliever')) {
    if (awardTeamJa) return `${awardTeamJa}最優秀救援投手賞`; // チーム固有救援賞
    return lg ? `${lg}リリーバー賞` : 'リリーバー賞';
  }
  if (n.includes('manager of the year'))
    return lg ? `${lg}最優秀監督賞` : '最優秀監督賞';
  if (n.includes('batting title'))        return '首位打者';
  if (n.includes('home run') && n.includes('leader')) return '本塁打王';

  // ⑧ Players Choice Awards（MLBPA 選手投票による賞）
  // "ML Players Choice AL Outstanding Pitcher" 等の形式に対応
  const isPC = n.includes('players choice') || n.includes('players association') || n.includes('mlbpa');
  if (isPC || n.includes('outstanding pitcher') || n.includes('outstanding player') ||
      n.includes('outstanding rookie') || n.includes('outstanding reliever') ||
      n.includes('outstanding dh')) {
    if (n.includes('outstanding pitcher'))
      return lg ? `${lg}最優秀投手賞` : '最優秀投手賞';
    if (n.includes('outstanding player'))
      return lg ? `${lg}最優秀選手賞` : '最優秀選手賞';
    if (n.includes('outstanding rookie'))
      return lg ? `${lg}最優秀新人賞` : '最優秀新人賞';
    if (n.includes('outstanding reliever'))
      return lg ? `${lg}最優秀救援投手賞` : '最優秀救援投手賞';
    if (n.includes('outstanding dh') || (isPC && n.includes('designated')))
      return lg ? `${lg}最優秀指名打者賞` : '最優秀指名打者賞';
    if (n.includes('man in baseball'))
      return '野球界最優秀貢献者賞';
    if (isPC) return lg ? `${lg}選手会最優秀賞` : '選手会最優秀賞';
  }

  // ⑨ 人名を冠した各種表彰
  if (n.includes('warren spahn'))      return 'ウォーレン・スパーン賞';
  if (n.includes('bob gibson'))        return 'ボブ・ギブソン賞';
  if (n.includes('roger clemens'))     return 'ロジャー・クレメンス賞';
  if (n.includes('nolan ryan'))        return 'ノーラン・ライアン賞';
  if (n.includes('bob feller'))        return 'ボブ・フェラー賞';
  if (n.includes('sandy koufax'))      return 'サンディ・コーファックス賞';
  if (n.includes('whitey ford'))       return 'ホワイティ・フォード賞';
  if (n.includes('tony gwynn'))        return 'トニー・グウィン賞';
  if (n.includes('mickey mantle'))     return 'ミッキー・マントル賞';
  if (n.includes('ted williams'))      return 'テッド・ウィリアムズ賞';
  if (n.includes('dick howser'))       return 'ディック・ハウザー賞';
  if (n.includes('hutch'))             return 'ハッチ賞';
  if (n.includes('babe ruth'))         return 'ベーブ・ルース賞';
  if (n.includes('buck o'))            return 'バック・オニール功労賞';
  if (n.includes('ford c. frick') || n.includes('ford frick')) return null; // アナウンサー賞は非表示
  if (n.includes('j.g. taylor spink') || n.includes('spink award')) return null; // 記者賞は非表示

  // ⑩ その他統計・特別表彰
  if (n.includes('triple crown'))      return '三冠王';
  if (n.includes('rolaids'))           return 'ロレイズ最優秀救援賞';
  if (n.includes('trevor hoffman'))    return 'トレバー・ホフマン賞';
  if (n.includes('mariano rivera') && !n.includes('award')) return null; // オールスター投票等は除外
  if (n.includes('tony la russa'))     return 'トニー・ラルーサ賞';
  if (n.includes('joe cronin'))        return 'ジョー・クローニン賞';
  if (n.includes('roberto') && n.includes('perez')) return null;
  if (n.includes('sporting news') && n.includes('player'))
    return lg ? `${lg}スポーティングニュース最優秀選手` : 'スポーティングニュース最優秀選手';
  if (n.includes('sporting news') && n.includes('pitcher'))
    return lg ? `${lg}スポーティングニュース最優秀投手` : 'スポーティングニュース最優秀投手';
  if (n.includes('baseball america') && n.includes('player'))
    return 'ベースボール・アメリカ最優秀選手';
  if (n.includes('baseball america') && n.includes('pitcher'))
    return 'ベースボール・アメリカ最優秀投手';

  // ⑩-c MLB.com Awards（GIBBY / Esurance Awards）ファン投票による年間表彰
  // 例: "Performance of the Year - MLB.com Awards" → 年間ベスト・パフォーマンス賞(MLB.com)
  // ※ MLB.com固有の賞名パターン、または isMlbCom フラグが真の場合に適用
  {
    const isMlbCom = n.includes('mlb.com') || n.includes('esurance') || n.includes('gibby');
    if (isMlbCom || n.includes('performance of the year') ||
        n.includes('web gem') || n.includes('everyday hero') ||
        n.includes('defensive play of the year')) {
      if (n.includes('performance of the year'))
        return '年間ベスト・パフォーマンス賞(MLB.com)';
      if (n.includes('defensive play of the year'))
        return '年間ベスト守備プレー賞(MLB.com)';
      if (n.includes('play of the year'))
        return '年間ベスト・プレー賞(MLB.com)';
      if (n.includes('moment of the year') || n.includes('best moment'))
        return '年間ベスト・モーメント賞(MLB.com)';
      if (n.includes('social media') || n.includes('milestone'))
        return 'SNSマイルストーン賞(MLB.com)';
      if (n.includes('web gem'))
        return 'ウェブジェム賞(MLB.com)';
      if (n.includes('breakout'))
        return 'ブレイクアウト選手賞(MLB.com)';
      if (n.includes('wild card'))
        return 'ワイルドカード賞(MLB.com)';
      if (n.includes('fan favorite'))
        return 'ファン投票最優秀賞(MLB.com)';
      if (n.includes('everyday hero') || n.includes('every day hero'))
        return 'エブリデー・ヒーロー賞(MLB.com)';
      if (n.includes('pitcher of the year') || n.includes('outstanding pitcher'))
        return lg ? `${lg}最優秀投手賞(MLB.com)` : '最優秀投手賞(MLB.com)';
      if (n.includes('offensive player') || (n.includes('offensive') && n.includes('year')))
        return '年間最優秀攻撃選手賞(MLB.com)';
      if (n.includes('player of the year') || n.includes('outstanding player'))
        return lg ? `${lg}最優秀選手賞(MLB.com)` : '最優秀選手賞(MLB.com)';
      // MLB.comの新人賞も「rookie of the year」のみを年間新人賞として扱う
      if (n.includes('rookie of the year')) return '最優秀新人賞(MLB.com)';
      if (n.includes('comeback'))     return 'カムバック賞(MLB.com)';
      if (isMlbCom)                   return 'MLB.com年間特別賞'; // 上記以外の未分類MLB.com賞
    }
  }

  // ⑩-b チーム固有の年間賞（チーム名付き）
  // 例: "Brewers Pitcher of the Year" → "ブルワーズ年間最優秀投手賞"
  //     "Yankees Player of the Year"  → "ヤンキース年間最優秀選手賞"
  if (n.includes('pitcher of the year')) {
    const pfx = awardTeamJa || (lg || '');
    return `${pfx}年間最優秀投手賞`;
  }
  if (n.includes('player of the year') || n.includes('hitter of the year')) {
    const pfx = awardTeamJa || (lg || '');
    return `${pfx}年間最優秀選手賞`;
  }
  if (n.includes('reliever of the year') || n.includes('relief man')) {
    const pfx = awardTeamJa || (lg || '');
    return `${pfx}最優秀救援投手賞`;
  }
  if (n.includes('rookie of the year') && awardTeamJa) {
    // チーム独自の新人賞（リーグ新人王と区別）
    return `${awardTeamJa}新人賞`;
  }
  // チーム内コミュニティ・地域貢献賞
  if (awardTeamJa && (n.includes('community') || n.includes('good guy') ||
      n.includes('humanitarian') || n.includes('civic'))) {
    return `${awardTeamJa}地域貢献賞`;
  }
  // チーム内その他の年間賞（"Award" "Trophy" が含まれるもの）
  if (awardTeamJa && (n.includes(' award') || n.includes(' trophy')) &&
      !n.includes('cy young') && !n.includes('gold glove') &&
      !n.includes('silver slugger') && !n.includes('mvp') && !n.includes('heart')) {
    // 人名由来賞（例: "Bob Robertson Award"）はそのまま人名を使う
    const personM = (award.name || '').match(/^(?:[A-Z][a-z]+ )+[A-Z][a-z]+\s+(Award|Trophy)/);
    if (personM) {
      // チーム名の英語表記が award.name 先頭に含まれている場合は重複を除去
      // 例: awardTeamJa="パドレス", award.name="Padres Darrel Akerfelds Bullpen Award"
      //   そのまま結合 → "パドレス Padres Darrel Akerfelds Bullpen Award"（パドレス重複）
      //   先頭の "Padres " を除去 → "パドレス Darrel Akerfelds Bullpen Award"
      let cleanName = award.name;
      for (const enTeam of Object.keys(_TEAM_JA_MAP)) {
        const re = new RegExp(`^${enTeam}\\s+`, 'i');
        if (re.test(cleanName)) { cleanName = cleanName.replace(re, ''); break; }
      }
      // 末尾 "Award" → "賞" / "Trophy" → "トロフィー" に簡易訳して読みやすく
      cleanName = cleanName.replace(/\s+Award$/i, '賞').replace(/\s+Trophy$/i, 'トロフィー');
      return `${awardTeamJa} ${cleanName}`;
    }
    return `${awardTeamJa}球団賞`;
  }
  if (n.includes('strikeout') && n.includes('leader')) return '奪三振王';
  if (n.includes('era') && n.includes('leader'))       return '最優秀防御率';
  if (n.includes('wins') && n.includes('leader'))      return '最多勝';
  if (n.includes('saves') && n.includes('leader'))     return '最多セーブ';
  if (n.includes('rbi') && n.includes('leader'))       return '打点王';

  // ⑪ All-MLB チーム選出（ファン50%＋専門家50%の投票による両リーグ選抜）
  // "受賞"ではなく"選出"なので、後段テンプレートで分離処理できるよう専用ラベルを返す
  if (n.includes('all-mlb') || (n.includes('all mlb'))) {
    if (n.includes('first') || n.includes('1st')) return 'ALL-MLBファーストチーム';
    if (n.includes('second') || n.includes('2nd')) return 'ALL-MLBセカンドチーム';
    return 'ALL-MLBチーム';
  }

  // ⑫ 未変換・不明な賞は非表示（英語のまま表示しない）
  // → 日本語訳が用意されていない賞を英語でカードに出さないためにnullを返す
  return null;
}

// ── 通算カード専用の称号ロジック ──────────────────────────────
// 通算統計は単年統計と閾値が全く異なるため、賞歴の「回数」を優先して称号を決める
function _buildCareerCardType(row, awardsJa) {
  const hr    = parseInt(row[9])  || 0;
  const posJa = _getPrimaryPosJa(row); // DRS優先・g_mlbPosフォールバック
  const hand  = (g_pitchHand === 'L') ? '左腕' : '右腕';
  const avg   = parseFloat(String(fmtRate(row[15])).replace(/^\./,'0.')) || 0;
  const sb    = getSB(row);
  const rbi   = parseInt(row[10]) || 0;

  // 賞歴の回数カウント（awardsJaは全キャリアの受賞一覧）
  const cnt = (keyword) => awardsJa.filter(a => a.includes(keyword)).length;
  const has = (keyword) => awardsJa.some(a => a.includes(keyword));

  // mvpCount はリーグMVP（AL MVP / NL MVP / MVP）のみをカウント
  // ワールドシリーズMVP・リーグ優勝シリーズMVP・その他MVP賞を除外するため完全一致で判定
  const mvpCount  = awardsJa.filter(a => a === 'AL MVP' || a === 'NL MVP' || a === 'MVP').length;
  const wsCount   = cnt('ワールドシリーズMVP');
  const cyCount   = cnt('サイ・ヤング');
  const avgCount  = cnt('首位打者');
  const hrTCount  = cnt('本塁打王');
  const rbiTCount = cnt('打点王');
  const ssCount   = cnt('シルバースラッガー');
  const ggCount   = cnt('ゴールドグラブ');
  const asCount   = cnt('オールスター');

  // ─ 投手 ──────────────────────────────────────────
  if (g_isPitcher) {
    if (cyCount >= 4) return `${cyCount}回サイ・ヤング賞`;
    if (cyCount >= 2) return `${cyCount}回サイ・ヤング賞${hand}`;
    if (cyCount >= 1) {
      if (mvpCount >= 1) return `MVP・サイ・ヤング賞`;
      return `サイ・ヤング賞${hand}`;
    }
    if (mvpCount >= 1) return `MVP${hand}`;
    if (has('奪三振王') && has('最優秀防御率')) return `二冠${hand}`;
    if (has('最多勝') && has('最優秀防御率')) return `最多勝・最優秀防御率${hand}`;
    if (ggCount >= 3) return `ゴールドグラブ${hand}`;
    return `${hand}投手`;
  }

  // ─ 野手 ──────────────────────────────────────────
  // ① キャリア通算HR大台（500・600・700本は歴史的偉業）
  if (hr >= 700) return `${hr}本塁打の大打者`;
  if (hr >= 600) return `${hr}本塁打の大打者`;
  if (hr >= 500) return `500本塁打達成`;

  // ② ワールドシリーズMVP × MVP 複合
  if (wsCount >= 1 && mvpCount >= 1) return `MVP・WS MVP`;
  if (wsCount >= 1) return 'ワールドシリーズMVP';

  // ③ 複数回MVP
  if (mvpCount >= 3) return `${mvpCount}回MVP`;
  if (mvpCount >= 2) {
    if (avgCount >= 2) return `${mvpCount}回MVP・${avgCount}回首位打者`;
    return `${mvpCount}回MVP${posJa ? '・' + posJa : ''}`;
  }

  // ④ MVP 1回 + タイトル組み合わせ
  if (mvpCount >= 1) {
    if (avgCount >= 3) return `MVP・${avgCount}回首位打者${posJa ? '・' + posJa : ''}`;
    if (avgCount >= 2) return `MVP・${avgCount}回首位打者`;
    if (avgCount >= 1) return `MVP・首位打者${posJa ? '・' + posJa : ''}`;
    if (hrTCount >= 1 && rbiTCount >= 1) return `MVP二冠${posJa ? '・' + posJa : ''}`;
    if (hrTCount >= 1) return `MVP本塁打王${posJa ? '・' + posJa : ''}`;
    return `MVP${posJa ? '・' + posJa : ''}`;
  }

  // ⑤ 複数回首位打者（MVPなし）
  if (avgCount >= 3) return `${avgCount}回首位打者${posJa ? '・' + posJa : ''}`;
  if (avgCount >= 2) return `${avgCount}回首位打者${posJa ? '・' + posJa : ''}`;

  // ⑥ 複数タイトル（首位打者・本塁打王・打点王の組み合わせ）
  const titleCount = [avgCount >= 1, hrTCount >= 1, rbiTCount >= 1].filter(Boolean).length;
  if (titleCount >= 2) return `二冠達成${posJa ? '・' + posJa : ''}`;

  // ⑦ 1タイトル
  if (avgCount >= 1) return `首位打者${posJa ? '・' + posJa : ''}`;
  if (hrTCount >= 2) return `${hrTCount}回本塁打王`;
  if (hrTCount >= 1) return `本塁打王${posJa ? '・' + posJa : ''}`;
  if (rbiTCount >= 2) return `${rbiTCount}回打点王`;
  if (rbiTCount >= 1) return `打点王${posJa ? '・' + posJa : ''}`;

  // ⑧ 表彰（シルバースラッガー・ゴールドグラブ）
  if (ssCount >= 5) return `${ssCount}回SS${posJa ? '・' + posJa : ''}`;
  if (ggCount >= 5) return `${ggCount}回GG${posJa ? '・' + posJa : ''}`;
  if (ssCount >= 3) return `シルバースラッガー常連${posJa ? '・' + posJa : ''}`;
  if (ggCount >= 3) return `ゴールドグラブ常連${posJa ? '・' + posJa : ''}`;
  if (ssCount >= 1) return `シルバースラッガー${posJa || '野手'}`;
  if (ggCount >= 1) return `ゴールドグラブ${posJa || '野手'}`;

  // ⑨ オールスター多数選出
  if (asCount >= 8) return `${asCount}回オールスター`;
  if (asCount >= 5) return `${asCount}回AS${posJa ? '・' + posJa : ''}`;

  // ⑩ 通算400本塁打
  if (hr >= 400) return `${hr}本塁打の強打者`;
  if (hr >= 300) return `通算${hr}本塁打`;

  // ⑪ 高打率・長打力
  if (avg >= 0.310) return `通算打率${fmtRate(row[15])}の巧打者`;
  if (sb >= 400) return `通算${sb}盗塁の俊足選手`;
  if (rbi >= 1500) return `通算${rbi}打点の勝負強打者`;

  // ⑫ ポジション＋通算能力値で称号
  {
    // 通算能力値はシーズン行の平均をそのまま使用（通算行は加重値なので列[45][46][48]を参照）
    const _spd = parseInt(row[46]) || 0;
    const _pow = parseInt(row[45]) || 0;
    const _eye = parseInt(row[48]) || 0;

    // ユーティリティ判定（全シーズン行のイニングを集計）
    const _posLabels8 = ['C','1B','2B','3B','SS','LF','CF','RF'];
    const _innByPos   = {};
    if (g_dataRows) {
      g_dataRows
        .filter(r => /^\d{4}$/.test(String(r[1] ?? '').trim()))
        .forEach(r => {
          for (let i = 0; i < 8; i++) {
            const inn = parseFloat(r[28 + i * 2]) || 0;
            if (inn > 0) _innByPos[_posLabels8[i]] = (_innByPos[_posLabels8[i]] || 0) + inn;
          }
        });
    }
    const _totalEntries = Object.keys(_innByPos).length;
    const _maxCareerInn = _totalEntries > 0 ? Math.max(...Object.values(_innByPos)) : 0;
    const _multiPos = _maxCareerInn > 0
      ? Object.entries(_innByPos).filter(([, v]) => v >= _maxCareerInn * 0.35)
      : [];
    const _isOF = ['左翼手','中堅手','右翼手'].includes(posJa);
    const _isIF = ['一塁手','二塁手','三塁手','遊撃手'].includes(posJa);
    const _isMultiOF = _multiPos.length >= 2 && _multiPos.every(([p]) => ['LF','CF','RF'].includes(p));
    const _isUtil    = _multiPos.length >= 3;

    if (_isUtil)            return 'ユーティリティ選手';
    if (_isMultiOF)         return 'ユーティリティ外野手';
    if (_spd >= 80 && _isOF) return '俊足外野手';
    if (_spd >= 75 && _isOF) return `俊足${posJa}`;
    if (_pow >= 90 && _isIF) return `強打${posJa}`;
    if (_pow >= 85)          return `長打力の${posJa || '野手'}`;
    if (_eye >= 85)          return `出塁型${posJa || '野手'}`;
  }
  return posJa || '野手';
}

// ── ポジション日本語名を取得（DRS優先・g_mlbPosフォールバック） ──────────
// buildHitterCard / buildCardType 共通ロジック
function _getPrimaryPosJa(row) {
  const posLabels = ['C','1B','2B','3B','SS','LF','CF','RF'];
  const posMap    = { C:'捕手','1B':'一塁手','2B':'二塁手','3B':'三塁手','SS':'遊撃手','LF':'左翼手','CF':'中堅手','RF':'右翼手' };
  const posMapFull = { P:'投手',C:'捕手','1B':'一塁手','2B':'二塁手','3B':'三塁手',
    SS:'遊撃手',LF:'左翼手',CF:'中堅手',RF:'右翼手',DH:'指名打者',OF:'外野手' };

  const _isCareer = !/^\d{4}$/.test(String(row[1] ?? '').trim());

  // ①-a 通算カード: 全シーズン行イニング合計
  if (_isCareer && g_dataRows) {
    const innByPos = {};
    g_dataRows
      .filter(r => /^\d{4}$/.test(String(r[1] ?? '').trim()))
      .forEach(r => {
        for (let i = 0; i < 8; i++) {
          const inn = parseFloat(r[28 + i * 2]) || 0;
          if (inn > 0) innByPos[posLabels[i]] = (innByPos[posLabels[i]] || 0) + inn;
        }
      });
    const top = Object.entries(innByPos).sort((a, b) => b[1] - a[1])[0];
    if (top) return posMap[top[0]] || '';
  }

  // ①-b 単年カード: その年のDRSイニング最多
  const drsData = [];
  for (let i = 0; i < 8; i++) {
    const inn = row[28 + i * 2];
    if (inn && inn !== '--' && inn !== null && inn !== '') {
      drsData.push({ pos: posLabels[i], inn: parseFloat(inn) || 0 });
    }
  }
  if (!_isCareer && drsData.length > 0) {
    const top = drsData.reduce((a, b) => a.inn >= b.inn ? a : b);
    return posMap[top.pos] || '';
  }

  // ② 通算行DRSをフォールバック（単年DRS未入力時）
  if (g_dataRows) {
    const careerRow = g_dataRows.find(r => !/^\d{4}$/.test(String(r[1] ?? '').trim()));
    if (careerRow) {
      const cDrs = [];
      for (let i = 0; i < 8; i++) {
        const inn = careerRow[28 + i * 2];
        if (inn && inn !== '--' && inn !== null && inn !== '') {
          cDrs.push({ pos: posLabels[i], inn: parseFloat(inn) || 0 });
        }
      }
      if (cDrs.length > 0) {
        const top = cDrs.reduce((a, b) => a.inn >= b.inn ? a : b);
        return posMap[top.pos] || '';
      }
    }
  }

  // ③ MLB API フォールバック
  const mp = (g_mlbPos || '').toUpperCase().replace(/\s/g, '');
  return posMapFull[mp] || '';
}

// ── 称号（cardType）を決定 ────────────────────────────────────
function buildCardType(row, awardsJa) {
  // 通算行（年度が4桁でない）は専用ロジックへ
  const isCareer = !/^\d{4}$/.test(String(row[1] ?? '').trim());
  if (isCareer) return _buildCareerCardType(row, awardsJa);

  const hr  = parseInt(row[9])  || 0;
  const k   = parseInt(row[15]) || 0;
  const era = parseFloat(row[5]) || 99;
  const wins= parseInt(row[3])  || 0;
  const gs  = parseInt(row[7])  || 0;
  const tg  = parseInt(row[6])  || 1;
  const isStarter = g_isPitcher && gs >= tg * 0.5;
  // 投球腕は g_pitchHand（'L'/'R'）を使用。row[57]は数値（対左補正値）のため誤り
  const hand = (g_pitchHand === 'L') ? '左腕' : '右腕';
  const ops   = parseFloat(fmtOPS(row[17])) || 0;
  const posJa = _getPrimaryPosJa(row); // DRS優先・g_mlbPosフォールバック

  // リーグMVP（AL MVP / NL MVP / MVP）のみを称号に使用（WS MVP・CS MVP等は別扱い）
  const mvp  = awardsJa.find(a => a === 'AL MVP' || a === 'NL MVP' || a === 'MVP');
  const cy   = awardsJa.find(a => a.includes('サイ・ヤング'));
  const ws   = awardsJa.find(a => a.includes('ワールドシリーズMVP'));
  const rook = awardsJa.find(a => a.includes('新人王'));

  // ① WS MVP
  if (ws) return 'ワールドシリーズMVP';
  // ② MVP
  if (mvp) {
    if (!g_isPitcher && hr >= 60) return '本塁打記録MVP';
    if (!g_isPitcher && hr >= 40) return `MVP${posJa || '打者'}`;
    if (!g_isPitcher)             return `${mvp}${posJa ? '・' + posJa : ''}`;
    return `MVP${hand}`;
  }
  // ③ サイ・ヤング
  if (cy) return cy.replace('賞','') + `・${hand}`;
  // ④ 新人王
  if (rook) return rook;
  // ⑤ 記録から生成
  if (!g_isPitcher) {
    const games = getHitterGames(row);
    const hasEnoughGames = games >= 80;
    const sb  = getSB(row);
    const rbi = parseInt(row[10]) || 0;
    const avg = parseFloat(String(fmtRate(row[15])).replace(/^\./,'0.')) || 0;

    // タイトル有無フラグ（awardsJa から判定）
    // ※ SB・CSR はボーナステーブルでは3だが肩書優先度では2相当に調整
    const hasAVG = awardsJa.some(a => a.includes('首位打者'));
    const hasHR  = awardsJa.some(a => a.includes('本塁打王'));
    const hasRBI = awardsJa.some(a => a.includes('打点王'));
    const hasOPS = awardsJa.some(a => a.includes('OPS首位'));
    const hasSB  = awardsJa.some(a => a.includes('盗塁王'));
    const hasGG  = awardsJa.some(a => a.includes('ゴールドグラブ'));
    const hasSS  = awardsJa.some(a => a.includes('シルバースラッガー'));
    const hasCSR = awardsJa.some(a => a.includes('盗塁阻止率'));
    const hasHAA = awardsJa.some(a => a.includes('ハンク・アーロン'));
    const hasRC  = awardsJa.some(a => a.includes('ロベルト・クレメンテ'));
    const hasCB  = awardsJa.some(a => a.includes('カムバック'));

    // ① 歴史的シーズン本塁打記録（60本超=当時の記録水準を上回る偉業。二冠王より優先）
    if (hr >= 73) return '本塁打記録男';          // ボンズの現行全体記録
    if (hr >= 62) return `${hr}本塁打・AL新記録`; // ジャッジのAL記録(2022)
    if (hr >= 60) return `${hr}HR王`;              // ルースの旧記録を超える歴史的偉業

    // ② 三冠王・二冠王（首位打者・本塁打王・打点王の組み合わせ）＋ポジション名
    const crownCount = [hasAVG, hasHR, hasRBI].filter(Boolean).length;
    const crownPos = posJa || '';
    if (crownCount === 3) return `三冠王${crownPos}`;
    if (crownCount === 2) return `二冠王${crownPos}`;

    // ③ 個別タイトルから肩書（優先度: HR=AVG=RBI=OPS=SB=GG=SS=CSR=2 > HAA=RC=CB=1）
    if (hasHR)  return hr >= 40 ? `${hr}本塁打王` : '本塁打王';
    if (hasAVG) return `打率${fmtRate(row[15])}首位打者`;
    if (hasRBI) return `${rbi}打点王`;
    if (hasOPS) return 'OPS王';
    if (hasSB)  return sb >= 50 ? `${sb}盗塁王` : '盗塁王';
    if (hasCSR && g_isCatcher) return '盗塁阻止率No.1捕手';
    if (hasGG)  return `ゴールドグラブ${posJa || '野手'}`;
    if (hasSS)  return `シルバースラッガー${posJa || '野手'}`;
    if (hasHAA) return 'ハンク・アーロン賞';
    if (hasRC)  return 'クレメンテ賞';
    if (hasCB)  return 'カムバック賞';

    // ③.5 タイトルなし・規定打席以上でリーグ5位以内の成績があれば肩書に反映
    if (hasEnoughGames) {
      const yearKey = String(row[1] ?? '').trim();
      const rd = _rankDataByYear[yearKey] || {};
      // rank 2〜5 のみ（1位はタイトルとして③で処理済み）
      const pick = (key, labelFn) => {
        const r = rd[key]?.rank;
        return (r && r >= 2 && r <= 5) ? labelFn(r) : null;
      };
      // 優先順: HR > AVG > RBI > OPS > OBP > SB
      const rankLabel =
        pick('hr',  r => `リーグ本塁打${r}位の強打者`)  ||
        pick('avg', r => `リーグ打率${r}位の巧打者`)     ||
        pick('rbi', r => `リーグ打点${r}位の強打者`)     ||
        pick('ops', r => `リーグOPS${r}位打者`)          ||
        pick('obp', r => `リーグ出塁率${r}位打者`)       ||
        pick('sb',  r => `リーグ盗塁${r}位の俊足選手`);
      if (rankLabel) return rankLabel;
    }

    // ④ タイトルなし → 数字ベース（50本台はここで処理）
    if (hr >= 50 && hasEnoughGames) return `${hr}本塁打達成`;
    if (hr >= 40 && hasEnoughGames) return `${hr}本塁打の強打者`;
    if (ops >= 1.20 && hasEnoughGames) return 'OPS怪物打者';
    if (ops >= 1.00 && hasEnoughGames) return '勝負強打者';
    if (avg >= 0.370 && hasEnoughGames) return '首位打者候補';
    if (avg >= 0.340 && hasEnoughGames) return `打率${fmtRate(row[15])}の巧打者`;
    if (sb >= 60) return `${sb}盗塁の俊足選手`;
    if (sb >= 40 && hasEnoughGames) return `${sb}盗塁の俊足選手`;
    if (rbi >= 140) return `${rbi}打点の勝負強打者`;
    if (rbi >= 100 && hasEnoughGames) return `${rbi}打点の勝負強打者`;
    if (hr >= 20 && hasEnoughGames) return `${hr}本塁打の強打者`;
    if (sb >= 20 && hasEnoughGames) return `${sb}盗塁の俊足選手`;
    if (avg >= 0.300 && hasEnoughGames) return `打率${fmtRate(row[15])}の巧打者`;

    // ⑤ ポジション＋能力値を組み合わせた称号（試合数不足・特徴なし時も含む）
    {
      const _spd   = parseInt(row[46]) || 0;
      const _pow   = parseInt(row[45]) || 0;
      const _eye   = parseInt(row[48]) || 0;
      const _steal = parseInt(row[51]) || 0;

      // ユーティリティ判定（イニング最大値の40%以上を守ったポジション数）
      const _posLabels8 = ['C','1B','2B','3B','SS','LF','CF','RF'];
      const _drsInn = [];
      for (let i = 0; i < 8; i++) {
        const inn = parseFloat(row[28 + i * 2]) || 0;
        if (inn > 0) _drsInn.push({ pos: _posLabels8[i], inn });
      }
      const _maxInn   = _drsInn.length > 0 ? Math.max(..._drsInn.map(d => d.inn)) : 0;
      const _multiPos = _maxInn > 0 ? _drsInn.filter(d => d.inn >= _maxInn * 0.4) : [];
      const _isOF     = ['左翼手','中堅手','右翼手'].includes(posJa);
      const _isIF     = ['一塁手','二塁手','三塁手','遊撃手'].includes(posJa);
      const _isMultiOF = _multiPos.length >= 2 && _multiPos.every(d => ['LF','CF','RF'].includes(d.pos));
      const _isUtil   = _multiPos.length >= 3;

      if (_isUtil)                          return 'ユーティリティ選手';
      if (_isMultiOF)                       return 'ユーティリティ外野手';
      if (_spd >= 80 && _isOF)              return '俊足外野手';
      if (_spd >= 75 && _isOF)              return `俊足${posJa}`;
      if (_pow >= 90 && _isIF)              return `強打${posJa}`;
      if (_pow >= 85)                       return `長打力の${posJa || '野手'}`;
      if (_eye >= 85)                       return `出塁型${posJa || '野手'}`;
      if (_steal >= 15 && _spd >= 70 && _isOF) return `走塁型外野手`;
    }
    return posJa || '野手';
  } else {
    const hasKTitle   = awardsJa.some(a => a.includes('奪三振王'));
    const hasEraTitle = awardsJa.some(a => a.includes('最優秀防御率'));
    const hasWTitle   = awardsJa.some(a => a.includes('最多勝'));
    const hasSvTitle  = awardsJa.some(a => a.includes('最多セーブ'));
    const hasHldTitle = awardsJa.some(a => a.includes('最多ホールド'));

    // ① 奪三振数が極めて多い
    if (k >= 300) return `${k}奪三振${hand}`;
    if (k >= 250) {
      if (hasKTitle) return `奪三振王${hand}`;
      // タイトルなし → ランクデータで事実ベース表示
      const yearKey = String(row[1] ?? '').trim();
      const kRank = _rankDataByYear[yearKey]?.k?.rank;
      if (kRank && kRank <= 5) return `奪三振リーグ${kRank}位${hand}`;
      return `${k}奪三振${hand}`;
    }
    // ② 突出した防御率（タイトル有無問わず）
    if (era < 1.80 && gs > 10) return `防御率${row[5]}の${hand}`;
    // ③ 多勝
    if (wins >= 22) return `${wins}勝${hand}`;
    // ④ タイトルから肩書を生成（ERA > W > K > SV > HLD の優先順）
    if (hasEraTitle) return `最優秀防御率${hand}`;
    if (hasWTitle)   return `最多勝${hand}`;
    if (hasKTitle)   return `奪三振王${hand}`;
    if (hasSvTitle)  return `最多セーブ投手`;
    if (hasHldTitle) return `最多ホールド投手`;
    // タイトルなしでもホールドリーグ2〜5位なら肩書に反映
    if (!isStarter) {
      const hldYearKey = String(row[1] ?? '').trim();
      const hldRankVal = _rankDataByYear[hldYearKey]?.hld?.rank;
      if (hldRankVal && hldRankVal >= 2 && hldRankVal <= 5) return `リーグHLD${hldRankVal}位投手`;
    }
    // ⑤ クローザー実績（タイトルなし）
    // ※「不滅の守護神」を名乗るには、実際のクローザー/セットアッパー級の働きが必要：
    //   - イニング数: 40回以上（リリーフ実働量の最低水準）
    //   - セーブ or ホールド: 10以上（実際の救援役割を担った証拠）
    //   いずれかが欠ければ単なる「低防御率の救援投手」止まりとして肩書には使用しない
    if (!isStarter && era < 2.20) {
      const _ipN  = parseFloat(row[10]) || 0;
      const _svN  = parseInt(getFirstColVal(row, g_headers && g_headers[0], ['SV','セーブ','Saves','Save'])) || 0;
      const _hldN = parseInt(getFirstColVal(row, g_headers && g_headers[0], ['HLD','ホールド','Holds','Hold','HD'])) || 0;
      if (_ipN >= 40 && (_svN >= 10 || _hldN >= 10)) return '不滅の守護神';
    }
    // ⑥ その他のタイトルがあれば手腕を付けて整形
    // 「ワールドシリーズ優勝」は「受賞」でなく「制覇」なので別途処理
    if (awardsJa.length) {
      const hasWsChamp = awardsJa.some(a => a === 'ワールドシリーズ優勝');
      // WS優勝以外の個人賞を優先して称号化
      const nonWsAward = awardsJa.find(a => a !== 'ワールドシリーズ優勝');
      if (nonWsAward) {
        const a = nonWsAward;
        return (a.includes('右腕') || a.includes('左腕') || a.includes('投手'))
          ? a : `${a}の${hand}`;
      }
      // WS優勝のみの場合 → 自然な表現で返す
      if (hasWsChamp) return `WS制覇に貢献した${hand}`;
    }
    // ⑦ タイトルなし → 勝利数＋手腕
    return `${wins}勝${hand}投手`;
  }
}

/** 通算成績の歴代順位を返す（1〜10位、圏外は null） */
function _mlbCareerRank(category, value) {
  const tbl = _MLB_RANKS[category];
  if (!tbl || value == null) return null;
  for (let i = 0; i < tbl.length; i++) {
    if (value >= tbl[i]) return i + 1;
  }
  return null;
}

/** 順位テキスト（1位→"歴代最多"、2位以降→"歴代N位"） */
function _rankLabel(r) { return r === 1 ? '歴代最多' : `歴代${r}位`; }

// 数値をそのまま出さず「圧倒的な球威を誇る」等の定性表現に変換
function _pwrDesc(power) {
  if (power >= 95) return '圧倒的な球威を誇る';
  if (power >= 88) return '鋭い球威を持つ';
  if (power >= 80) return '球威ある';
  return '切れ味ある';
}
// 修飾語として前置きするバージョン（「球威抜群の」等）
function _pwrAdj(power) {
  if (power >= 95) return '球威抜群の';
  if (power >= 88) return '球威ある';
  if (power >= 80) return '鋭い';
  return '';
}

/** 英語名（部分一致可）から異名情報を取得 */
function getPlayerNickname(nameEn) {
  if (!nameEn) return null;
  const key = nameEn.toLowerCase().trim();
  if (_PLAYER_NICKNAMES[key]) return _PLAYER_NICKNAMES[key];
  for (const [k, v] of Object.entries(_PLAYER_NICKNAMES)) {
    if (key.includes(k) || k.includes(key)) return v;
  }
  return null;
}

/** 英語名（部分一致可）から選手エピソードを取得 */
function getPlayerLore(nameEn) {
  if (!nameEn) return null;
  const key = nameEn.toLowerCase().trim();
  // 完全一致優先
  if (_PLAYER_LORE[key]) return _PLAYER_LORE[key];
  // 部分一致（キーが名前に含まれる、または名前がキーに含まれる）
  for (const [k, v] of Object.entries(_PLAYER_LORE)) {
    if (key.includes(k) || k.includes(key)) return v;
  }
  return null;
}

  // ※ '最優秀選手' を含む賞（Players Choice賞・MLB.com賞等）はリーグMVPとは別物なので除外
  [/^(AL |NL )?MVP$/, 'MVP'],
  [/サイ・ヤング/,              'CY'],
  [/新人王/,                    'ROY'],
  [/首位打者/,                  'AVG'],
  [/最優秀防御率/,              'ERA'],
  [/本塁打王/,                  'HR'],
  [/打点王/,                    'RBI'],
  [/盗塁王/,                    'SB'],
  [/奪三振王/,                  'K'],
  [/最多勝/,                    'W'],
  [/最多セーブ/,                'SV'],
  [/最多ホールド/,              'HLD'],
  [/OPS首位/,                   'OPS'],
  // 個人表彰・特別賞（通常タイトルの後に表記）
  [/ハンク・アーロン/,          'HAA'],
  [/ロベルト・クレメンテ/,      'RC'],
  [/カムバック/,                'CB'],
  [/ゴールドグラブ/,            'GG'],   // awardToJa は 'ゴールドグラブ賞' を返すので要一致
  [/シルバースラッガー/,        'SS'],
  [/盗塁阻止率No\.1|盗塁阻止率リーグ1位/, 'CSR'],  // 捕手専用：盗塁阻止率リーグNo.1
];
// ── 表示優先度（マッチ順とは独立。小さいほど先に表示）──
// MVP 最優先 → 主要タイトル → 特別賞（HAA/RC/CB）→ 個人守備・打撃表彰（GG/SS）
const _AWARD_PRIORITY = {
  MVP: 0, WSMVP: 1, LCSMVP: 2,
  CY: 3, ROY: 4,
  AVG: 10, ERA: 11, HR: 12, RBI: 13, SB: 14,
  K: 15, W: 16, SV: 17, HLD: 18, OPS: 19,
  HAA: 25, RC: 26, CB: 27,
  GG: 30, SS: 31,
  CSR: 32,  // 捕手：盗塁阻止率No.1
};
// バナーに表示しない（軽微）なアワード
// バナーに表示しない軽微・重複アワード（awardToJaがnullを返す設計に移行済みだが念のため）
const _AWARD_SKIP_RE = /週間|月間|オールスター/;

function _abbrevAward(awardJa) {
  if (_AWARD_SKIP_RE.test(awardJa)) return null;
  for (const [re, abbr] of _AWARD_ABBR_LIST) {
    if (re.test(awardJa)) return abbr;
  }
  return null;
}

/**
 * バナー表示用アワードテキストを生成。
 * isCareer=true の通算行では _awardsJaByYear + _rankDataByYear から集計し「ERA2 K1」形式で返す。
 * isCareer=false の年度行では当年のawardsJaから「CY ERA K」形式で返す。
 */
function _bannerAwardsText(awardsJa, isCareer) {
  if (!isCareer) {
    // 年度カードも優先度順でソート（MVP が先頭に来るよう）
    const abbrs = [...new Set((awardsJa || []).map(_abbrevAward).filter(Boolean))]
      .sort((a, b) => (_AWARD_PRIORITY[a] ?? 99) - (_AWARD_PRIORITY[b] ?? 99));
    return abbrs.join(' ');
  }

  // 通算: 全年度の受賞歴を集計
  const countMap = {};

  // ① _awardsJaByYear に蓄積された受賞歴を集計
  Object.values(_awardsJaByYear).forEach(awards => {
    awards.forEach(a => {
      const abbr = _abbrevAward(a);
      if (abbr) countMap[abbr] = (countMap[abbr] || 0) + 1;
    });
  });

  // ② _rankDataByYear のrank=1を補完（統計タイトル：HR/RBI等は/awardsに含まれないため常に全年度チェック）
  // ※ 旧ロジック「_awardsJaByYear[year]があればスキップ」は通算カードで全年度がスキップされ
  //    HR・RBIが永遠に反映されないバグの原因だったため廃止。
  //    代わりに、同じ略称が既にその年の_awardsJaByYearで計上済みなら加算しないことで二重計上を防ぐ。
  const rankKeyMap = { era:'ERA', k:'K', wins:'W', sv:'SV', hld:'HLD', avg:'AVG', hr:'HR', rbi:'RBI', ops:'OPS', sb:'SB' };
  Object.entries(_rankDataByYear).forEach(([year, rd]) => {
    // その年度の/awardsデータから既に計上済みの略称セットを作る（二重計上防止）
    const alreadyCounted = new Set(
      (_awardsJaByYear[year] || []).map(a => _abbrevAward(a)).filter(Boolean)
    );
    Object.entries(rankKeyMap).forEach(([key, abbr]) => {
      if (rd[key]?.rank === 1 && !alreadyCounted.has(abbr)) {
        countMap[abbr] = (countMap[abbr] || 0) + 1;
      }
    });
  });

  if (!Object.keys(countMap).length) return '';

  // 生涯1度しか受賞できない賞はカウントを1に固定
  const ONE_TIME_AWARDS = new Set(['ROY']);
  Object.keys(countMap).forEach(abbr => {
    if (ONE_TIME_AWARDS.has(abbr)) countMap[abbr] = 1;
  });

  // 優先度順でソート（_AWARD_PRIORITY を使用。MVP が最優先）
  const sorted = Object.entries(countMap)
    .sort((a, b) => (_AWARD_PRIORITY[a[0]] ?? 99) - (_AWARD_PRIORITY[b[0]] ?? 99));
  return sorted.map(([abbr, cnt]) => cnt > 1 ? `${abbr}${cnt}` : abbr).join(' ');
}

/** MLB Stats API からリーグ年度別ランキングを取得（無料・APIキー不要） */
async function fetchLeagueLeaders(year, isPitcher, leagueId) {
  const cats = isPitcher
    ? 'earnedRunAverage,strikeouts,wins,walksAndHitsPerInningPitched,saves,holds,pitchingWar'
    : 'battingAverage,homeRuns,runsBattedIn,onBasePlusSlugging,onBasePercentage,stolenBases,battingWar';
  const statGroup = isPitcher ? 'pitching' : 'hitting';
  // leagueId が指定されていない場合は全MLBで取得（フォールバック）
  const leagueParam = leagueId ? `&leagueId=${leagueId}` : '';
  try {
    // limit=100: 7位まで表示するので余裕を持って取得
    const url = `https://statsapi.mlb.com/api/v1/stats/leaders?leaderCategories=${cats}&season=${year}&sportId=1${leagueParam}&statGroup=${statGroup}&limit=100`;
    const res = await fetch(url);
    if (!res.ok) {
      console.warn(`[LeadersAPI] ${year} HTTP ${res.status}`);
      return {};
    }
    const data = await res.json();
    const result = {};
    (data.leagueLeaders || []).forEach(cat => {
      // rank が "T1" "T2" のような文字列に対応（数字部分のみ抽出）
      result[cat.leaderCategory] = (cat.leaders || []).map(l => ({
        rank: (parseInt(String(l.rank).replace(/\D/g, ''), 10) || 99),
        value: l.value,
        personId: l.person?.id,
      }));
    });
    const keys = Object.keys(result);
    const counts = keys.map(k => `${k}:${result[k].length}`).join(', ');
    console.log(`[LeadersAPI] ${year} L=${leagueId} keys=[${counts}]`);
    return result;
  } catch(e) {
    console.warn(`[LeadersAPI] ${year} 例外:`, e.message);
    return {};
  }
}

/**
 * リーグリーダーデータから選手の順位情報を構築
 * localStats: ローカルExcelの統計値 { avg, hr, rbi, ops, era, k, wins, sb, whip }
 *   APIの値とローカル値を比較し乖離が大きい場合はそのカテゴリをスキップ
 */
function buildRankData(leaders, mlbId, leagueLabel, localStats = {}) {
  const result = { leagueLabel };
  const catMap = {
    earnedRunAverage: 'era', strikeouts: 'k', wins: 'wins',
    walksAndHitsPerInningPitched: 'whip',   // API は "whip" でなくこのキーを返す
    saves: 'sv', holds: 'hld',
    battingAverage: 'avg', homeRuns: 'hr', runsBattedIn: 'rbi',
    onBasePlusSlugging: 'ops', onBasePercentage: 'obp', stolenBases: 'sb',
    battingWar: 'war', pitchingWar: 'war',  // WAR（投手/野手別APIキー）
  };

  const leaderKeys = Object.keys(leaders);
  console.log(`[buildRankData] mlbId=${mlbId} availableKeys=[${leaderKeys.join(',')}]`);

  for (const [apiKey, shortKey] of Object.entries(catMap)) {
    const list = leaders[apiKey] || [];
    if (list.length === 0) {
      // APIキー名が期待と異なる可能性 → 大文字小文字無視でフォールバック検索
      const lowerApiKey = apiKey.toLowerCase();
      const altKey = leaderKeys.find(k => k.toLowerCase() === lowerApiKey);
      if (altKey) {
        console.log(`[buildRankData] キー別名ヒット: ${apiKey} → ${altKey}`);
        // 再試行
        const altList = leaders[altKey] || [];
        const altEntry = altList.find(e => Number(e.personId) === Number(mlbId));
        if (altEntry && altEntry.rank <= 10) {
          console.log(`[buildRankData] ${shortKey}(via ${altKey}): rank=${altEntry.rank} val=${altEntry.value}`);
          result[shortKey] = { rank: altEntry.rank, value: altEntry.value };
        }
      } else {
        console.log(`[buildRankData] ${apiKey}: リストなし`);
      }
      continue;
    }

    // personId は JSON では数値として返るが念のため Number() で比較
    const entry = list.find(e => Number(e.personId) === Number(mlbId));
    if (!entry) {
      const top3 = list.slice(0, 3).map(e => `id=${e.personId}(${e.rank})`).join(', ');
      console.log(`[buildRankData] ${shortKey}: 選手未発見 (上位3: ${top3})`);
      continue;
    }
    if (entry.rank > 7) {
      console.log(`[buildRankData] ${shortKey}: rank=${entry.rank} (7位以下のため除外)`);
      continue;
    }

    console.log(`[buildRankData] ${shortKey}: ✓ rank=${entry.rank} val=${entry.value}`);
    result[shortKey] = { rank: entry.rank, value: entry.value };
  }
  return result;
}

/**
 * 前年比較によるキャリア軌跡を分析（g_dataRows を参照）
 * @returns {{ isBreakthrough, isImprovement, isPeakSeason, isFirstYear,
 *             yearsInLeague, prevMetric, curMetric }}
 */
function analyzeCareerTrajectory(currentRow) {
  if (!g_dataRows || g_dataRows.length < 2) return {};
  const curYear = parseInt(currentRow[1]);
  if (isNaN(curYear)) return {};

  const sorted = g_dataRows
    .filter(r => /^\d{4}$/.test(String(r[1] ?? '')))
    .map(r => ({ year: parseInt(r[1]), row: r }))
    .sort((a, b) => a.year - b.year);

  const idx = sorted.findIndex(y => y.year === curYear);
  if (idx < 0) return {};

  const prev        = idx > 0 ? sorted[idx - 1] : null;
  const debutYear   = sorted[0]?.year;
  const yearsInLeague = debutYear ? (curYear - debutYear + 1) : null;
  const isFirstYear = idx === 0;

  if (g_isPitcher) {
    const curERA   = parseFloat(currentRow[5]) || 99;
    const prevERA  = prev ? (parseFloat(prev.row[5]) || 99) : null;
    const improve  = prevERA !== null ? +(prevERA - curERA).toFixed(2) : 0;
    const isPeak   = sorted.every(y => (parseFloat(y.row[5]) || 99) >= curERA);
    return {
      isBreakthrough: prevERA !== null && prevERA >= 4.00 && curERA < 3.00,
      isImprovement:  improve > 0.70 && curERA < 4.00,
      isPeakSeason:   isPeak,
      isFirstYear,
      yearsInLeague,
      prevMetric: prevERA,
      curMetric:  curERA,
    };
  } else {
    const curOPS  = parseFloat(fmtOPS(currentRow[17])) || 0;
    const prevOPS = prev ? (parseFloat(fmtOPS(prev.row[17])) || 0) : null;
    const improve = prevOPS !== null ? +(curOPS - prevOPS).toFixed(3) : 0;
    const isPeak  = sorted.every(y => (parseFloat(fmtOPS(y.row[17])) || 0) <= curOPS);
    return {
      isBreakthrough: prevOPS !== null && prevOPS < 0.750 && curOPS > 0.900,
      isImprovement:  improve > 0.100,
      isPeakSeason:   isPeak,
      isFirstYear,
      yearsInLeague,
      prevMetric: prevOPS,
      curMetric:  curOPS,
    };
  }
}

// ── Wiki エピソード重複チェック ─────────────────────────────────
/**
 * Wikiエピソードが既存行と重複するかを判定。
 * 英語ニックネーム（"bambino"等）と日本語ニックネーム（「バンビーノ」等）の
 * 言語間重複も nickData 経由で検出する。
 * @param {string}      ep       - 判定するWikiエピソード文字列
 * @param {string[]}    lines    - 現時点の列伝行リスト
 * @param {object|null} nickData - getPlayerNickname() の戻り値（null 可）
 * @returns {boolean} true = 重複なのでスキップすべき
 */
function _isWikiEpDuplicate(ep, lines, nickData = null) {
  // ① 引用符ニックネームが既存行に含まれるか（英語 "" 内テキスト）
  const epNick = ep.match(/"([^"]{3,30})"/);
  if (epNick && lines.some(l => l.toLowerCase().includes(epNick[1].toLowerCase()))) return true;

  // ② 先頭15文字が一致（ほぼ同一文の重複）
  if (lines.some(l => l.slice(0, 15).toLowerCase() === ep.slice(0, 15).toLowerCase())) return true;

  // ③ nickData.line が追加済みの場合のニックネーム言語間重複チェック
  //    「バンビーノ」（日本語）と "the Bambino"（英語）のように
  //    文字列一致しない場合でも同一ニック紹介と判断してスキップ
  if (nickData && lines.some(l => l === nickData.line)) {
    // (a) エピソードの冒頭が「引用句」＋「の異名/愛称」のニック紹介主体パターン
    if (/^["「][^"」]{2,30}["」]の(異名|愛称)/.test(ep) || /の(異名|愛称)を持ち/.test(ep)) return true;
    // (b) nickData.nicks のいずれかが ep に含まれる（日本語ニックの直接一致）
    if (nickData.nicks.some(n => ep.includes(n))) return true;
  }

  // ④ 既存行の引用句セット（「」・""）と ep の引用句との直接重複チェック
  const lineQuoteSet = new Set(
    lines.flatMap(l => {
      const r = [];
      for (const m of l.matchAll(/「([^」]{2,25})」|"([^"]{2,25})"/g))
        r.push((m[1] || m[2]).toLowerCase());
      return r;
    })
  );
  for (const m of ep.matchAll(/「([^」]{2,25})」|"([^"]{2,25})"/g)) {
    if (lineQuoteSet.has((m[1] || m[2]).toLowerCase())) return true;
  }

  return false;
}

// ── 野手・列伝テキスト生成 ────────────────────────────────────
function buildHitterRetsuden(row, year, awardsJa, apiSt, rankData = {}, trajectory = {}, wikiEpisodes = []) {
  const hr    = parseInt(apiSt.homeRuns    ?? row[9])  || 0;
  const rbi   = parseInt(apiSt.rbi         ?? row[10]) || 0;
  const avg   = apiSt.avg  || fmtRate(row[15]);
  const ops   = apiSt.ops  || fmtOPS(row[17]);
  const obp   = apiSt.obp  || fmtRate(row[16]);
  const sb    = parseInt(apiSt.stolenBases ?? getSB(row)) || 0;
  const hits  = parseInt(apiSt.hits        ?? 0)        || 0;
  // 試合数：MLB Stats APIの値を優先。無ければエクセルから正しい列（getHitterGames）で取得。
  // ※ 固定 row[6] は安打列のため使用しない
  const games = (apiSt.gamesPlayed != null && apiSt.gamesPlayed !== '')
    ? parseInt(apiSt.gamesPlayed) || 0
    : getHitterGames(row);
  // 重要度でソートした受賞歴（シーズンタイトル→特別賞の順。オールスター等は除外済み）
  const AWARD_TOP = ['MVP', 'サイ・ヤング', '新人王', '首位打者', '本塁打王', '打点王', '盗塁王', '奪三振王',
                     '最優秀防御率', '最多勝', '最多セーブ', 'ゴールドグラブ', 'シルバースラッガー',
                     'ハンク・アーロン', 'ロベルト・クレメンテ', 'カムバック'];
  const awardsJaSorted = [...awardsJa].sort((a, b) => {
    const ai = AWARD_TOP.findIndex(t => a.includes(t));
    const bi = AWARD_TOP.findIndex(t => b.includes(t));
    return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
  });
  const opsN  = parseFloat(ops) || 0;
  const avgN  = parseFloat(avg) || 0;
  const obpN  = parseFloat(obp) || 0;

  // ── 通算カード判定（1シーズンでは不可能な試合数） ──
  const isCareerCard = !/^\d{4}$/.test(String(year).trim()) || games >= 170;

  if (isCareerCard) {
    // ── 通算カード向けコメント（最大5〜6行） ──
    const lines = [];
    const span = !/^\d{4}$/.test(String(year).trim()) ? '通算' : `${games}試合`;

    // MLBでの活躍が乏しい選手（試合数少・OPS低・受賞歴・異名なし）を判定
    const nickH = getPlayerNickname(g_mlbNameEn);
    const loreH = getPlayerLore(g_mlbNameEn);
    const isObscure = games > 0 && games < 400 && opsN < 0.750
                   && !awardsJa.length && !nickH && !loreH;

    // 行1: 主要スタッツ要約
    const sp = [];
    if (hr  > 0)  sp.push(`${hr}本塁打`);
    if (rbi > 0)  sp.push(`${rbi}打点`);
    sp.push(`打率${avg}`);
    if (sb  > 20) sp.push(`${sb}盗塁`);
    if (isObscure) {
      lines.push(`メジャーでは通算${games}試合に出場し、${sp.join('・')}・OPS${ops}という成績を残した。`);
    } else {
      lines.push(`${span}で${sp.join('・')}・OPS${ops}を積み上げた、リーグを代表し続けた強打者。`);
    }

    // 行2: 受賞歴 OR 主要マイルストーン（obscureは条件を満たさないためスキップされる）
    if (awardsJa.length > 0) {
      lines.push(`${awardsJa.slice(0, 3).join('・')}など栄誉を手にし、時代を代表するスターとして球史に名を刻んだ。`);

        fmt:      r  => `通算${rbi}打点はMLB${_rankLabel(r)}の打点記録であり、勝負強さをキャリア通じて証明した。` },
      { ok: true,
        getR:    () => _mlbCareerRank('sb', sb),
        fmt:      r  => `通算${sb}盗塁はMLB${_rankLabel(r)}の快足伝説で、機動力野球の象徴として球史に輝く。` },
      { ok: games >= 500,
