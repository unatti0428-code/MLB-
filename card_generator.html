// ===== 年度別選手写真取得ユーティリティ =====

/**
 * 画像URLが有効（404でない）か確認する（hidden Imageプローブ）
 * @param {string} url
 * @param {number} timeoutMs タイムアウト（ms）
 * @returns {Promise<boolean>}
 */
function _testImageUrl(url, timeoutMs = 4000) {
  return new Promise(resolve => {
    const img = new Image();
    const timer = setTimeout(() => { img.src = ''; resolve(false); }, timeoutMs);
    img.onload  = () => { clearTimeout(timer); resolve(true); };
    img.onerror = () => { clearTimeout(timer); resolve(false); };
    img.src = url;
  });
}

/**
 * URLの画像が「証明写真として使用できる比率」か確認する
 *
 * 判定基準（高さ÷幅 = H/W比率）:
 *   0.85 〜 1.65 → 証明写真・ポートレートとして許容 ✅
 *   > 1.65       → 全身写真・縦長すぎ                ❌
 *   < 0.85       → 横長のアクション写真              ❌
 *
 * ※ このURLは c_fill/h_282 なし（幅のみ制約）で呼ぶこと。
 *   高さ固定にすると全ての画像が同サイズになり比率判定が無意味になる。
 *
 * @param {string} rawUrl  幅のみ制約のURL (例: ...w_213,q_auto:best/v1/people/...)
 * @param {number} timeoutMs
 * @returns {Promise<boolean>}
 */
// 【シルエット判定方針】
// d_フォールバックなしURLを使う: 実写真あり→onload(true) / なし→404→onerror(false)
// 寸法比較は廃止: c_fit後に実写真もシルエット(188×282)と同じ寸法になり得るため誤判定が発生する
// 例: Judge 2016年写真(縦長原画) → c_fit処理後 188×282 = シルエットと同じ → 誤って拒否
function _testHeadshotUrl(rawUrl, timeoutMs = 4000) {
  return new Promise(resolve => {
    const img = new Image();
    const timer = setTimeout(() => { img.src = ''; resolve(false); }, timeoutMs);
    img.onload = () => {
      clearTimeout(timer);
      const w = img.naturalWidth, h = img.naturalHeight;
      if (!w || !h) { resolve(false); return; }
      const ratio = h / w;
      // 0.85〜1.65: 証明写真として許容する比率範囲（横長アクション写真などを除外）
      if (ratio < 0.85 || ratio > 1.65) { resolve(false); return; }
      resolve(true);
    };
    img.onerror = () => { clearTimeout(timer); resolve(false); };
    img.src = rawUrl;
  });
}

/**
 * MLB CDN のジェネリック（シルエット）画像の寸法をフィンガープリントとして取得。
 * Promise シングルトン：初回のみ実際にロードし、以降はキャッシュを返す。
 */
let _genericFingerprintPromise = null;
function _getGenericFingerprint() {
  if (!_genericFingerprintPromise) {
    _genericFingerprintPromise = new Promise(resolve => {
      const img = new Image();
      const timer = setTimeout(() => { resolve(null); }, 6000);
      img.onload = () => {
        clearTimeout(timer);
        const dims = { w: img.naturalWidth, h: img.naturalHeight };
        console.log('[Photo] ジェネリック画像フィンガープリント取得:', dims.w, '×', dims.h);
        resolve(dims);
      };
      img.onerror = () => { clearTimeout(timer); resolve(null); };
      // 存在しない ID + 年度で d_ フォールバックからジェネリック画像を強制取得
      img.src = 'https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:67:current.png/w_213,h_282,c_fit,q_auto:best/v1/people/1/headshot/67/2000';
    });
  }
  return _genericFingerprintPromise;
}

// ── BRef 写真 バージョン自動検出 ──
let _brefVersionCache = null;
async function _getActiveBRefVersion() {
  if (_brefVersionCache) return _brefVersionCache;

  // ① localStorage キャッシュを確認（有効なら即返す）
  try {
    const cached = localStorage.getItem('brefPhotoVersion');
    if (cached) {
      const testUrl = `https://www.baseball-reference.com/req/${cached}/images/headshots/e/e905e1ef_br.jpg`;
      if (await _testImageUrl(testUrl, 4000)) {
        _brefVersionCache = cached;
        return cached;
      }
      // 無効なキャッシュは削除
      localStorage.removeItem('brefPhotoVersion');
    }
  } catch(e) {}

  // ② 全候補バージョンを並列チェック（404は即座にonerror→高速）
  // 無効バージョンはほぼ0msで失敗し、有効バージョンは~500msで成立する
  console.log('[BRef] バージョン番号スキャン中（並列）...');
  const found = await new Promise(resolve => {
    let settled = false;
    let remaining = _BREF_PHOTO_VERSIONS.length;
    _BREF_PHOTO_VERSIONS.forEach(v => {
      const url = `https://www.baseball-reference.com/req/${v}/images/headshots/e/e905e1ef_br.jpg`;
      _testImageUrl(url, 5000).then(ok => {
        remaining--;
        if (ok && !settled) {
          settled = true;
          resolve(v);
        } else if (remaining === 0 && !settled) {
          resolve(null);
        }
      });
    });
  });

  if (found) {
    _brefVersionCache = found;
    try { localStorage.setItem('brefPhotoVersion', found); } catch(e) {}
    console.log('[BRef] バージョン確認済:', found);
    return found;
  }
  console.warn('[BRef] 有効なバージョン番号なし（_BREF_PHOTO_VERSIONSの更新が必要かもしれません）');
  return null;
}

// ── BRef 写真 直接URL取得（CORSプロキシ不要・画像タグ直読み） ──
// preferTypes: 試す写真タイプの優先順序（古い選手はmilbを優先してチーム時代を反映）
async function _directBRefPhoto(brefId, preferTypes = ['sabr', 'br', 'mlbam', 'davis']) {
  if (!brefId) return null;
  const hash = _getBRefHash(brefId);
  if (!hash) {
    console.log('[BRef] ハッシュ取得不可:', brefId);
    return null;
  }
  const version = await _getActiveBRefVersion();
  if (!version) return null;
  const folder = hash[0];
  const base = `https://www.baseball-reference.com/req/${version}/images/headshots/${folder}/${hash}`;
  for (const type of preferTypes) {
    const url = `${base}_${type}.jpg`;
    if (await _testImageUrl(url, 4000)) {
      console.log('[BRef] 直接写真URL取得:', url);
      return url;
    }
  }
  return null;
}

/**
 * カード年度に合致する選手写真URLをバックグラウンドで探索し、
 * カードの <img> を差し替える。
 *
 * 探索順:
 *  1. MLB Static CDN 全年スキャン ← 最優先（年代不一致でも写真があれば使用）
 *     - 指定年に近い順 → 残り全年(2006〜現在) の順でスキャン
 *     - Cloudinary c_fit,h_282 で切り取りなし表示
 *  2. BRef 直接写真              ← MLB CDN に画像がなかった場合のみ
 *  3. BRef プロキシ写真          ← 最終手段
 *
 * ● 通算カードは g_peakYear の写真を使用（最も活躍したチームの帽子が映る）
 * ● Wikipedia からの写真取得は廃止（老齢期写真など意図しない画像を防ぐため）
 *
 * @param {number|string} mlbId     MLB選手ID
 * @param {string|number} year      カード年度（4桁数字 or 通算文字列）
 * @param {string|null}   brPhoto   BRef フォールバック写真URL
 * @param {number}        genId     世代ID（旧カードへの誤適用防止）
 */

/**
 * MLB CDN の年別ヘッドショットをスキャンしてカード年→写真URLのマップを構築する。
 *
 * ═══ マッピング方式 ═══
 * URL年度 X → カード年度 X+1（シーズン末撮影写真が翌年カードに適用される）
 * スキャン年度: 2014〜2021 + "current" を並列取得
 *
 * ═══ キャリーフォワード ═══
 * URL年度 X がヒット・X+1 がミスの場合 → カード年 X+2 にも X の写真を使用
 * （2021 URL → カード 2022 まで自動延長）
 *
 * ═══ "current" URL の役割 ═══
 * カード年 ≤2014 または ≥2023 → "current" URL を使用
 * 年別URL が全て不在でも "current" がヒットすれば全年度に使用
 *
 * 結果は mlbId でキャッシュ（年度切替時に再スキャン不要）
 *
 * @param {string|number} mlbId
 * @returns {Promise<{cardPhotoMap:Object, currentUrl:string|null, hasAnyPhoto:boolean, hasOnlyCurrent:boolean}>}
 */
async function fetchMlbYearSpecificPhotos(mlbId) {
  const key = String(mlbId);
  if (_mlbYearPhotoCache[key]) return _mlbYearPhotoCache[key];

  const SCAN_YEARS = [2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 'current'];

  // d_ フォールバックなしURL: 実写真→onload / シルエット→404→onerror
  const makeUrl = (y) =>
    `https://img.mlbstatic.com/mlb-photos/image/upload/w_213,h_282,c_fit,q_auto:best/v1/people/${mlbId}/headshot/67/${y}`;

  // 全年度を並列スキャン
  const results = await Promise.all(
    SCAN_YEARS.map(async (y) => {
      const url = makeUrl(y);
      const ok  = await _testHeadshotUrl(url, 5000);
      console.log(`[YearPhoto] ID${mlbId} 年度${y}: ${ok ? '✓実写真' : '✗なし'}`);
      return { year: y, url, ok };
    })
  );

  // ヒットした年度マップ
  const hitMap = {};
  for (const r of results) {
    if (r.ok) hitMap[r.year] = r.url;
  }

  // カード年→写真URL (URL年X → カード年X+1)
  const cardPhotoMap = {};
  for (const urlYear of [2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021]) {
    if (hitMap[urlYear]) cardPhotoMap[urlYear + 1] = hitMap[urlYear];
  }

  // キャリーフォワード: 直前の有効URLを空白年度に引き継ぐ (2015〜2022)
  let lastUrl = null;
  for (let yr = 2015; yr <= 2022; yr++) {
    if (cardPhotoMap[yr]) {
      lastUrl = cardPhotoMap[yr];
    } else if (lastUrl) {
      cardPhotoMap[yr] = lastUrl;
    }
  }

  const hasNumericHit = [2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021].some(y => hitMap[y]);
  const result = {
    cardPhotoMap,
    currentUrl:    hitMap['current'] || null,
    hasAnyPhoto:   Object.keys(hitMap).length > 0,
    hasOnlyCurrent: !hasNumericHit && !!hitMap['current'],
  };
  _mlbYearPhotoCache[key] = result;
  console.log(`[YearPhoto] ID${mlbId} スキャン完了 カード年マップ=`,
    Object.keys(cardPhotoMap), 'current=', !!result.currentUrl);
  return result;
}

/**
 * fetchMlbYearSpecificPhotos の結果からカード年に対応する写真URLを返す。
 * @param {{cardPhotoMap:Object, currentUrl:string|null, hasAnyPhoto:boolean, hasOnlyCurrent:boolean}} cache
 * @param {number|string} cardYear  カード表示年度（4桁数値）
 * @returns {string|null}
 */
function getMlbPhotoForYear(cache, cardYear) {
  if (!cache || !cache.hasAnyPhoto) return null;

  const yr = parseInt(String(cardYear)) || 0;

  // current のみヒット → 全年度に current を使用
  if (cache.hasOnlyCurrent) return cache.currentUrl;

  // カード年 ≤2014 または ≥2023 → "current" URL
  if (yr <= 2014 || yr >= 2023) return cache.currentUrl;

  // カード年 2015〜2022 → 年別マップ（キャリーフォワード済み）、なければ current
  return cache.cardPhotoMap[yr] || cache.currentUrl || null;
}

// ── チームコード → 英語チーム名（Wikimedia Commons 写真検索用） ──────────
// 値は配列（旧称・改名を含む）。Commons の写真説明文・カテゴリと照合する。
const _TEAM_CODE_EN_MAP = {
  TB:  ['Tampa Bay Rays', 'Tampa Bay Devil Rays'], TBR: ['Tampa Bay Rays', 'Tampa Bay Devil Rays'],
  NYY: ['New York Yankees'], BOS: ['Boston Red Sox'], TOR: ['Toronto Blue Jays'], BAL: ['Baltimore Orioles'],
  CLE: ['Cleveland Guardians', 'Cleveland Indians'], DET: ['Detroit Tigers'],
  KC:  ['Kansas City Royals'], KCR: ['Kansas City Royals'], MIN: ['Minnesota Twins'],
  CWS: ['Chicago White Sox'], CHW: ['Chicago White Sox'],
  HOU: ['Houston Astros'], LAA: ['Los Angeles Angels', 'Anaheim Angels', 'California Angels'], ANA: ['Anaheim Angels', 'Los Angeles Angels'],
  OAK: ['Oakland Athletics'], ATH: ['Athletics', 'Oakland Athletics'], SEA: ['Seattle Mariners'], TEX: ['Texas Rangers'],
  ATL: ['Atlanta Braves'], MIA: ['Miami Marlins', 'Florida Marlins'], FLA: ['Florida Marlins'],
  NYM: ['New York Mets'], PHI: ['Philadelphia Phillies'], WSH: ['Washington Nationals'], WSN: ['Washington Nationals'],
  CHC: ['Chicago Cubs'], CIN: ['Cincinnati Reds'], MIL: ['Milwaukee Brewers'], PIT: ['Pittsburgh Pirates'],
  STL: ['St. Louis Cardinals'], ARI: ['Arizona Diamondbacks'], AZ: ['Arizona Diamondbacks'],
  COL: ['Colorado Rockies'], LAD: ['Los Angeles Dodgers', 'Brooklyn Dodgers'],
  SD:  ['San Diego Padres'], SDP: ['San Diego Padres'], SF: ['San Francisco Giants'], SFG: ['San Francisco Giants'],
  MON: ['Montreal Expos'],
};

// ── 現在の所属チーム略称を取得（MLB Stats API・キャッシュ付き） ──
const _curTeamCache = {};
async function _fetchMlbCurrentTeamAbbr(mlbId) {
  if (!mlbId) return null;
  if (_curTeamCache[mlbId] !== undefined) return _curTeamCache[mlbId];
  try {
    const res = await fetch(`https://statsapi.mlb.com/api/v1/people/${mlbId}?hydrate=currentTeam`);
    if (!res.ok) { _curTeamCache[mlbId] = null; return null; }
    const d = await res.json();
    const t = d?.people?.[0]?.currentTeam;
    let abbr = t?.abbreviation || null;
    if (!abbr && t?.id) {
      const r2 = await fetch(`https://statsapi.mlb.com/api/v1/teams/${t.id}`);
      if (r2.ok) {
        const d2 = await r2.json();
        abbr = d2?.teams?.[0]?.abbreviation || null;
      }
    }
    _curTeamCache[mlbId] = abbr;
    return abbr;
  } catch (e) {
    _curTeamCache[mlbId] = null;
    return null;
  }
}

/**
 * Wikimedia Commons（フリーライセンス画像）から
 * 「指定チームのユニフォームを着た選手写真」を探す。
 * 選手カテゴリ内の各画像の説明文・カテゴリ・撮影日を照合し、
 * チーム名一致（必須）＋撮影年の近さでスコアリングして最良の1枚を返す。
 * @param {string} nameEn   選手英語名（例 "Tyler Glasnow"）
 * @param {string} teamCode カードのチームコード（例 "TB"）
 * @param {number|string} cardYear カード年度
 * @returns {Promise<string|null>} 画像URL（640px幅サムネイル）または null
 */
/**
 * 写真用チームコード正規化。
 * "BAL2" のような在籍区分付きコード（2度目の在籍等）から末尾数字を除去し、
 * 写真の検索・保存・比較ではすべて素のチームコード（"BAL"）として扱う。
 * ※ カード表示用の正規化（normalizeTeamCode）は末尾数字を保持するため別関数とする
 */
function _photoTeamCode(code) {
  const c = normalizeTeamCode(String(code || '').trim());
  return c ? String(c).replace(/\d+$/, '') : c;
}

/**
 * 成績データ（g_dataRows）から指定年度の所属チームコードを逆引きする。
 * その年に複数チームに所属（シーズン途中移籍）の場合はユニフォームを
 * 特定できないため null を返す。
 * @param {number|string} year
 * @returns {string|null} 写真用正規化済みチームコード（例 "TB"）または null
 */
function _yearTeamFromData(year) {
  if (!g_dataRows) return null;
  const rows = g_dataRows.filter(r => String(r[1] ?? '').trim() === String(year));
  const teams = [...new Set(
    rows.map(r => _photoTeamCode(r[2]))
        .filter(tc => tc && tc !== 'TOT' && tc !== '--')
  )];
  return teams.length === 1 ? teams[0] : null;
}

const _commonsPhotoCache = {};
async function _fetchCommonsTeamPhoto(nameEn, teamCode, cardYear) {
  const teamNames = _TEAM_CODE_EN_MAP[teamCode];
  if (!nameEn || !teamNames) return null;
  const cacheKey = `${nameEn}|${teamCode}|${cardYear}`;
  if (_commonsPhotoCache[cacheKey] !== undefined) return _commonsPhotoCache[cacheKey];

  const fetchCat = async (catTitle) => {
    const url = 'https://commons.wikimedia.org/w/api.php?action=query&generator=categorymembers' +
      `&gcmtitle=${encodeURIComponent('Category:' + catTitle)}&gcmtype=file&gcmlimit=50` +
      '&prop=imageinfo&iiprop=url|size|extmetadata&iiurlwidth=640&format=json&origin=*';
    const res = await fetch(url);
    if (!res.ok) return null;
    const d = await res.json();
    return d?.query?.pages ? Object.values(d.query.pages) : null;
  };

  try {
    let pages = await fetchCat(nameEn.trim());
    if (!pages || !pages.length) pages = await fetchCat(`${nameEn.trim()} (baseball)`);
    // カテゴリ未整備の選手向け：ファイル名前空間の全文検索でフォールバック
    let fromSearch = false;
    if (!pages || !pages.length) {
      const sUrl = 'https://commons.wikimedia.org/w/api.php?action=query&generator=search' +
        `&gsrsearch=${encodeURIComponent('"' + nameEn.trim() + '"')}&gsrnamespace=6&gsrlimit=30` +
        '&prop=imageinfo&iiprop=url|size|extmetadata&iiurlwidth=640&format=json&origin=*';
      const sRes = await fetch(sUrl);
      if (sRes.ok) {
        const sd = await sRes.json();
        pages = sd?.query?.pages ? Object.values(sd.query.pages) : null;
        fromSearch = !!(pages && pages.length);
      }
    }
    if (!pages || !pages.length) { _commonsPhotoCache[cacheKey] = null; return null; }

    // チーム名の出現が「対戦相手」文脈（against/vs等の直後）のみの場合は不採用にする判定
    const teamMentionValid = (txt, tnLower) => {
      let idx = 0;
      while ((idx = txt.indexOf(tnLower, idx)) !== -1) {
        const before = txt.slice(Math.max(0, idx - 30), idx);
        if (!/(?:against|vs\.?|versus)\s+(?:the\s+)?[a-z .]*$/.test(before)) return true;
        idx += tnLower.length;
      }
      return false;
    };

    const nameLower = nameEn.trim().toLowerCase();
    const yrN = parseInt(cardYear) || 0;
    let best = null, bestScore = 0;
    for (const p of pages) {
      const ii = p.imageinfo && p.imageinfo[0];
      if (!ii) continue;
      const title = String(p.title || '');
      if (!/\.(jpe?g|png)$/i.test(title)) continue;                    // 写真のみ（SVG等除外）
      if ((ii.width || 0) < 240 || (ii.height || 0) < 240) continue;   // 低解像度は除外
      const md = ii.extmetadata || {};
      const text = (
        title + ' ' +
        String(md.ImageDescription?.value || '') + ' ' +
        String(md.Categories?.value || '') + ' ' +
        String(md.ObjectName?.value || '')
      ).toLowerCase();

      // ⓪ 被写体特定ガード：ファイル名に選手の姓を含まない写真は除外
      //    （「MacDill hosts Tampa Bay Rays」のようなイベント・集合写真の誤採用防止）
      const titleLower = title.toLowerCase().replace(/^file:/, '').trim();
      const lastName = nameLower.split(' ').pop();
      if (!titleLower.includes(lastName)) continue;
      // 全文検索由来の場合はさらにフルネームの含有も必須とする
      if (fromSearch && !text.includes(nameLower)) continue;

      // ② 撮影年（DateTimeOriginal を優先。説明文/ファイル名の年は補助扱い）
      let photoYrFromDate = 0;
      const dateStr = String(md.DateTimeOriginal?.value || '');
      const dm = dateStr.match(/(19|20)\d{2}/);
      if (dm) photoYrFromDate = parseInt(dm[0]);
      let photoYr = photoYrFromDate;
      if (!photoYr) {
        const ym = text.match(/(19|20)\d{2}/);
        if (ym) photoYr = parseInt(ym[0]);
      }

      // ① チーム一致判定（いずれか必須）
      //    (a) チーム名の言及（「against the Rays」等の対戦相手言及は除外）
      //    (b) 撮影年が確実（EXIF由来）で、その年の所属チームがカードのチームと一致
      //        →説明文にチーム名がなくても、撮影時期からユニフォーム一致と判断できる
      let teamHit = teamNames.some(tn => teamMentionValid(text, tn.toLowerCase()));
      if (!teamHit) {
        teamHit = teamNames.some(tn => {
          const nick = tn.split(' ').pop().toLowerCase();
          return nick.length >= 4 && teamMentionValid(text, nick);
        });
      }
      if (!teamHit && photoYrFromDate) {
        teamHit = _yearTeamFromData(photoYrFromDate) === teamCode;
      }
      if (!teamHit) continue;

      let score = 6; // チーム一致の基礎点
      if (photoYr && yrN) {
        const diff = Math.abs(photoYr - yrN);
        if (diff === 0)      score += 5;
        else if (diff === 1) score += 3;
        else if (diff === 2) score += 1;
        else if (diff >= 5)  continue; // 年代が離れすぎ（同チーム再入団等の誤適用防止）
      }
      if ((ii.height || 0) > (ii.width || 0)) score += 1; // 縦長（人物写真向き）を優遇
      // ファイル名が選手名で始まる＝個人ショットの可能性が高い → 集合・イベント写真より優遇
      if (title.toLowerCase().replace(/^file:/, '').trim().startsWith(nameLower)) score += 3;

      if (score > bestScore) { bestScore = score; best = ii.thumburl || ii.url; }
    }
    _commonsPhotoCache[cacheKey] = best;
    if (best) console.log(`[Commons] ${nameEn} ${teamCode} ${cardYear}年 → チーム一致写真 (score=${bestScore})`);
    else      console.log(`[Commons] ${nameEn} ${teamCode} → チーム一致写真なし`);
    return best;
  } catch (e) {
    console.warn('[Commons] 検索失敗:', e.message);
    _commonsPhotoCache[cacheKey] = null;
    return null;
  }
}

/**
 * カード年度に合致する選手写真URLをバックグラウンドで探索し、
 * カードの <img> を差し替える。
 *
 * ═══ 探索方針 ═══
 * ① MLB Static CDN 年別スキャン（fetchMlbYearSpecificPhotos キャッシュ使用）
 *    URL年 X → カード年 X+1 のマッピング、キャリーフォワードで空白年を補完
 * ② BRef 直接写真（MLB CDN 全滅時のみ）
 * ③ BRef プロキシ写真（最終手段）
 *
 * @param {number|string} mlbId     MLB選手ID
 * @param {string|number} year      カード年度（4桁数字 or 通算文字列）
 * @param {string|null}   brPhoto   BRef フォールバック写真URL
 * @param {number}        genId     世代ID（旧カードへの誤適用防止）
 */
async function resolveYearPhotoAsync(mlbId, year, brPhoto, genId) {
  if (!mlbId) return;

  // 通算カードはピーク年度の写真を使用（最も活躍したチームの帽子が映る）
  const isCareer = !/^\d{4}$/.test(String(year));
  const baseYear = isCareer ? (g_peakYear || null) : year;
  if (!baseYear || !/^\d{4}$/.test(String(baseYear))) return;

  const yr  = parseInt(baseYear);
  const isOldPlayer = yr < 2010;

  let found = null;
  let mlbCurrentUrl = null;  // Step1.5 で「currentフォールバックかどうか」を判定するために保持

  // ── Step 1: MLB CDN 年別スキャン（fetchMlbYearSpecificPhotos キャッシュ使用）──
  // URL年度 X → カード年度 X+1 のマッピング。キャリーフォワードで空白年を補完。
  // g_mlbHasRealPhoto === false（全年シルエット確認済み）の場合はスキャンをスキップ。
  if (g_mlbHasRealPhoto === false) {
    console.log('[Photo] MLB シルエット確認済 → CDNスキャンをスキップ、BRef直接取得へ');
  } else {
    const yearCache = await fetchMlbYearSpecificPhotos(mlbId);
    mlbCurrentUrl = yearCache.currentUrl || null;
    if (yearCache.hasAnyPhoto) {
      // 通算カードはピーク年、単年カードはカード年でルックアップ
      const lookupYear = isCareer ? (parseInt(g_peakYear) || yr) : yr;
      const yearUrl = getMlbPhotoForYear(yearCache, lookupYear);
      if (yearUrl) {
        found = yearUrl;
        console.log(`[Photo] MLB年別写真 カード年${lookupYear} → 取得成功`);
      }
    } else {
      // 全年度シルエット/なし → BRef へ委譲
      console.log('[Photo] MLB CDN 全年度シルエット/なし → BRef取得へ');
      if (g_mlbHasRealPhoto === null) g_mlbHasRealPhoto = false;
    }
  }

  // ── Step 1.5: チームユニフォーム一致写真（Wikimedia Commons・フリーライセンス）──
  // MLBから取れた写真が「current（現在の所属）」のフォールバックで、かつ
  // カードのチームと現在の所属チームが異なる場合、ユニフォームが合わない。
  // その場合に限り、Commons からカードのチーム名・撮影年が一致する写真を探して優先採用する。
  // （年別の正しいMLB写真が取れている場合は何もしない）
  try {
    // "BAL2"等の在籍区分付きコードは末尾数字を除去して素のチームとして写真判定する
    const cardTeamCode = _photoTeamCode(
      (isCareer && g_careerTeam) ? String(g_careerTeam) : String((g_selectedRow && g_selectedRow[2]) || '')
    );
    const isCurrentFallback = found !== null && mlbCurrentUrl !== null && found === mlbCurrentUrl;
    if (g_mlbNameEn && cardTeamCode && _TEAM_CODE_EN_MAP[cardTeamCode] && (!found || isCurrentFallback)) {
      let needCommons = !found;
      if (isCurrentFallback) {
        const curAbbr = await _fetchMlbCurrentTeamAbbr(mlbId);
        // 現在の所属チームとカードのチームが同じなら current写真で正しい → Commons不要
        needCommons = !curAbbr || _photoTeamCode(curAbbr) !== cardTeamCode;
      }
      if (needCommons) {
        // ── 第一優先: MLB年別写真（証明写真スタイル）の時代一致流用 ──
        // カードのチームに所属していた時代の年別写真があればそれを使う。
        // 例: 2023年TBカード → 2021年撮影(TB時代)の年別写真を流用
        // （ユニフォーム・画風ともカード向けに最適なMLB公式ヘッドショット）
        let rescued = false;
        const yc = await fetchMlbYearSpecificPhotos(mlbId); // キャッシュ済みのため追加コストなし
        for (let cy = 2022; cy >= 2015; cy--) {
          const u = yc.cardPhotoMap[cy];
          if (!u) continue;
          // cardPhotoMap[cy] は URL年 cy-1（シーズン末撮影）の写真 → cy-1 の所属で判定
          if (_yearTeamFromData(cy - 1) === cardTeamCode) {
            found = u;
            rescued = true;
            console.log(`[Photo] 年別写真を時代一致で流用（撮影${cy - 1}年・${cardTeamCode}時代）`);
            break; // 最も新しい時代一致写真を採用
          }
        }
        // ── 第二優先: Wikimedia Commons（年別写真で救済できない場合のみ） ──
        if (!rescued) {
          const commonsUrl = await _fetchCommonsTeamPhoto(g_mlbNameEn, cardTeamCode, yr);
          if (commonsUrl) {
            found = commonsUrl;
            console.log('[Photo] Commonsチーム一致写真 使用:', commonsUrl);
          }
        }
      }
    }
  } catch (e) {
    console.warn('[Photo] Commons検索エラー（既存写真で続行）:', e.message);
  }

  // ── Step 2: BRef 直接写真（MLBシルエット確認済み or 未確認のみ。実写真確認済みは使わない） ──
  // g_mlbHasRealPhoto === true の選手にBRefを使うと画質が劣化するため絶対に使わない
  if (!found && g_mlbHasRealPhoto !== true) {
    const typeOrder = isOldPlayer
      ? ['sabr', 'br', 'milb', 'mlbam', 'davis']
      : ['sabr', 'br', 'mlbam', 'davis'];

    if (g_brefId) {
      const directPhoto = await _directBRefPhoto(g_brefId, typeOrder);
      if (directPhoto) {
        found = directPhoto;
        console.log('[Photo] BRef直接写真 使用:', directPhoto);
      }
    }
    if (!found && g_mlbNameEn) {
      const cands = _genBRefCandidates(g_mlbNameEn);
      for (const candidateId of cands) {
        if (candidateId === g_brefId) continue;
        const directPhoto = await _directBRefPhoto(candidateId, typeOrder);
        if (directPhoto) {
          found = directPhoto;
          console.log('[Photo] BRef写真取得（名前推定）:', candidateId);
          break;
        }
      }
    }
  } else if (!found && g_mlbHasRealPhoto === true) {
    // MLB実写真確認済みだが年度別URLが見つからなかった → current URLのまま維持（BRefは使わない）
    console.log('[Photo] MLB実写真確認済みのためBRefはスキップ → current URLを維持');
  }

  // ── Step 3: BRef キャッシュ写真（最終手段・MLBシルエット確認済みor未確認のみ） ──
  if (!found && g_mlbHasRealPhoto !== true && brPhoto) {
    if (await _testImageUrl(brPhoto)) {
      found = brPhoto;
      console.log('[Photo] BRefキャッシュ写真 使用:', brPhoto);
    }
  }

  // ── 更新: genIdが一致する場合のみカードのimgを差し替え ──
  if (found && g_genId === genId) {
    const photoImg = document.querySelector('#card-root .photo-frame img');
    if (photoImg) {
      photoImg.src     = found;
      g_resolvedPhotoUrl = found;
      console.log('[Photo] カード写真更新完了:', found);
    }
  }
}

// ═══ チーム別写真メモリ ═══════════════════════════════════════
// 手動アップロードした写真を「選手×チーム」単位で localStorage に保存し、
// 同じチームに所属する他年度のカード生成時に自動転用する。
// （例: BAL時代の写真を一度アップロード → 2022〜2025のBAL年度すべてに適用）
let g_teamPhotoLocked = false; // 保存写真適用中は非同期写真解決を停止するフラグ

function _teamPhotoStoreKey(row) {
  const playerKey = g_mlbId || String((row && row[0]) || '').trim() || null;
  if (!playerKey) return null;
  const isCareer = !/^\d{4}$/.test(String((row && row[1]) ?? '').trim());
  // "BAL2"等の在籍区分付きコードは末尾数字を除去し、同一チームとして保存・適用する
  const teamCode = _photoTeamCode(
    (isCareer && g_careerTeam) ? String(g_careerTeam) : String((row && row[2]) || '').trim()
  );
  if (!teamCode || teamCode === 'TOT' || teamCode === '--') return null;
  return `mlbcard_teamphoto_${playerKey}_${teamCode}`;
}

/** 手動アップロード写真を縮小JPEG(data URL)化してチーム別に保存する */
function _saveTeamPhoto(srcUrl, row) {
  const key = _teamPhotoStoreKey(row);
  if (!key) return;
  const img = new Image();
  img.onload = () => {
    try {
      const maxW = 640;
      const scale = Math.min(1, maxW / (img.naturalWidth || maxW));
      const canvas = document.createElement('canvas');
      canvas.width  = Math.round((img.naturalWidth  || maxW) * scale);
      canvas.height = Math.round((img.naturalHeight || maxW) * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      localStorage.setItem(key, dataUrl);
      console.log('[TeamPhoto] 保存:', key, `(${Math.round(dataUrl.length / 1024)}KB)`);
    } catch (e) {
      // localStorage 容量超過等は無視（保存できなくても生成は続行）
      console.warn('[TeamPhoto] 保存失敗:', e.message);
    }
  };
  img.src = srcUrl;
}

/** 保存済みチーム別写真を取得（なければ null） */
function _loadTeamPhoto(row) {
  const key = _teamPhotoStoreKey(row);
  if (!key) return null;
  try { return localStorage.getItem(key); } catch (e) { return null; }
}

async function _doGenerate(photoInput) {
  // ※ プロキシ経由の自動BRefフェッチは file:// 環境では常に失敗するため廃止。
  //    WAR/FIPは貼り付けUIから取得済みのキャッシュを使用する。
  try {
    // 選択年のデータ行を取得
    const selYearEl = document.getElementById('year-select');
    let selectedRow;
    if (selYearEl && selYearEl.value && g_dataRows) {
      selectedRow = g_dataRows.find(r => String(r[1]) === String(selYearEl.value));
    }
    if (!selectedRow) {
      // フォールバック: 総合力スコア（WAR込み）が最高の年を選択
      recalcPeakYear();
      selectedRow = g_dataRows.find(r => String(r[1]) === String(g_peakYear))
                 || g_dataRows[0];
    }

    // ピーク年かどうかのフラグ
    const isPeakRow = String(selectedRow[1]) === String(g_peakYear);

    // 通算行WARの事前計算（表面・裏面・総合力スコアで共有）
    {
      const _isCareer = r => !/^\d{4}$/.test(String(r[1] ?? '').trim());
      if (_isCareer(selectedRow) && g_headers && g_dataRows) {
        const hdr = g_headers[0] || [];
        const yr2r = {};
        g_dataRows.filter(r => !_isCareer(r)).forEach(r => {
          const yr = String(r[1] ?? '');
          if (yr) { if (!yr2r[yr]) yr2r[yr] = []; yr2r[yr].push(r); }
        });
        const cRows = Object.values(yr2r).map(rows => {
          const tot = rows.find(r => String(r[2] || '').toUpperCase() === 'TOT');
          return tot || rows[0];
        });
        const getWt = r => {
          if (g_isPitcher) return parseFloat(r[10]) || 0;
          const ab = parseFloat(getFirstColVal(r, hdr, ['AB','打数','At Bats']));
          return isNaN(ab) ? 0 : ab;
        };
        let wS = 0, wT = 0;
        cRows.forEach(r => {
          const raw = resolveWAR(r, hdr, g_isPitcher);
          const num = parseFloat(String(raw ?? '').replace('~', ''));
          const w   = getWt(r);
          if (!isNaN(num) && w > 0) { wS += num * w; wT += w; }
        });
        g_careerWAR = wT > 0 ? (wS / wT).toFixed(1) : null;
      } else {
        g_careerWAR = null;
      }
      // 通算行専用：キャリア最多試合チームを事前計算（表面・裏面で共有）
      // 通算行の入力値は使わず、常にシーズンデータから自動計算する
      // （"SEA2"→"SEA" のように末尾数字を正規化して集計）
      g_careerTeam = careerPrimaryTeam(g_dataRows, g_isPitcher);
    }

    // 総合力 → 星数 → テーマ（キャップなし・100超で6星ホログラム）
    let overallScore;
    if (g_isPitcher) {
      const _fipOvr = (() => {
        const yr = String(selectedRow[1] ?? '');
        const brF = /^\d{4}$/.test(yr) ? getBRefFIP(yr) : null;
        return brF !== null ? parseFloat(brF) : calcFIP(selectedRow);
      })();
      // WAR: 通算行は g_careerWAR（IP加重平均）を優先、単年は resolveWAR で取得
      const realWarP = g_careerWAR ?? (g_headers ? resolveWAR(selectedRow, g_headers[0], true) : '--');
      overallScore = calcPitcherOverall(selectedRow, _fipOvr, realWarP);
    } else {
      const realWarG = g_careerWAR ?? (g_headers ? resolveWAR(selectedRow, g_headers[0], false) : '--');
      overallScore = calcHitterOverall(selectedRow, g_isCatcher, realWarG);
    }
    g_baseOverallScore = overallScore; // タイトル加点前のスコアを保存
    g_genId++;          // 新カード生成を開始：古い非同期処理が誤って加点するのを防ぐ
    g_teamPhotoLocked  = false; // チーム別保存写真のロックをリセット（適用時に再セット）
    g_lastIsCareer     = false; // 非同期完了前でも古いcareerフラグが残らないよう即リセット
    g_selectedRow      = selectedRow;
    g_isPeakRow        = isPeakRow;

    const stars = overallScore > 99 ? 6
                : overallScore >= 90 ? 5
                : overallScore >= 80 ? 4
                : overallScore >= 70 ? 3
                : overallScore >= 60 ? 2
                : overallScore >= 50 ? 1 : 0;
    currentStars = stars;
    const theme  = getThemeVars(stars);
    g_currentTheme = theme; // 最新テーマを保持（保存時に参照）

    // カードHTML生成（英語名を渡す）
    const nameEn = g_mlbNameEn || '';
    let cardContent;
    if (g_isPitcher) {
      cardContent = buildPitcherCard(selectedRow, g_rows, '__PHOTO__', theme, isPeakRow, nameEn);
    } else {
      cardContent = buildHitterCard(selectedRow, g_rows, '__PHOTO__', theme, g_isCatcher, isPeakRow, nameEn);
    }

    // ══ 写真の即時差し込み ══
    // 優先順位（即時）:
    //   ① 手動アップロード
    //   ② MLB CDN 実写真（確認済み: g_mlbHasRealPhoto === true）
    //   ③ BRef写真（MLBがシルエット確認済み OR MLB IDなし）
    //      キャッシュ済みURL → _directBRefPhoto → resolveYearPhotoAsync 委譲
    //   ④ BRefキャッシュあり（MLB未確認: null）→ BRefを暫定使用
    //      resolveYearPhotoAsync が後でMLB実写真があれば差し替える
    //   ⑤ MLB CDN（genericフォールバック付き）暫定表示（BRefなし・未確認）
    //   ⑥ 写真なし
    //
    // シルエット判定方法:
    //   mlbSelectPlayer() 実行時に「d_ フォールバックなし」のURLを試し
    //   404→onerror なら g_mlbHasRealPhoto=false、ロード成功なら true を設定
    //   （日本人など旧選手は MLB CDN に写真がなく即座に false 判定）
    const brPhoto = g_brefId ? _brefCache[g_brefId]?.photoUrl : null;
    const _isManualPhoto = !!(photoInput && photoInput.files && photoInput.files[0]);
    const mlbCurrent = g_mlbId
      ? `https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:67:current.png/w_213,h_282,c_fit,q_auto:best/v1/people/${g_mlbId}/headshot/67/current`
      : null;

    const _savedTeamPhoto = _isManualPhoto ? null : _loadTeamPhoto(selectedRow);

    if (_isManualPhoto) {
      // ① 手動アップロード最優先
      const photoURL = URL.createObjectURL(photoInput.files[0]);
      cardContent = cardContent.replace(/__PHOTO__/g, photoURL);
      g_resolvedPhotoUrl = photoURL;
      // チーム別写真メモリへ保存（同チーム所属の他年度カードに自動転用される）
      _saveTeamPhoto(photoURL, selectedRow);

    } else if (_savedTeamPhoto) {
      // ①-b 保存済みチーム別写真（過去に手動アップロードした同チーム時代の写真）
      cardContent = cardContent.replace(/__PHOTO__/g, _savedTeamPhoto);
      g_resolvedPhotoUrl = _savedTeamPhoto;
      g_teamPhotoLocked = true; // 非同期写真解決による上書きを防止
      console.log('[TeamPhoto] 保存済みチーム別写真を適用');

    } else if (g_mlbId && g_mlbHasRealPhoto === true) {
      // ② MLB実写真が確認済み → MLB CDN使用（最良品質）
      // 年別スキャンキャッシュが既にあれば年度対応URLを即時使用（年度切替の2回目以降）
      const _yrCache = _mlbYearPhotoCache[String(g_mlbId)];
      const _isCareerNow = !/^\d{4}$/.test(String(selectedRow[1] ?? ''));
      const _lookupYr = _isCareerNow ? (parseInt(g_peakYear) || 0) : parseInt(String(selectedRow[1]));
      const _cachedYrUrl = _yrCache ? getMlbPhotoForYear(_yrCache, _lookupYr) : null;
      const _photoUrl2 = _cachedYrUrl || mlbCurrent;
      cardContent = cardContent.replace(/__PHOTO__/g, _photoUrl2);
      g_resolvedPhotoUrl = _photoUrl2;
      console.log(_cachedYrUrl
        ? `[Photo] MLB年別キャッシュ→カード年${_lookupYr}の写真を即時適用`
        : '[Photo] MLB実写真確認済 → MLB CDN(current)使用');

    } else if (g_mlbHasRealPhoto === false || !g_mlbId) {
      // ③ MLBシルエット確認済み OR MLB IDなし → BRef写真を優先
      // BRefキャッシュ済みURL → _directBRefPhoto → 見つからなければmlbCurrent(シルエット)
      const _yr = parseInt(String(selectedRow[1] ?? '')) || 2000;
      const _isOld = _yr < 2010;
      const _types = _isOld ? ['sabr','br','milb','mlbam','davis'] : ['sabr','br','mlbam','davis'];
      let _brefPhoto = brPhoto;
      if (!_brefPhoto && g_brefId) {
        const reason = g_mlbHasRealPhoto === false ? 'MLBシルエット確認済' : 'MLB IDなし';
        console.log(`[Photo] ${reason} → BRef直接取得中...`);
        _brefPhoto = await _directBRefPhoto(g_brefId, _types);
        if (_brefPhoto) console.log('[Photo] BRef直接取得成功:', _brefPhoto);
        else            console.log('[Photo] BRef直接取得も失敗 → resolveYearPhotoAsyncに委譲');
      } else if (_brefPhoto) {
        console.log('[Photo] BRefキャッシュ使用:', _brefPhoto);
      }
      const _useUrl = _brefPhoto || mlbCurrent || '';
      cardContent = cardContent.replace(/__PHOTO__/g, _useUrl);
      g_resolvedPhotoUrl = _useUrl;

    } else if (brPhoto) {
      // ④ MLB未確認(null) + BRefキャッシュあり → BRefを暫定使用
      // resolveYearPhotoAsync がMLB実写真を確認できれば後で差し替える
      console.log('[Photo] MLB未確認 → BRefキャッシュを暫定使用:', brPhoto);
      cardContent = cardContent.replace(/__PHOTO__/g, brPhoto);
      g_resolvedPhotoUrl = brPhoto;

    } else if (mlbCurrent) {
      // ⑤ MLB未確認(null) + BRefなし → genericフォールバック付きURLで暫定表示
      // resolveYearPhotoAsync が後で差し替える
      cardContent = cardContent.replace(/__PHOTO__/g, mlbCurrent);
      g_resolvedPhotoUrl = mlbCurrent;

    } else {
      // ⑥ 写真なし
      cardContent = cardContent.replace(/__PHOTO__/g, '');
      g_resolvedPhotoUrl = '';
    }

    // スコープ付き CSS をページに注入
    let styleEl = document.getElementById('card-dynamic-css');
    if (styleEl) styleEl.remove();
    styleEl = document.createElement('style');
    styleEl.id = 'card-dynamic-css';
    styleEl.textContent = getCardCSS(theme);
    document.head.appendChild(styleEl);

    // カード描画（フリップ構造）
    const area = document.getElementById('card-area');
    area.innerHTML =
      `<div id="card-root">` +
        `<div class="card-flip-scene">` +
          `<div class="card-flip-inner" id="card-flip-inner">` +
            `<div class="card-face card-front-face"><div class="card">${cardContent}</div></div>` +
            `<div class="card-face card-back-face" id="card-back-face"></div>` +
          `</div>` +
        `</div>` +
      `</div>`;

    // 年度別写真の非同期解決（手動アップロード・保存済みチーム別写真がない場合のみ）
    // カードが表示された後、バックグラウンドで年度に合致する写真を探し差し替える
    if (!_isManualPhoto && !g_teamPhotoLocked && g_mlbId) {
      const _thisGenId = g_genId; // クロージャでキャプチャ（旧世代への誤適用防止）
      resolveYearPhotoAsync(g_mlbId, selectedRow[1], brPhoto, _thisGenId);
    }

    // 名前はみ出し防止 ＋ 裏面構築（描画後に測定）
    requestAnimationFrame(() => {
      fitPlayerNames();
      // フリップ内の高さを表面カードに合わせる
      const flipInner = document.getElementById('card-flip-inner');
      const frontCard = flipInner && flipInner.querySelector('.card-front-face .card');
      if (flipInner && frontCard) {
        flipInner.style.height = frontCard.offsetHeight + 'px';
      }
      // 裏面HTML構築
      buildAndAttachCardBack();
      // 初期状態: 裏面はポインターイベント無効
      if (flipInner) _syncFlipPointerEvents(flipInner, false);
      // 表面全体クリック → 裏返し
      const frontFace = flipInner && flipInner.querySelector('.card-front-face');
      if (frontFace) {
        frontFace.style.cursor = 'pointer';
        frontFace.addEventListener('click', () => toggleCardFlip(null));
      }
    });

    // 保存ボタンを表示・保存データをセット
    currentSaveData = {
      theme,
      playerName: selectedRow[0] || 'player',
      year      : selectedRow[1] || '0000',
    };
    document.getElementById('save-area').style.display = 'flex';
    document.getElementById('save-msg').textContent = '';

    area.scrollIntoView({ behavior: 'smooth', block: 'start' });

    // AI列伝生成（非同期）― JSON形式で retsuden / cardType / pitchNicknames / awardsJa を取得
    fetchRetsudenFromAPI(selectedRow)
      .then(result => {
        updateRetsuden(result.retsuden || result);
        updateCardExtras(result.cardType || null, result.pitchNicknames || {}, result.awardsJa || [], !!result.isCareer);
      })
      .catch(err => {
        console.warn('AI列伝エラー（統計テキストで代替）:', err.message);
        // エラー内容を画面に表示（原因特定のため）
        const retEl = document.getElementById('retsuden-area');
        if (retEl) retEl.innerHTML = `<strong>【列伝】</strong> <span style="color:#ff8888">⚠️ MLB情報取得失敗: ${escapeHtml(err.message)}</span><br><span style="font-size:10px;color:#aaa">※ MLB IDが設定されているか、またはインターネット接続を確認してください</span>`;
        updateRetsudenFallback(selectedRow);
      });

  } catch (err) {
    showError('❌ カード生成エラー: ' + err.message);
    console.error(err);
  }
}

// ===== テスト用ヘルパー（開発時のみ使用） =====
window._injectTestData = function(rows, isPitcher, isCatcher, peakYear) {
  g_rows      = rows;
  g_headers   = rows.slice(0, 2);
  g_dataRows  = rows.slice(2).filter(r => r[0] != null);
  g_isPitcher = !!isPitcher;
  g_isCatcher = !!isCatcher;
  g_peakYear  = peakYear || (g_dataRows[0] && g_dataRows[0][1]);
  const yearSel = document.getElementById('year-select');
  if (yearSel && g_dataRows.length > 0) {
    yearSel.innerHTML = g_dataRows.map(r =>
      `<option value="${r[1]}">${r[1]}${r[1] == g_peakYear ? ' ★ピーク' : ''}</option>`
    ).join('');
    yearSel.value = String(g_peakYear);
  }
  document.getElementById('year-selector-section').style.display = 'block';
  clearError();
  _doGenerate(null);
};
