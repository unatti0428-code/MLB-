        isSoft:  () => _apiOpsRank === null,
        fmt: (r, soft) => soft
          ? `通算OPS${ops}はMLB歴代${r}位に匹敵する最高峰打撃力で、時代を超えた打者の格を示す数字。`
          : `通算OPS${ops}はMLB${_rankLabel(r)}の最高峰打撃力であり、時代を超えた打者の格を示す数字。` },
      { ok: games >= 500,
        getR:    () => _apiAvgRank !== null ? _apiAvgRank : _mlbCareerRank('avg', avgN),
        isSoft:  () => _apiAvgRank === null,
        fmt: (r, soft) => soft
          ? `通算打率${avg}はMLB歴代${r}位に迫る確実性で、どの時代でも首位打者級の精度を誇った。`
          : `通算打率${avg}はMLB${_rankLabel(r)}の確実性で、どの時代でも首位打者級の精度を誇った。` },
    ];
    let topRank = null, topText = null;
    for (const c of rankChecks) {
      if (!c.ok) continue;
      const r = c.getR();
      if (!r || (topRank && r >= topRank)) continue;
      topRank = r;
      topText = c.fmt(r, c.isSoft ? c.isSoft() : false);
    }
    if (topText) lines.push(topText);

    // 行4: 異名（nickname）優先 → lore → OPS補足
    if (nickH && lines.length < 5) {
      lines.push(nickH.line);
    } else if (loreH && lines.length < 5) {
      lines.push(loreH.ep);
    } else if (!topText && opsN >= 0.900 && lines.length < 5) {
      lines.push(`通算OPS${ops}はキャリアを通じて一線級打者だった証明で、対戦投手を常に苦しめ続けた。`);
    }

    // 行5-fallback: キャリアスパン・チーム経歴（行数が足りない場合に補完）
    // 通算カードでは選手の「歩み」情報を積極的に追加する
    if (lines.length < 4) {
      const seasonRows = (g_dataRows || []).filter(r => /^\d{4}$/.test(String(r[1] ?? '').trim()));
      if (seasonRows.length >= 2) {
        const y1 = seasonRows[0][1];
        const y2 = seasonRows[seasonRows.length - 1][1];
        const teamStr = g_careerTeam ? `${g_careerTeam}など` : '複数球団';
        lines.push(`${y1}〜${y2}年の${seasonRows.length}シーズンにわたるMLBキャリアを${teamStr}で戦い抜き、長きにわたって一線のグラウンドに立ち続けた。`);
      } else if (g_careerTeam) {
        lines.push(`${g_careerTeam}での活躍を中心に、その打棒でチームの勝利に貢献し続けたプロフェッショナルな野球人生を送った。`);
      }
    }

    // ── 「選手としての特徴」（Wikipedia特徴セクション）を優先挿入 ──
    // 通算カードでは特徴行を最大2行まで追加（クロージング前に挿入）
    if (g_wikiCharacteristics) {
      const charLines = _buildCharacteristicsLines(g_wikiCharacteristics, false, true);
      for (const cl of charLines) {
        if (lines.length >= 6) break;
        if (lines.some(l => l.slice(0, 12) === cl.slice(0, 12))) continue; // 重複回避
        lines.push(cl);
      }
    }

    // Wikipedia エピソード（通算カードでは常に追加を試みる・閾値ゲートを撤廃）
    // closing前に最大6行を目標とし、Wikiからエピソードを積極的に補完する
    const wikiMaxLinesH = 6;
    for (const ep of wikiEpisodes) {
      if (lines.length >= wikiMaxLinesH) break;
      if (_isWikiEpDuplicate(ep, lines, nickH)) continue;
      lines.push(ep);
    }

    // Wikiを含めてもまだ行が少ない場合の最終フォールバック（closing前に追加）
    // 通算カードでは最低closing含め5行を目標とする
    if (lines.length < 4 && !isObscure) {
      const posJaC = _getPrimaryPosJa(row);
      if (posJaC) {
        lines.push(`${posJaC}として長年にわたり高い水準のプレーを維持し、チームに安定感と勝利をもたらした信頼の存在だった。`);
      } else if (opsN >= 0.700) {
        lines.push(`長年にわたり攻守両面でチームを支え、プロフェッショナルとしての高い姿勢でファンに感動を与え続けた。`);
      }
    }

    // 最終行: 締め（常に1行）
    const closings = isObscure
      ? [
          `メジャーという夢の舞台に立ち続けた野球人生は、ファンの記憶にその名を確かに刻んでいる。`,
          `短いながらも頂点の舞台でプレーした誇りは、引退後もその野球人生を彩り続けている。`,
          `アマチュア時代の輝かしい才能を胸にメジャーへ挑んだ姿は、今なお語り継がれている。`,
        ]
      : [
          `ファンに愛され、長年チームの顔として球団史に刻まれた不朽の名選手。`,
          `誰もが認める実力でチームを牽引し続けた、球団にとって誇りある功労者。`,
          `その打撃は時代を超えて語り継がれ、後進の選手たちへの道標となり続けている。`,
        ];
    lines.push(closings[hr % closings.length]);
    return lines.join('\n');
  }

  // ── シングルシーズン ──
  // 出場試合が少ない場合は極端な評価を抑制
  const isSparsePA = games > 0 && games < 30;

  // 複数ポジション（ユーティリティ）チェック
  const posLabels = ['C','1B','2B','3B','SS','LF','CF','RF'];
  const posJa = { C:'捕手', '1B':'一塁', '2B':'二塁', '3B':'三塁', SS:'遊撃', LF:'左翼', CF:'中堅', RF:'右翼' };
  const drsInn = [];
  for (let i = 0; i < 8; i++) {
    const inn = parseFloat(row[28 + i * 2]) || 0;
    if (inn > 0) drsInn.push({ pos: posLabels[i], inn });
  }
  const maxInn = drsInn.length > 0 ? Math.max(...drsInn.map(d => d.inn)) : 0;
  const multiPosList = drsInn.filter(d => maxInn > 0 && d.inn >= maxInn * 0.4);
  const isUtility = multiPosList.length >= 2;

  const lines = [];

  // 行1：主要成績（試合数少ない場合は注記）
  const p = [];
  if (hr > 0)  p.push(`${hr}本塁打`);
  if (rbi > 0) p.push(`${rbi}打点`);
  p.push(`打率${avg}`);
  if (sb > 5)  p.push(`${sb}盗塁`);
  if (isSparsePA) {
    lines.push(`${year}年、限られた出場機会の中で${p.join('・')}・OPS${ops}という数字を残した。`);
  } else {
    lines.push(`${year}年、${p.join('・')}・OPS${ops}という成績でシーズンを戦い抜いた。`);
  }

  // 行2：受賞歴 OR 特筆成績（確実なデータのみ使用・APIリーグ順位は使わない）
  if (!isSparsePA) {
    // 捕手専用: 盗塁阻止率No.1を受賞している場合は守備特記を優先表示
    if (g_isCatcher && awardsJaSorted.some(a => a.includes('盗塁阻止率'))) {
      const csRateDisp = parseFloat(row[54]);
      const leadDisp   = parseFloat(row[53]);
      const csStr  = !isNaN(csRateDisp) ? `盗塁阻止率${csRateDisp}%` : '盗塁阻止率';
      const ldStr  = !isNaN(leadDisp)   ? `リード${leadDisp}` : '';
      const suffix = ldStr ? `${ldStr}とともに、` : '';
      lines.push(`${csStr}はリーグNo.1の鉄壁守備で走者を封じ、${suffix}投手陣の柱として攻守両面でチームを牽引した。`);
    } else if (awardsJaSorted.length > 0) {
      const _wsChamp = awardsJaSorted.some(a => a === 'ワールドシリーズ優勝');
      const _noWs    = awardsJaSorted.filter(a => a !== 'ワールドシリーズ優勝');
      const _sel     = _noWs.filter(a => _SELECTION_AWARDS.has(a));
      const _rec     = _noWs.filter(a => !_SELECTION_AWARDS.has(a));
      if (_wsChamp && _rec.length > 0) {
        lines.push(`${_rec.slice(0,2).join('・')}を受賞し、ワールドシリーズ制覇も達成した歴史的シーズン。`);
      } else if (_wsChamp && _sel.length > 0) {
        lines.push(`${_sel[0]}にも選出され、ワールドシリーズ制覇を達成した輝かしいシーズン。`);
      } else if (_wsChamp) {
        lines.push('ワールドシリーズ制覇を達成し、チームの栄光に打撃でも最大の貢献を果たした。');
      } else if (_rec.length > 0 && _sel.length > 0) {
        lines.push(`${_rec.slice(0,2).join('・')}を受賞し、${_sel[0]}にも選出されたシーズン。`);
      } else if (_sel.length > 0 && _rec.length === 0) {
        lines.push(`${_sel[0]}に選出され、両リーグを通じた最高の打者として球界全体から認められた。`);
      } else {
        lines.push(`${_rec.slice(0,3).join('・')}を受賞し、リーグ最高の打者として名を刻んだシーズン。`);
      }
    } else if (hr >= 50) {
      lines.push(`${hr}本塁打という圧倒的な長打力でリーグ全投手を震え上がらせた。`);
    } else if (opsN >= 1.10) {
      lines.push(`OPS${ops}はリーグ屈指の数字で、対戦投手が苦しめられ続けたシーズン。`);
    } else if (opsN >= 1.00) {
      lines.push(`OPS${ops}という傑出した数字で出塁と長打を高次元で両立させたシーズン。`);
    } else if (obpN >= 0.420) {
      lines.push(`出塁率${obp}の選球眼で塁上を賑わせ、得点圏での存在感は別格だった。`);
    } else if (sb >= 50) {
      lines.push(`${sb}盗塁と積極的な走塁でチームの攻撃に火をつけ、相手バッテリーを揺さぶり続けた。`);
    } else if (sb >= 30) {
      lines.push(`${sb}盗塁で相手バッテリーに的を絞らせず、攻撃のダイナモとして機能した。`);
    } else if (hr >= 40) {
      lines.push(`${hr}本塁打の長打力は相手投手の戦略を変えるほどで、本物の長距離砲として君臨した。`);
    } else if (rbi >= 120) {
      lines.push(`${rbi}打点という高い勝負強さでチームの得点源として絶対的な役割を果たした。`);
    } else if (avgN >= 0.340) {
      lines.push(`打率${avg}の確実性はリーグ随一で、どんな投手も抑えることができなかった。`);
    } else if (opsN >= 0.920) {
      lines.push(`出塁率・長打率ともにリーグ水準を大きく上回り、打線の核として機能したシーズン。`);
    }
  } else if (awardsJaSorted.length > 0) {
    const _wsChamp2 = awardsJaSorted.some(a => a === 'ワールドシリーズ優勝');
    const _noWs2    = awardsJaSorted.filter(a => a !== 'ワールドシリーズ優勝');
    const _sel2     = _noWs2.filter(a => _SELECTION_AWARDS.has(a));
    const _rec2     = _noWs2.filter(a => !_SELECTION_AWARDS.has(a));
    if (_wsChamp2 && _rec2.length > 0) {
      lines.push(`${_rec2.slice(0,2).join('・')}を受賞し、ワールドシリーズ制覇も達成した歴史的シーズン。`);
    } else if (_wsChamp2 && _sel2.length > 0) {
      lines.push(`${_sel2[0]}にも選出され、ワールドシリーズ制覇を達成した輝かしいシーズン。`);
    } else if (_wsChamp2) {
      lines.push('ワールドシリーズ制覇を達成し、チームの栄光に打撃でも最大の貢献を果たした。');
    } else if (_rec2.length > 0 && _sel2.length > 0) {
      lines.push(`${_rec2.slice(0,2).join('・')}を受賞し、${_sel2[0]}にも選出されたシーズン。`);
    } else if (_sel2.length > 0 && _rec2.length === 0) {
      lines.push(`${_sel2[0]}に選出され、両リーグを通じた最高の打者として球界全体から認められた。`);
    } else {
      lines.push(`${_rec2.slice(0,3).join('・')}を受賞し、リーグ最高の打者として名を刻んだシーズン。`);
    }
  }

  // 行3：記録・スタイル（少出場時は省略）
  if (!isSparsePA) {
    // MLB単一シーズン最多安打記録（イチロー2004：262安打）
    if (hits >= 257) {
      lines.push(`シーズン${hits}安打を記録し、ジョージ・シスラーが1920年に樹立した257安打の${hits > 257 ? 'MLB新記録を更新。84年ぶりの快挙として球史に永遠に刻まれた' : '記録に並ぶ歴史的快挙'}。`);
    } else if (hr >= 73) {
      lines.push(`マーク・マグワイアの70本塁打記録を超え、MLB史上最多のシングルシーズン本塁打記録を樹立。`);
    } else if (hr >= 62) {
      lines.push(`ロジャー・マリスの61本塁打記録を打ち破り、MLB新記録を樹立した歴史的快挙。`);
    } else if (hr >= 60) {
      lines.push(`60本塁打の大台を超え、MLB史に刻まれる歴史的な長打力を世界に示した。`);
    } else if (obpN >= 0.480) {
      lines.push(`出塁率${obp}は敬遠を選ぶほど投手が恐れた証明で、歴代最高水準の数字。`);
    } else if (sb >= 50) {
      lines.push(`${sb}盗塁と長打力を兼ね備えた史上最高クラスの5ツールプレーヤー。`);
    } else if (isUtility) {
      const posStr = multiPosList.map(d => posJa[d.pos] || d.pos).join('・');
      lines.push(`${posStr}など複数ポジションを高水準でこなすユーティリティ性も光り、守備でも首脳陣の信頼を勝ち取った。`);
    } else if (avgN >= 0.350 && hr >= 20) {
      lines.push(`高打率と長打力を高次元で両立した、現代MLBでも稀有なコンタクト型スラッガー。`);
    } else if (avgN >= 0.340) {
      lines.push(`打率${avg}は現代MLB水準では突出した数字で、相手投手を攻略し続けた証明。`);
    } else if (hr >= 40) {
      lines.push(`${hr}本塁打の破壊力は相手投手の戦略を変えるほどで、本物の長距離砲として君臨。`);
    } else if (sb >= 30 && hr >= 20) {
      lines.push(`${hr}本塁打・${sb}盗塁の30-30を達成し、パワーとスピードを高次元で両立させた。`);
    } else if (opsN >= 0.900) {
      lines.push(`コンタクトと長打力のバランスで、どんな投手にも対応できる打撃の完成度を示した。`);
    } else if (avgN >= 0.300) {
      lines.push(`打率${avg}の確実性を軸に、チャンスで勝負強さを発揮し続けた。`);
    } else if (rbi >= 100) {
      lines.push(`${rbi}打点はチームの得点力を支えた原動力であり、クラッチ力の高さが光ったシーズン。`);
    } else {
      const styleLines = [
        `打線の軸として毎打席に威圧感を放ち、相手バッテリーの配球を左右し続けた存在だった。`,
        `選球眼と打撃技術を活かし、チームの得点源として欠かせない役割を担ったシーズン。`,
        `得点圏での勝負強さとコンタクト能力で、チームの攻撃をたびたび牽引した。`,
        `粘り強い打席での集中力と走塁センスで、チームに何度も好機をもたらした。`,
      ];
      lines.push(styleLines[(hr + rbi) % styleLines.length]);
    }
  }

  // 行4：lore OR 軌跡ストーリー OR 特筆補足（lines.length < 4 のときのみ）
  // ※ nickS はwikiエピソード重複チェックでも使うため if ブロックの外で定義
  const nickS = getPlayerNickname(g_mlbNameEn);
  if (!isSparsePA && lines.length < 4) {
    const traj  = trajectory || {};
    const loreS = getPlayerLore(g_mlbNameEn);
    // ピーク年・受賞年・覚醒年は異名を優先して挿入
    const isNotableYear = traj.isPeakSeason || traj.isBreakthrough ||
      awardsJa.some(a => a.includes('MVP') || a.includes('サイ・ヤング') || a.includes('新人王') ||
                         a.includes('首位打者') || a.includes('本塁打王') || a.includes('打点王'));
    if (hr >= 60 && obpN >= 0.480) {
      lines.push(`出塁率${obp}も記録し、打者として全指標で頂点に立った歴史的シーズン。`);
    } else if (traj.isBreakthrough && traj.prevMetric != null) {
      lines.push(`前年OPS${traj.prevMetric.toFixed(3)}から大幅改善し、打撃が覚醒した転機のシーズン。`);
    } else if (traj.isImprovement && traj.prevMetric != null) {
      const diff = (traj.curMetric - traj.prevMetric).toFixed(3);
      lines.push(`前年比OPS+${diff}という急成長で、一流打者へと変貌を遂げたシーズン。`);
    } else if (traj.isPeakSeason && (traj.yearsInLeague ?? 0) > 1) {
      lines.push(`キャリアを通じてのベストシーズンであり、打者として真価を発揮した一年。`);
    } else if (sb >= 30 && hr >= 30 && !lines.some(l => l.includes('30-30'))) {
      lines.push(`30本塁打・30盗塁を同時達成し、パワーとスピードを高次元で両立させた。`);
    } else if (isNotableYear && nickS) {
      lines.push(nickS.line);
    } else if (loreS) {
      lines.push(loreS.ep);
    }
  }

  // ── 「選手としての特徴」（Wikipedia特徴セクション）を挿入 ──
  // シングルシーズンでは最大1行まで（引用は除く）
  if (g_wikiCharacteristics && lines.length < 5) {
    const charLines = _buildCharacteristicsLines(g_wikiCharacteristics, false, false);
    for (const cl of charLines) {
      if (lines.length >= 5) break;
      if (lines.some(l => l.slice(0, 12) === cl.slice(0, 12))) continue;
      lines.push(cl);
    }
  }

  // Wikipedia エピソード フォールバック（シングルシーズン）：5行未満のとき補完し最大5行まで
  // 出身地・ドラフト・契約金・有望株・背番号・人物等のエピソードを重複なく盛り込む
  if (lines.length < 5) {
    for (const ep of wikiEpisodes) {
      if (lines.length >= 5) break;
      if (_isWikiEpDuplicate(ep, lines, nickS)) continue;
      lines.push(ep);
    }
  }

  // 行6（最終）：総評
  if (!isSparsePA && (hr >= 70 || opsN >= 1.3)) {
    lines.push(`野球史上最高峰の打者の一人として、その活躍は永く語り継がれている。`);
  } else if (awardsJa.some(a => a.includes('MVP'))) {
    lines.push(`リーグ最高選手の称号を手にし、チームの核として球団史に刻まれた。`);
  } else if (isSparsePA) {
    lines.push(`限られた出場でも実力を見せつけ、次シーズンへの大きな期待を残した。`);
  } else {
    const closings = [
      `そのバットはファンに夢と興奮を与え続け、球場に何度も歓声をもたらした。`,
      `チームの勝利に貢献し続けた確かな実力と存在感は、ファンの記憶に深く刻まれた。`,
      `誰もが認めるパフォーマンスでチームを支え、球団にとって誇りある一年を刻んだ。`,
      `フィールドで発揮し続けた実力と熱さで、ファンとチームメイトの信頼を勝ち取った。`,
    ];
    lines.push(closings[(hr + sb) % closings.length]);
  }
  return lines.join('\n');
}

// ── 投手・列伝テキスト生成 ────────────────────────────────────
function buildPitcherRetsuden(row, year, awardsJa, apiSt, rankData = {}, trajectory = {}, wikiEpisodes = []) {
  const wins = parseInt(apiSt.wins           ?? row[3])  || 0;
  const loss = parseInt(apiSt.losses         ?? row[4])  || 0;
  const era  = apiSt.era    || row[5]  || '--';
  const k    = parseInt(apiSt.strikeOuts     ?? row[15]) || 0;
  const whip = apiSt.whip   || row[17] || '--';
  const ip   = parseFloat(apiSt.inningsPitched ?? row[10]) || 0;
  const sv   = parseInt(apiSt.saves          ?? 0)        || 0;
  const hld  = parseInt(apiSt.holds          ?? 0)        || 0;
  const gs   = parseInt(row[7])  || 0;
  const tg   = parseInt(row[6])  || 1;
  const isStarter = gs >= tg * 0.5;
  // 投球腕は g_pitchHand（'L'/'R'）を使用。row[57]は数値（対左補正値）のため誤り
  const hand  = (g_pitchHand === 'L') ? '左腕' : '右腕';
  const eraN  = parseFloat(era) || 99;
  const ctrl  = safeNum(row[51]) || 0;
  const strk  = safeNum(row[54]) || 0;

  // ── 通算カード判定（1シーズンで不可能な登板数・イニング数） ──
  const isCareerCard = !/^\d{4}$/.test(String(year).trim()) || tg >= 90 || ip >= 300;

  if (isCareerCard) {
    // ── 通算カード向けコメント（最大5行） ──
    const lines = [];
    const roleStr = isStarter ? '先発' : 'リリーフ';

    // 行1: 主要スタッツ要約
    const sp = [];
    if (tg   > 0) sp.push(`${tg}登板`);
    if (ip   > 0) sp.push(`${Math.floor(ip)}イニング`);
    if (wins > 0) sp.push(`${wins}勝`);
    if (sv   > 0) sp.push(`${sv}セーブ`);
    if (hld  > 0) sp.push(`${hld}ホールド`);
    lines.push(`通算${sp.join('・')}・防御率${era}を記録した、${roleStr}の柱として時代を支えた名投手。`);

    // 行2: 受賞歴 OR 主要マイルストーン
    let _eraLineAdded = false;
    if (awardsJa.length > 0) {
      lines.push(`${awardsJa.slice(0, 3).join('・')}など栄誉を手にし、MLB投手史に名を刻んだ。`);
    } else if (k >= 3000) {
      lines.push(`通算${k}奪三振はMLB史に刻まれる偉業であり、世紀の奪三振マシンとして球史に燦然と輝く。`);
    } else if (wins >= 300) {
      lines.push(`通算${wins}勝は殿堂入り投手の証であり、長年にわたってローテーションの絶対的な柱であり続けた。`);
    } else if (k >= 2000) {
      lines.push(`通算${k}奪三振を積み上げた剛腕として、時代を超えて語り継がれる存在となった。`);
    } else if (wins >= 200) {
      lines.push(`通算${wins}勝でローテーションの軸として長年チームを支え、幾多の勝利を手繰り寄せた。`);
    } else if (sv >= 300) {
      lines.push(`通算${sv}セーブはクローザーとして球史に名を刻む偉業であり、守護神の証として輝き続ける。`);
    } else if (sv >= 150) {
      lines.push(`通算${sv}セーブは一流クローザーの確固たる証であり、試合終盤に最も信頼されたリリーフエースとして君臨した。`);
    } else if (sv >= 50) {
      lines.push(`通算${sv}セーブを積み上げ、チームが勝利に最も近づいた瞬間に常にマウンドを任された信頼の守護神。`);
    } else if (!isStarter && hld >= 100) {
      lines.push(`通算${hld}ホールドはセットアッパーの鑑であり、試合の流れを変える要所で圧倒的な投球を披露し続けた。`);
    } else if (!isStarter && k >= 600) {
      lines.push(`リリーフながら通算${k}奪三振という驚異的な奪三振力で、打者に対し常に圧倒的な支配力を誇示し続けた。`);
    } else if (!isStarter && eraN < 2.80) {
      lines.push(`リリーフとして通算防御率${era}という傑出した数字を残し、どの時代でもリーグ最高クラスのリリーバーとして機能した。`);
      _eraLineAdded = true;
    }

    // 行3: 防御率段階別評価（行数に余裕がある場合・既にERA行がなければ）
    if (!_eraLineAdded && lines.length < 4) {
      if (eraN < 2.00) {
        lines.push(`通算防御率${era}は現代野球でも最高水準の驚異的な数字であり、打者にとってほぼ攻略不可能な投手として恐れられた。`);
      } else if (eraN < 2.50) {
        lines.push(`通算防御率${era}はリーグでも最高峰の傑出した精度であり、マウンドに立つたびに試合を支配する圧倒的な存在感を放った。`);
      } else if (eraN < 3.00) {
        lines.push(`通算防御率${era}という高い安定感は、キャリアを通じて常に一線級投手であり続けた確固たる証明だった。`);
      } else if (eraN < 3.50) {
        lines.push(`通算防御率${era}の安定感は打者にとって常に難攻不落の存在だった証であり、その精度は傑出していた。`);
      }
    }

    // 行4: MLB歴代順位（最も上位の記録を1件のみ・具体的な順位を明記）
    const rankChecks = [
      { cat: 'k',    val: k,    fmt: r => `通算${k}奪三振はMLB${_rankLabel(r)}の記録で、球史に残る奪三振伝説として永く語り継がれる。` },
      { cat: 'wins', val: wins, fmt: r => `通算${wins}勝はMLB${_rankLabel(r)}の金字塔であり、長年マウンドで圧倒し続けた伝説の勝ち星。` },
      { cat: 'sv',   val: sv,   fmt: r => `通算${sv}セーブはMLB${_rankLabel(r)}の不滅の記録であり、クローザーとして球史に刻まれた守護神の証。` },
    ];
    let topRank = null, topText = null;
    for (const c of rankChecks) {
      const r = _mlbCareerRank(c.cat, c.val);
      if (r && (!topRank || r < topRank)) { topRank = r; topText = c.fmt(r); }
    }
    if (topText) lines.push(topText);

    // 異名（nickname）優先 → lore → 余白があれば追加
    const nickPC = getPlayerNickname(g_mlbNameEn);
    const lorePC = getPlayerLore(g_mlbNameEn);
    if (nickPC && lines.length < 5) {
      lines.push(nickPC.line);
    } else if (lorePC && lines.length < 5) {
      lines.push(lorePC.ep);
    }

    // 代名詞球種（nickname/loreがない or まだ行数が足りない場合の補完）
    if (lines.length < 5) {
      const _pnDefsC = ['フォーシーム','スライダー','チェンジアップ','カーブ','カットボール','ツーシーム','スプリット'];
      const _hdr0c = (g_headers && g_headers[0]) ? g_headers[0] : [];
      const _pitchesC = [];
      for (let _pi = 0; _pi < 7; _pi++) {
        const _pspd  = parseFloat(row[59 + _pi * 3]);
        const _ppwr  = safeNum(row[60 + _pi * 3]) ?? 0;
        const _prate = parseFloat(row[61 + _pi * 3]) || 0;
        const _ppn   = (_hdr0c[59 + _pi * 3] != null && String(_hdr0c[59 + _pi * 3]).trim())
                       ? String(_hdr0c[59 + _pi * 3]).trim() : _pnDefsC[_pi];
        if (_prate > 0) _pitchesC.push({ name: _ppn, speed: _pspd, power: isNaN(_ppwr) ? 0 : _ppwr, rate: _prate });
      }
      _pitchesC.sort((a, b) => b.power - a.power || b.rate - a.rate);
      const _sigPitch = _pitchesC.find(p => p.power >= 80);
      if (_sigPitch && !lines.some(l => l.includes(_sigPitch.name))) {
        const _pa = _sigPitch.power >= 100 ? '球界最高水準の' : _sigPitch.power >= 90 ? '圧倒的な威力を誇る' : '強力な';
        const _spdStr = (!isNaN(_sigPitch.speed) && _sigPitch.speed >= 100) ? `（${Math.round(_sigPitch.speed)}km/h）` : '';
        lines.push(`${_pa}${_sigPitch.name}${_spdStr}を代名詞とし、その一球で試合の流れを変えるほどの圧倒的な武器として打者を封じ続けた。`);
      }
    }

    // キャリアスパン・チーム経歴フォールバック（行数が足りない場合）
    if (lines.length < 4) {
      const seasonRowsP = (g_dataRows || []).filter(r => /^\d{4}$/.test(String(r[1] ?? '').trim()));
      if (seasonRowsP.length >= 2) {
        const y1P = seasonRowsP[0][1];
        const y2P = seasonRowsP[seasonRowsP.length - 1][1];
        const teamStrP = g_careerTeam ? `${g_careerTeam}など` : '複数球団';
        lines.push(`${y1P}〜${y2P}年の${seasonRowsP.length}シーズンにわたるMLBキャリアを${teamStrP}で戦い続け、投手としての存在感を示し続けた。`);
      } else if (g_careerTeam) {
        lines.push(`${g_careerTeam}での登板を中心に、${roleStr}として長年にわたりチームの投手陣を支え続けた。`);
      }
    }

    // ── 「選手としての特徴」（Wikipedia特徴セクション）を優先挿入 ──
    if (g_wikiCharacteristics) {
      const charLines = _buildCharacteristicsLines(g_wikiCharacteristics, true, true);
      for (const cl of charLines) {
        if (lines.length >= 6) break;
        if (lines.some(l => l.slice(0, 12) === cl.slice(0, 12))) continue;
        lines.push(cl);
      }
    }

    // Wikipedia エピソード（通算カードでは常に追加を試みる・閾値ゲートを撤廃）
    // closing前に最大6行を目標とし、Wikiからエピソードを積極的に補完する
    const wikiMaxLinesP = 6;
    for (const ep of wikiEpisodes) {
      if (lines.length >= wikiMaxLinesP) break;
      if (_isWikiEpDuplicate(ep, lines, nickPC)) continue;
      lines.push(ep);
    }

    // 最終行: 締め（常に1行）
    const closings = [
      `長年にわたりマウンドに立ち続けた姿は、ファンにとって球団の象徴そのものだった。`,
      `チームの勝利を手繰り寄せ続けた投球は、後進の手本として今も語り継がれている。`,
      `その闘志と技術はチームメイトを鼓舞し、ファンに数え切れない感動をもたらした。`,
    ];
    lines.push(closings[wins % closings.length]);
    return lines.join('\n');
  }

  // ── シングルシーズン ──
  // 球種データを読み込む（row[59+i*3]=球速km/h, row[60+i*3]=球威, row[61+i*3]=使用率）
  // ※ BG列（row[58]）に回復量を追加したため全球種列が+1シフト
  // 球種名はExcelヘッダーを優先（g_headers経由）
  const _pnDefaults = ['フォーシーム','スライダー','チェンジアップ','カーブ','カットボール','ツーシーム','スプリット'];
  const _hdr0 = (g_headers && g_headers[0]) ? g_headers[0] : [];
  const pitchNames = _pnDefaults.map((def, i) => {
    const h = _hdr0[59 + i * 3];
    return (h != null && String(h).trim()) ? String(h).trim() : def;
  });
  const pitches = [];
  for (let i = 0; i < 7; i++) {
    const spd  = parseFloat(row[59 + i * 3]);
    const pwr  = safeNum(row[60 + i * 3]) ?? 0;
    const rate = parseFloat(row[61 + i * 3]) || 0;
    if (rate > 0) pitches.push({
      name:  pitchNames[i],
      speed: (!isNaN(spd) && spd >= 100 && spd <= 175) ? spd : null,  // km/hとして妥当な範囲のみ
      power: pwr,
      rate,
    });
  }
  pitches.sort((a, b) => b.rate - a.rate);
  const primaryPitch   = pitches[0] || null;
  const powerPitch     = pitches.length > 0 ? [...pitches].sort((a,b) => b.power - a.power)[0] : null;
  const hasRichArsenal = pitches.length >= 4;

  // 変化球異名マップ取得
  const nickMap = getPitchNicknames(g_mlbNameEn) || {};
  // 球種名に異名があれば「チェンジアップ（エアベンダー）」形式に変換するヘルパー
  const pName = p => nickMap[p.name] ? `${p.name}（${nickMap[p.name]}）` : p.name;

  // 球速テキスト生成ヘルパー（"152km/h"など）
  // データはkm/h単位で格納。110以上はmphではありえないのでkm/h確定。100未満は表示しない
  // ※球速は目安値のため「最速」表現は使用しない
  const spdTxt = s => (s !== null && s >= 100) ? `${Math.round(s)}km/h` : '';

  const lines = [];

  // 行1：主要成績
  const p = [];
  if (wins > 0) p.push(`${wins}勝${loss}敗`);
  p.push(`防御率${era}`);
  if (k > 0) p.push(`奪三振${k}`);
  if (sv > 0) p.push(`${sv}セーブ`);
  p.push(`WHIP${whip}`);
  const eraDesc = eraN < 2.5 ? '圧倒的な' : eraN < 3.5 ? '安定した' : '';
  lines.push(`${year}年、${p.join('・')}という${eraDesc}成績でマウンドに立ち続けた。`);

  // 行2：受賞歴 OR 特筆成績（確実なデータのみ使用・APIリーグ順位は使わない）
  {
    if (awardsJa.length > 0) {
      const _wsChampP  = awardsJa.some(a => a === 'ワールドシリーズ優勝');
      const _noWsP     = awardsJa.filter(a => a !== 'ワールドシリーズ優勝');
      // 選出型（All-MLB等）と受賞型を分離
      const _selP      = _noWsP.filter(a => _SELECTION_AWARDS.has(a));
      const _recP      = _noWsP.filter(a => !_SELECTION_AWARDS.has(a));
      const _posStr    = isStarter ? '先発' : 'リリーフ';

      if (_wsChampP && _recP.length > 0) {
        lines.push(`${_recP.slice(0,2).join('・')}を受賞し、ワールドシリーズ制覇にも貢献した歴史的シーズン。`);
      } else if (_wsChampP && _selP.length > 0) {
        lines.push(`${_selP[0]}にも選出され、ワールドシリーズ制覇を達成した輝かしいシーズン。`);
      } else if (_wsChampP) {
        lines.push(`ワールドシリーズ制覇を達成し、${_posStr}としてチームの頂点に大きく貢献した。`);
      } else if (_recP.length > 0 && _selP.length > 0) {
        lines.push(`${_recP.slice(0,2).join('・')}を受賞し、${_selP[0]}にも選出されたシーズン。`);
      } else if (_selP.length > 0 && _recP.length === 0) {
        lines.push(`${_selP[0]}に選出され、両リーグを通じた最高の${_posStr}投手として球界全体から認められた。`);
      } else {
        lines.push(`${_recP.slice(0,3).join('・')}を受賞し、リーグ最高の${_posStr}投手として認められたシーズン。`);
      }
    } else if (k >= 300) {
      lines.push(`${k}奪三振はリーグ記録に迫る歴史的数字で、打者を三振の山に沈め続けた。`);
    } else if (wins >= 25) {
      lines.push(`${wins}勝という偉業を達成し、ローテーションの頂点に君臨したシーズン。`);
    } else if (wins >= 20) {
      lines.push(`${wins}勝を達成し、ローテーションの絶対的な柱として全試合でチームに貢献した。`);
    } else if (eraN < 1.80 && ip >= 80) {
      lines.push(`防御率${era}は歴史的な低さで、登板するたびに打者を沈黙させた圧倒的なシーズン。`);
    } else if (eraN < 2.50 && ip >= 150) {
      lines.push(`防御率${era}・${Math.floor(ip)}イニングという安定感でチームを支え続けた信頼のエース。`);
    } else if (sv >= 45) {
      lines.push(`${sv}セーブという記録的な数字を打ち立て、球界最高のクローザーとして名を刻んだ。`);
    } else if (sv >= 40) {
      lines.push(`${sv}セーブを記録し、不動のクローザーとして終盤に絶対的な安心感をもたらした。`);
    } else if (sv >= 30) {
      lines.push(`${sv}セーブを積み上げ、緊張の終盤を幾度となく締めくくった守護神として君臨した。`);
    } else if (hld >= 25) {
      lines.push(`${hld}ホールドという傑出した数字でセットアッパーの頂点に立ち、勝利の方程式を担い続けた。`);
    } else if (hld >= 15 && rankData.hld?.rank <= 5) {
      lines.push(`${hld}ホールド（リーグ${rankData.hld.rank}位）でリリーフの要として終盤の主役を担ったシーズン。`);
    } else if (k >= 250) {
      lines.push(`${k}奪三振の圧倒的な三振奪取能力で、打者に対して常に優位に立ち続けた。`);
    } else if (eraN < 3.00 && wins >= 15) {
      lines.push(`防御率${era}・${wins}勝という安定した成績でローテーションの中心として機能した。`);
    } else if (ip >= 220) {
      lines.push(`${Math.floor(ip)}イニングを投げ抜くスタミナと安定感で、チームの勝利を積み上げ続けた。`);
    }
  }

  // 行3：球種・スタイル（球速付きで具体的に・数値は品質表現に変換）
  if (primaryPitch && powerPitch) {
    const sp = spdTxt(primaryPitch.speed);
    const sw = spdTxt(powerPitch.speed);
    if (primaryPitch.name !== powerPitch.name && powerPitch.power >= 85) {
      if (primaryPitch.rate >= 40) {
        lines.push(`${sp}${pName(primaryPitch)}を主軸に、${sw}${_pwrAdj(powerPitch.power)}${pName(powerPitch)}で打者を仕留めるスタイルが光った。`);
      } else {
        lines.push(`${sp}${pName(primaryPitch)}と${sw}${_pwrAdj(powerPitch.power)}${pName(powerPitch)}を組み合わせ、打者を翻弄し続けた。`);
      }
    } else if (primaryPitch.power >= 85) {
      lines.push(`${sp}${_pwrDesc(primaryPitch.power)}${pName(primaryPitch)}を主軸に、打者を力でねじ伏せた。`);
    } else if (hasRichArsenal) {
      const pitchList = pitches.slice(0, 3).map(q => `${spdTxt(q.speed)}${pName(q)}`).join('・');
      lines.push(`${pitchList}と多彩な球種で打者に球種を絞らせない完成度の高い投球スタイルが光った。`);
    } else {
      lines.push(`${sp}${pName(primaryPitch)}を軸に攻める投球で、打者を翻弄し続けた。`);
    }
  } else if (hasRichArsenal) {
    const pitchList = pitches.slice(0, 3).map(q => `${spdTxt(q.speed)}${pName(q)}`).join('・');
    lines.push(`${pitchList}と多彩な球種を操り、打者に球種を絞らせない完成度の高い投球スタイルが光った。`);
  } else if (!isStarter && (sv >= 20 || tg - gs >= 40)) {
    lines.push(`僅差の終盤に登場し試合を締める不動のクローザーとして、相手打線に恐れられた存在。`);
  } else if (ip >= 200) {
    lines.push(`${Math.floor(ip)}イニングを投げ抜くタフネスと制球・球威・緩急の三拍子が揃った万能型エース。`);
  } else if (ctrl >= 85 && strk >= 80) {
    lines.push(`制球力（${ctrl}）と奪三振能力（${strk}）を高次元で兼ね備え、あらゆる場面でゲームを支配した。`);
  } else if (ctrl >= 85) {
    lines.push(`精密な制球力（${ctrl}）で四球を出さず、打者に的を絞らせない投球でゲームを支配した。`);
  } else if (strk >= 85) {
    lines.push(`奪三振能力（${strk}）の高さで打者を圧倒し、三振の量産でチームに勢いをもたらした。`);
  } else {
    const styleLines = [
      `独自の投球術で打者のタイミングを外し続け、凡打の山を築いたシーズン。`,
      `制球と緩急を活かした頭脳的な投球で、長打を許さない安定感を発揮した。`,
      `マウンド上の冷静なゲームメイクとキャッチャーとの連携で、チームの勝利を手繰り寄せた。`,
    ];
    lines.push(styleLines[wins % styleLines.length]);
  }

  // 行4：軌跡ストーリー OR 異名 OR lore（lines.length < 4 のときのみ）
  // ※ nickPS はwikiエピソード重複チェックでも使うため if ブロックの外で定義
  const nickPS = getPlayerNickname(g_mlbNameEn);
  if (lines.length < 4) {
    const traj   = trajectory || {};
    const lorePS = getPlayerLore(g_mlbNameEn);
    // ピーク年・受賞年は異名を優先して挿入
    const isNotableYearP = traj.isPeakSeason || traj.isBreakthrough ||
      awardsJa.some(a => a.includes('サイ・ヤング') || a.includes('MVP') || a.includes('新人王') ||
                         a.includes('最優秀防御率') || a.includes('奪三振王') || a.includes('最多勝'));
    if (traj.isBreakthrough && traj.prevMetric != null) {
      lines.push(`前年防御率${traj.prevMetric.toFixed(2)}から大幅に改善し、制球力を磨き上げて覚醒した転機のシーズン。`);
    } else if (traj.isImprovement && traj.prevMetric != null) {
      const diff = (traj.prevMetric - traj.curMetric).toFixed(2);
      lines.push(`前年比ERA${diff}向上という急成長で、球界屈指のエースへと変貌を遂げたシーズン。`);
    } else if (traj.isPeakSeason && (traj.yearsInLeague ?? 0) > 1) {
      lines.push(`キャリアを通じてのベストシーズンであり、真のエースとして球界に君臨した一年。`);
    } else if (traj.isFirstYear) {
      lines.push(`メジャー${traj.yearsInLeague ? traj.yearsInLeague + '年目' : '初年度'}にして即戦力として台頭し、将来のエース候補として球界を驚かせた。`);
    } else if (isNotableYearP && nickPS) {
      lines.push(nickPS.line);
    } else if (lorePS) {
      lines.push(lorePS.ep);
    }
  }

  // ── 「選手としての特徴」（Wikipedia特徴セクション）を挿入（投手・シングルシーズン）──
  if (g_wikiCharacteristics && lines.length < 5) {
    const charLines = _buildCharacteristicsLines(g_wikiCharacteristics, true, false);
    for (const cl of charLines) {
      if (lines.length >= 5) break;
      if (lines.some(l => l.slice(0, 12) === cl.slice(0, 12))) continue;
      lines.push(cl);
    }
  }

  // Wikipedia エピソード フォールバック（シングルシーズン）：5行未満のとき補完し最大5行まで
  // 出身地・ドラフト・契約金・有望株・背番号・人物等のエピソードを重複なく盛り込む
  if (lines.length < 5) {
    for (const ep of wikiEpisodes) {
      if (lines.length >= 5) break;
      if (_isWikiEpDuplicate(ep, lines, nickPS)) continue;
      lines.push(ep);
    }
  }

  // 行6（最終）：締め
  if (awardsJa.some(a => a.includes('サイ・ヤング'))) {
    lines.push(`投手の最高栄誉サイ・ヤング賞を手にし、MLB投手史に燦然と名を刻んだ。`);
  } else if (k >= 300 || eraN < 2.0) {
    lines.push(`歴代屈指の投手としてその活躍はMLBの歴史に永く輝き続けるシーズン。`);
  } else {
    const closings = [
      `チームの大黒柱として勝利を手繰り寄せ、ファンに愛され続けたシーズン。`,
      `マウンド上の闘志と技術がチームを牽引し、勝利への確かな道筋を示し続けた。`,
      `その存在はチームにとって心強い柱であり、ファンを何度も沸かせた誇りある一年だった。`,
      `登板のたびにスタジアムを活気づけたその投球は、ファンの記憶に深く刻まれている。`,
    ];
    lines.push(closings[(wins + k) % closings.length]);
  }
  return lines.join('\n');
}

// ── MLB データから列伝全体を構築 ────────────────────────────
function buildRetsudenFromMLBData(row, mlbData, rankData = {}, trajectory = {}, wikiEpisodes = []) {
  const year     = String(row[1] || '');
  const awards   = mlbData?.awards || [];
  const apiSt    = mlbData?.stats  || {};
  const awardsJa = [...new Set(awards.map(awardToJa).filter(Boolean))];
  console.log('[MLB] 受賞（日本語）:', awardsJa);
  if (g_isPitcher) return buildPitcherRetsuden(row, year, awardsJa, apiSt, rankData, trajectory, wikiEpisodes);
  return buildHitterRetsuden(row, year, awardsJa, apiSt, rankData, trajectory, wikiEpisodes);
}

// ── Wikipedia「選手としての特徴」セクションを取得して解析 ─────────────────────

/** JA Wikipediaのセクション一覧から「選手としての特徴」等を探してwikitextを返す */
async function _fetchJaWikiCharacteristics(jaTitle) {
  try {
    // セクション一覧を取得
    const secUrl = `https://ja.wikipedia.org/w/api.php?action=parse&page=${encodeURIComponent(jaTitle)}&prop=sections&format=json&origin=*`;
    const secRes = await fetch(secUrl);
    if (!secRes.ok) return null;
    const secData = await secRes.json();
    const sections = secData?.parse?.sections || [];

    // 対象セクション名（優先順）
    const TARGET_KEYWORDS = ['選手としての特徴', 'プレースタイル', '選手の特徴', 'プレー特徴', '特徴'];
    let targetSec = null;
    for (const kw of TARGET_KEYWORDS) {
      targetSec = sections.find(s => s.line && s.line.includes(kw));
      if (targetSec) break;
    }
    if (!targetSec) {
      console.log('[Wiki特徴] 「選手としての特徴」セクションなし:', jaTitle);
      return null;
    }

    // そのセクションのwikitextを取得
    const secUrl2 = `https://ja.wikipedia.org/w/api.php?action=parse&page=${encodeURIComponent(jaTitle)}&section=${targetSec.index}&prop=wikitext&format=json&origin=*`;
    const secRes2 = await fetch(secUrl2);
    if (!secRes2.ok) return null;
    const secData2 = await secRes2.json();
    const wikitext = secData2?.parse?.wikitext?.['*'] || '';
    if (!wikitext) return null;
    console.log('[Wiki特徴] セクション取得:', targetSec.line, '/ 文字数:', wikitext.length);
    return wikitext;
  } catch(e) {
    console.warn('[Wiki特徴] 取得失敗:', e.message);
    return null;
  }
}

/** wikitextをクリーニングして特徴情報を構造化 */
function _parseJaWikiCharacteristics(wikitext, isPitcher) {
  if (!wikitext) return null;

  // wikitextを平文化
  let text = wikitext
    // ⓪ HTMLエンティティを実体文字に変換（&nbsp;等が文中に残らないよう最初に処理）
    //   例: "平均97.3&nbsp;mph" → "平均97.3 mph" → 後段で数値と単位間のスペースを除去
    .replace(/&nbsp;/gi, ' ')
    .replace(/&amp;/gi, '&')
    .replace(/&lt;/gi, '<')
    .replace(/&gt;/gi, '>')
    .replace(/&quot;/gi, '"')
    .replace(/&apos;|&#39;/gi, "'")
    .replace(/&#(\d+);/g, (_, n) => String.fromCharCode(parseInt(n, 10)))
    .replace(/&#x([0-9a-fA-F]+);/g, (_, n) => String.fromCharCode(parseInt(n, 16)))
    .replace(/ /g, ' ') // U+00A0 NBSP実体文字も通常スペースに置換
    // ① wikitextテーブルを丸ごと除去（{| ... |} の間を含む複数行テーブル）
    //   例: {| class="wikitable" ... |} （ティム・リンスカムの投球データ表など）
    .replace(/\{\|[\s\S]*?\|\}/g, '')
    // ② ファイル・画像リンクを丸ごと除去（thumb|right|年号 などが残らないよう最優先で処理）
    //   [[ファイル:○○.jpg|thumb|right|2016年|キャプション]] のような複数パイプを持つリンク
    .replace(/\[\[(?:ファイル|File|画像|Image):[^\]]*\]\]/gi, '')
    // ③ カテゴリリンクを除去
    .replace(/\[\[(?:Category|カテゴリ):[^\]]*\]\]/gi, '')
    // ④ 通常の内部リンク [[表示文字]] または [[記事名|表示文字]] → 表示文字のみ残す
    .replace(/\[\[(?:[^\]|]+\|)?([^\]|]+)\]\]/g, '$1')
    // ⑤ {{テンプレート}} を除去（3回繰り返してネストに対応）
    .replace(/\{\{[^{}]*\}\}/g, '')
    .replace(/\{\{[^{}]*\}\}/g, '')
    .replace(/\{\{[^{}]*\}\}/g, '')
    // ⑥ 強調マーク ' を除去
    .replace(/'{2,3}/g, '')
    // ⑦ <ref> タグを除去
    .replace(/<ref[^>]*\/>/g, '')
    .replace(/<ref[^>]*>[\s\S]*?<\/ref>/g, '')
    // ⑧ その他HTMLタグを除去
    .replace(/<[^>]+>/g, '')
    // ⑨ ==見出し== を除去
    .replace(/^=+[^=]+=+\s*$/gm, '')
    // ⑩ テーブル行記法の残骸（行頭の | や ! で始まる行）を除去
    .replace(/^[|!][^\n]*/gm, '')
    // ⑪ ファイルリンク除去後に残ったパラメータ残骸を除去
    //   例: "thumb|right|2016年" → 行頭や文頭に孤立して残るケースを想定
    .replace(/^(?:thumb|right|left|center|upright|frameless)\|[^\n]*/gm, '')  // 行頭残骸
    .replace(/(?:thumb|right|left|center|upright|frameless)\|\d{4}年\s*/g, '') // |2016年 形式
    // ⑫ 連続する空行を整理
    .replace(/\n{3,}/g, '\n\n')
    // ⑬ 数値と単位の間のスペースを除去（日本語表記スタイルに合わせる）
    //    例: "97.3 mph" → "97.3mph" / "165 km/h" → "165km/h"
    //    Wikipediaの "97.3&nbsp;mph" を ⓪ で "97.3 mph" にした後の最終整形
    //    ※ 誤マッチを避けるためスピード/長さ系単位のみに限定
    .replace(/(\d(?:\.\d+)?)[  ]+(mph|km\/h|km\/s|m\/s|cm|kg)\b/gi, '$1$2')
    .trim();

  const result = {
    armStrength: null,   // 強肩・送球
    framing: null,       // フレーミング
    defense: null,       // 守備全般（強肩以外）
    batting: null,       // 打撃スタイル
    pitching: null,      // 投球スタイル（投手用）
    quotes: [],          // 引用文（監督・チームメート等）
    nickname: null,      // 通称・ニックネーム（文中）
    raw: text,           // クリーン済み全文
  };

  // 文を分割（「」の中で切れないよう。！？のみで区切る。改行は段落区切りとして利用）
  // ※ 「ESPNマガジン」のように文中に」が来ても分割しない
  const rawSentences = text.split(/(?<=[。！？])|\n{2,}/).map(s => s.trim()).filter(s => s.length > 8);

  // 文末チェック：文として完結しているか（断片を除外するため）
  // 完全文: 。！？ で終わる、または引用閉じ」で終わる
  const isComplete = (s) => /[。！？」]$/.test(s);

  // 文末が不完全な場合は読み取り対象にするが、フィールド格納の際には後続と結合を試みる
  // → 実用上は「不完全文はスキップ」とする（断片の混入を防ぐ）
  const sentences = rawSentences.filter(s => isComplete(s) || s.length > 30);

  // ── 引用抽出用フィルター ─────────────────────────────────────
  // 文頭が前の文脈に依存する断片接続詞で始まる文は、単独では意味が成立しないため除外
  const _isFragmentStart = (s) =>
    /^(?:その際[、。]|その時[、。]|それ(?:を見て|により|によって|に対し|を聞いて|を受けて)|この(?:とき|際|後)[、。]|ここで[、。]|そこで[、。]|このため[、。]|これ(?:に対し|を受けて|により)|ところが[、。]|しかし[、。]|だが[、。]|なお[、。]|ただし[、。])/.test(s);

  // 引用「」内のテキストが選手の能力を否定・矮小化する内容でないかチェック
  const _isNegativeQuote = (quoteText) =>
    /ならみんなできる|でもできる|にすぎない|に過ぎない|大したことは?ない|程度のもの|できない|ではない|じゃない|たいしたことない/.test(quoteText);

  for (const s of sentences) {
    // 断片チェック：文末が不完全かつ短い（30字未満）はスキップ
    if (!isComplete(s) && s.length <= 30) continue;

    // 強肩・送球
    if (!result.armStrength && /強肩|ロケット|Rocket|送球(?:力|速度|距離)|矢のような|肩の強さ/.test(s)) {
      result.armStrength = s;
    }
    // フレーミング（キャッチャー特有）
    if (!result.framing && /フレーミング|framing|ミットを動かさず|体を動か|ストライク(?:に変え|として|判定)|ボール球をストライク/.test(s)) {
      result.framing = s;
    }
    // 守備全般（強肩・フレーミング以外）
    // ※ 断片文・文脈依存文は除外
    if (!result.defense && !_isFragmentStart(s)
        && /守備|リード|配球|ブロッキング|ゴールドグラブ|ワイルドピッチ防止|捕球/.test(s)
        && !(result.armStrength && result.armStrength.includes(s.slice(0,8)))
        && !(result.framing    && result.framing.includes(s.slice(0,8)))) {
      result.defense = s;
    }
    // 打撃（野手用）
    // ※ 断片文・文脈依存文は除外
    if (!result.batting && !isPitcher && !_isFragmentStart(s)
        && /打撃|スイング|バッティング|打法|打率|コンタクト|パワー|長打/.test(s)) {
      result.batting = s;
    }
    // 投球（投手用）
    // ※ 断片文・文脈依存文は除外
    if (!result.pitching && isPitcher && !_isFragmentStart(s)
        && /球種|球速|フォーム|投法|スライダー|フォーク|カーブ|チェンジアップ|速球|制球/.test(s)) {
      result.pitching = s;
    }
    // 引用（「〜」と語る / と評する 等）
    // ※「～」が文中に含まれ、かつ「と語った」等で終わる完全文のみ採用
    // ※ 前の文脈に依存する断片文（「その際」「それを見て」等で始まる文）は除外
    // ※ 引用内容が選手を否定・矮小化するものは除外
    if (result.quotes.length < 3
        && /「[^」]{10,}」/.test(s)
        && /と語|と述べ|と話|とコメント|と評|と称|と言/.test(s)
        && isComplete(s)
        && !_isFragmentStart(s)) {
      const quoteText = (s.match(/「([^」]+)」/g) || [])
        .map(m => m.slice(1, -1)).join('');
      if (!_isNegativeQuote(quoteText)) {
        result.quotes.push(s);
      }
    }
    // ニックネーム（「〜と呼ばれ」「〜の異名」等）
    if (!result.nickname && /と呼ばれ|と称され|の異名|ニックネーム|愛称/.test(s)) {
      result.nickname = s;
    }
  }

  // 有効なフィールドがひとつも取れなければnullを返す
  const hasAny = result.armStrength || result.framing || result.defense
               || result.batting || result.pitching || result.quotes.length || result.nickname;
  if (!hasAny) return null;

  console.log('[Wiki特徴] 解析結果:', {
    armStrength: !!result.armStrength,
    framing: !!result.framing,
    defense: !!result.defense,
    batting: !!result.batting,
    pitching: !!result.pitching,
    quotes: result.quotes.length,
    nickname: !!result.nickname,
  });
  return result;
}

/**
 * 「選手としての特徴」の構造化データから列伝に追加すべき行を生成する
 * @param {object} chars  _parseJaWikiCharacteristics() の返り値
 * @param {boolean} isPitcher
 * @param {boolean} isCareer  通算カードかどうか（単年との比率調整用）
 * @returns {string[]}  追加すべき文字列の配列（最大3行）
 */
function _buildCharacteristicsLines(chars, isPitcher, isCareer) {
  if (!chars) return [];
  const lines = [];

  /**
   * 文を適切な長さに収めてから重複チェックしてpush。
   * 優先順位: ① 250字以内なら全文使用（Wikipedia文は1文が長いため）
   *           ② 250字超の場合は最後の「。」で切る
   *           ③ 「。」が見つからなければ最後の「、」で切る（150字前後）
   *           ④ それも見つからなければ200字で強制カット
   */
  const _push = (text) => {
    if (!text) return;
    let t = text;
    if (t.length > 250) {
      // 250字以内の最後の「。」で切る
      const dotIdx = t.lastIndexOf('。', 250);
      if (dotIdx > 20) {
        t = t.slice(0, dotIdx + 1);
      } else {
        // 「。」がなければ150字以内の最後の「、」で切る
        const commaIdx = t.lastIndexOf('、', 150);
        t = commaIdx > 20 ? t.slice(0, commaIdx) + '…' : t.slice(0, 200) + '…';
      }
    }
    if (lines.some(l => l.slice(0, 12) === t.slice(0, 12))) return;
    lines.push(t);
  };

  // --- 優先順位: ニックネーム > 強肩 > フレーミング > 守備 > 打撃/投球 > 引用 ---

  // ① ニックネームがある場合（「ロケットランチャー」等）
  if (chars.nickname && lines.length < 2) _push(chars.nickname);

  // ② 強肩（ニックネームと内容が重複しなければ）
  if (chars.armStrength && lines.length < 2) _push(chars.armStrength);

  // ③ フレーミング（捕手）
  if (chars.framing && lines.length < 2) _push(chars.framing);

  // ④ 守備 or 投球/打撃スタイル
  const styleText = isPitcher ? chars.pitching : chars.batting;
  const defOrStyle = chars.defense || styleText;
  if (defOrStyle && lines.length < 2) _push(defOrStyle);

  // ⑤ 引用（チームメート・監督コメント） — 通算カードでは最大1件、単年は0件
  if (isCareer && lines.length < 3) {
    for (const q of chars.quotes) {
      if (lines.length >= 3) break;
      let qt = q;
      if (qt.length > 250) {
        // 250字以内の最後の「。」または「」で切る
        const dotIdx   = qt.lastIndexOf('。', 250);
        const quoteIdx = qt.lastIndexOf('」', 250);
        const cutAt = Math.max(dotIdx, quoteIdx);
        qt = cutAt > 20 ? qt.slice(0, cutAt + 1) : qt.slice(0, 200) + '…';
      }
      if (!lines.some(l => l.slice(0, 12) === qt.slice(0, 12))) {
        lines.push(qt);
        break; // 引用は最大1件
      }
    }
  }

  return lines;
}

// ── Wikipedia からエピソードを取得（列伝フォールバック・通算／通常年共通） ─────
async function fetchWikipediaEpisodes(playerNameEn, isPitcher) {
  g_wikiCharacteristics = null; // 前回の特徴情報をリセット
  if (!playerNameEn) return [];
  try {
    // ── Step 0: "(baseball)" 限定タイトルを先に試みる（同名異人のdisambig回避）──
    // 例: "Michael Young" → "Michael Young (baseball)" で正しい選手ページを取得
    const _enFetch = async (titleStr) => {
      const r = await fetch(`https://en.wikipedia.org/w/api.php?action=query&prop=extracts&exsentences=30&explaintext=true&format=json&origin=*&titles=${encodeURIComponent(titleStr)}`);
      if (!r.ok) return null;
      const d = await r.json();
      const p = Object.values(d?.query?.pages || {})[0];
      // missing / disambig（"may refer to" を含む）は無効とする
      if (!p || p.missing !== undefined || !p.extract) return null;
      if (/may refer to:|may also refer to:|disambiguation/i.test(p.extract.slice(0, 300))) return null;
      // 野球に無関係な記事は無効（先頭300文字で判定）
      if (!/baseball|pitcher|outfield|infield|shortstop|catcher|batter|MLB|major league/i.test(p.extract.slice(0, 600))) return null;
      return p.extract;
    };

    let enExtract = await _enFetch(`${playerNameEn.trim()} (baseball)`);
    if (enExtract) {
      console.log('[Wikipedia] EN (baseball) タイトルで取得成功:', enExtract.length, '文字');
    } else {
      // "(baseball)" で取れない場合は通常タイトルでも試みる
      enExtract = await _enFetch(playerNameEn.trim());
      if (enExtract) console.log('[Wikipedia] EN 通常タイトルで取得成功:', enExtract.length, '文字');
    }

    // ── Step 1: 英語Wikipediaを解析 ──
    let enEpisodes = [];
    let jaTitle = null;
    if (enExtract) {
      console.log('[Wikipedia] EN テキスト先頭500字:', enExtract.slice(0, 500));
      enEpisodes = _parseWikiEpisodes(enExtract, isPitcher, false);
      if (enEpisodes.length) {
        console.log('[Wikipedia] EN エピソード取得:', enEpisodes.length, '件:', enEpisodes);
        // EN エピソードがあっても JA「特徴」セクション取得を並行実施
        jaTitle = await _wikidataJaTitle(playerNameEn);
        if (jaTitle) {
          const charWikitext = await _fetchJaWikiCharacteristics(jaTitle);
          g_wikiCharacteristics = _parseJaWikiCharacteristics(charWikitext, isPitcher);
        }
        return enEpisodes;
      }
      console.log('[Wikipedia] EN 記事あり・エピソード0件 → JA Wikiを試みます');
    } else {
      console.log('[Wikipedia] EN 記事なし → JA Wikiを試みます');
    }

    // ── Step 2: Wikidata経由でJA-Wikipedia記事タイトルを特定（1件ずつ確認） ──
    jaTitle = jaTitle || await _wikidataJaTitle(playerNameEn);
    if (!jaTitle) {
      console.log('[Wikipedia] JA 記事タイトル特定不可 → スキップ');
      return [];
    }

    // ── Step 3: 日本語Wikipedia 記事本文取得 ＋「選手としての特徴」セクション取得（並行）──
    const [jaRes, charWikitext] = await Promise.all([
      fetch(`https://ja.wikipedia.org/w/api.php?action=query&prop=extracts&exsentences=30&explaintext=true&format=json&origin=*&titles=${encodeURIComponent(jaTitle)}`),
      _fetchJaWikiCharacteristics(jaTitle),
    ]);

    // 特徴セクションを解析して保存
    g_wikiCharacteristics = _parseJaWikiCharacteristics(charWikitext, isPitcher);

    if (!jaRes.ok) return [];
    const jaData  = await jaRes.json();
    const jaPages = jaData?.query?.pages || {};
    const jaPage  = Object.values(jaPages)[0];
    if (!jaPage || jaPage.missing !== undefined || !jaPage.extract) return [];

    const jaExtract = jaPage.extract;
    console.log('[Wikipedia] JA 取得文字数:', jaExtract.length, '記事:', jaTitle);
    const jaEpisodes = _parseWikiEpisodes(jaExtract, isPitcher, true);
    if (jaEpisodes.length) console.log('[Wikipedia] JA エピソード取得:', jaEpisodes.length, '件:', jaEpisodes);
    return jaEpisodes;

  } catch(e) {
    console.warn('[Wikipedia] 取得失敗:', e.message);
    return [];
  }
}

/** Wikidata経由で選手の日本語Wikipedia記事タイトルを取得（| を使わず1件ずつ照会） */
async function _wikidataJaTitle(playerNameEn) {
  try {
    // Wikidataで英語名を検索（最大8件取得）
    const wdUrl = `https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(playerNameEn)}&language=en&type=item&format=json&origin=*&limit=8`;
    const wdRes = await fetch(wdUrl);
    if (!wdRes.ok) return null;
    const wdData = await wdRes.json();
    const hits   = wdData?.search || [];
    if (!hits.length) { console.log('[Wikidata] 検索結果なし'); return null; }

    // 野球選手に関連するdescriptionを持つhitを優先ソート
    // （"baseball player", "MLB", "pitcher" 等を含むものを上位に）
    const _isBaseballHit = (h) =>
      /baseball|MLB|pitcher|outfield|infield|shortstop|catcher|野球/i.test(
        (h.description || '') + ' ' + (h.label || '')
      );
    const sortedHits = [...hits.slice(0, 8)].sort((a, b) =>
      (_isBaseballHit(b) ? 1 : 0) - (_isBaseballHit(a) ? 1 : 0)
    );
    console.log('[Wikidata] ヒット:', sortedHits.slice(0, 4).map(h => `${h.id}(${h.description || ''})`).join(', '));

    // 野球選手優先で最大5件を照会
    for (const hit of sortedHits.slice(0, 5)) {
      const id   = hit.id;
      const slUrl = `https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${id}&props=sitelinks&sitefilter=jawiki&format=json&origin=*`;
      const slRes = await fetch(slUrl);
      if (!slRes.ok) continue;
      const slData = await slRes.json();
      const jaT = slData?.entities?.[id]?.sitelinks?.jawiki?.title;
      if (jaT) {
        console.log('[Wikidata] JA記事タイトル特定:', jaT, '(', id, hit.description || '', ')');
        return jaT;
      }
    }
    console.log('[Wikidata] JA sitelinkなし');
    return null;
  } catch(e) {
    console.warn('[Wikidata] 検索失敗:', e.message);
    return null;
  }
}

// ── 日本語Wikipedia テキスト解析 ─────────────────────────────────
function _parseJaWikiEpisodes(text, isPitcher) {
  if (!text) return [];
  const results = [];
  // 「。」「！」「？」で文を分割
  const sentences = text.split(/[。！？]/).filter(s => s.trim().length > 6);

  for (const s of sentences) {

    // 出身地（「○○州○○で生まれた」「○○市出身」など）
    const birthJaM = s.match(/([゠-ヿ一-鿿a-zA-Z]{2,20}(?:州|市|町|村)[゠-ヿ一-鿿a-zA-Z]{0,15})(?:で|に)生まれ/)
      || s.match(/([゠-ヿ一-鿿]{2,20}(?:州|市|町|村))(?:の|出身)/);
    if (birthJaM && !results.some(r => r.includes('出身') || r.includes('生まれ'))) {
      results.push(`${birthJaM[1].trim()}出身。地元で磨いた野球センスがプロの世界で確かに開花した。`);
      continue;
    }

    // 高校時代のオールアメリカン・全米選抜
    if (/高校|高校野球|高校時代/.test(s) && /オールアメリカン|All-USA|全米/.test(s)) {
      if (!results.some(r => r.includes('高校') || r.includes('全米'))) {
        const isUsa = /USAトゥデイ|All-USA|オールUSA/i.test(s);
        results.push(isUsa
          ? '高校時代にUSAトゥデイ全米オールUSAチームに選出されるほどの逸材として、各球団のスカウトから熱い視線を浴びていた。'
          : '高校時代に全米オールアメリカンチームに選ばれる傑出した才能の持ち主として、プロスカウトの強い注目を集めた。');
        continue;
      }
    }

    // 複数スポーツ選手→野球を選択
    if (/フットボール|バスケットボール/.test(s) && /入学意向書|進学|大学|大学.*野球/.test(s)) {
      if (!results.some(r => r.includes('フットボール') || r.includes('バスケ') || r.includes('野球を選'))) {
        // テキサスA&M大学のように英数字混じりの大学名も取得できるよう拡張
        const univM = s.match(/([゠-ヿa-zA-Z&]{2,25}(?:大学|カレッジ))/);
        const univ  = univM ? univM[1] : '大学';
        const sport = /フットボール/.test(s) ? 'フットボール' : 'バスケットボール';
        results.push(`${univ}への${sport}の誘いを断って野球の道を選んだ経歴は、身体能力の高さと野球への強い信念を物語る。`);
        continue;
      }
    }

    // ドラフト全体指名順位
    const draftJaM = s.match(/全体(\d+)位/);
    if (draftJaM && /ドラフト|指名/.test(s) && !results.some(r => r.includes('ドラフト') || r.includes('全体'))) {
      const pick  = draftJaM[1];
      const yr    = (s.match(/(\d{4})年/) || [])[1];
      // チーム名: 全カタカナ範囲（゠-ヿ）で球団名を抽出
      const teamM = s.match(/([゠-ヿ]{3,15})(?:から|に(?:より)?指名)/);
      const team  = teamM ? teamM[1] : null;
      if (yr && team) {
        results.push(`${yr}年ドラフトで${team}から全体${pick}位という高評価で指名を受け、メジャーへの扉を開いた。`);
      } else if (yr) {
        results.push(`${yr}年ドラフト全体${pick}位という高順位での指名は、当時から球界が将来の大物と見込んでいた証。`);
      } else {
        results.push(`ドラフト全体${pick}位という高評価での指名は、アマチュア時代の傑出した才能が広く認められていた証。`);
      }
      continue;
    }

    // 契約金（「○百万ドルの契約金」）
    const bonusJaM = s.match(/(\d+(?:[.,]\d+)?)(?:百万|万)ドル(?:の契約金|の契約ボーナス)?/);
    if (bonusJaM && !results.some(r => r.includes('契約金') || r.includes('ボーナス'))) {
      const raw = bonusJaM[0];
      results.push(`ドラフト指名時に${raw}が提示されたことは、球団がいかにその将来性を高く評価していたかを示していた。`);
      continue;
    }

    // Baseball America 有望株ランキング
    const prospJaM = s.match(/(?:ベースボール・アメリカ|Baseball America)[^\d。]*(\d+)位/)
      || s.match(/有望株(?:ランキング|ランク)[^\d。]*(\d+)位/)
      || s.match(/(\d+)位[^\d。]*(?:有望株|ランク)/);
    if (prospJaM && !results.some(r => r.includes('有望株') || r.includes('プロスペクト') || r.includes('ランク'))) {
      const rankN = prospJaM[1];
      results.push(`Baseball Americaの有望株ランキングで${rankN}位に輝くなど、将来のスター候補として球界の期待を一身に集めた。`);
      continue;
    }

    // トレード・移籍
    if (!isPitcher || true) {
      const tradeJaM = s.match(/(\d{4})年.*?([ァ-ヶー]{3,15})(?:へ|に)(?:トレード|移籍)/);
      if (tradeJaM && !results.some(r => r.includes('移籍') || r.includes('トレード'))) {
        results.push(`${tradeJaM[1]}年に${tradeJaM[2]}へ移籍し、新天地でも変わらぬ実力を発揮して活躍を続けた。`);
        continue;
      }
    }

  }

  // ── 汎用サルベージ：パターン抽出で3件未満の場合、記事本文から自然な日本語文を補完 ──
  // 日本語Wikipediaの文はそのまま列伝に使える品質のため、
  // 「単独で意味が通る・野球的に意味のある・適度な長さの」文を選んで追加する。
  if (results.length < 3) {
    const KEYWORDS = /記録|達成|受賞|史上|初の|最年少|最年長|最多|最速|リーグ|球団|契約|メジャー|デビュー|昇格|ワールドシリーズ|オールスター|プレーオフ|ポストシーズン|本塁打|安打|盗塁|打点|奪三振|完封|完投|セーブ|ホールド|防御率|打率|タイトル|殿堂|代表|WBC|二刀流|評価|期待|注目|看板|エース|主砲|正捕手|遊撃手|外野手|先発|抑え|クローザー/;
    for (const s of sentences) {
      if (results.length >= 4) break;
      const t = s.trim();
      // 単独で意味が通る文のみ採用するためのフィルター群
      if (t.length < 25 || t.length > 110) continue;                       // 短すぎ・長すぎは除外
      if (!KEYWORDS.test(t)) continue;                                     // 野球的に意味のある文のみ
      if (/^(また|なお|ただし|一方|さらに|そして|それ|これ|その後|この|同年|同月|翌年|翌\d|当時|ここで|そこで|だが|しかし|ところが)/.test(t)) continue; // 文脈依存の文頭は除外
      if (/^[0-9０-９]/.test(t) === false && /(である|だった|となった|となる|した|している|抜擢|指名|記録|受賞|達成|呼ばれ|称され|活躍|貢献|登板|出場)/.test(t) === false) continue; // 述語のない断片を除外
      if (/出身|生まれ/.test(t)) continue;                                  // 出身行はAPI由来の行と重複するため除外
      if (results.some(r => r.slice(0, 10) === t.slice(0, 10))) continue;  // 重複除外
      results.push(t.endsWith('。') ? t : t + '。');
      console.log('[WikiJA] サルベージ採用:', t.slice(0, 30) + '…');
    }
  }

  return results;
}

 * @param {string} engName  英語表記（例: "Florida State", "Kwansei Gakuin"）
 * @returns {string|null}  日本語正式名 または null

  if (!engName) return null;
  const raw     = engName.trim();

  // 例: "Florida State" / "Florida State University" → "フロリダ州立大学"
  const ssM = rawL.match(/^([a-z ]+?)\s+state(?:\s+(?:university|college|u)\b)?$/);
  if (ssM) {
    const sk = ssM[1].trim();
    const entry = Object.entries(_STATE_JA_MAP).find(([k]) => k.toLowerCase() === sk);
    if (entry) return entry[1] + '立大学'; // "フロリダ州" + "立大学" = "フロリダ州立大学"
  }

/** 英語単語のシンプルなカタカナ近似変換（都市名フォールバック用） */
function _engWordToKana(word) {
  if (!word) return word;
  // スペース・ハイフン区切りで分割して各パーツを変換
  const parts = word.trim().split(/[\s\-]+/);
  if (parts.length > 1) return parts.map(_engWordToKana).join('');

  const s = parts[0].toLowerCase();

  // 単語全体のよく出るパターン（地名・大学名頻出語を含む）
  const FULL = {
    'new':'ニュー','old':'オールド','north':'ノース','south':'サウス',
    'east':'イースト','west':'ウェスト','fort':'フォート','lake':'レイク',
    'park':'パーク','city':'シティ','beach':'ビーチ','island':'アイランド',
    'river':'リバー','creek':'クリーク','valley':'バレー','grove':'グローブ',
    'falls':'フォールズ','rapids':'ラピッズ','heights':'ハイツ',
    'hills':'ヒルズ','point':'ポイント','springs':'スプリングス',
    'view':'ビュー','ridge':'リッジ','wood':'ウッド','field':'フィールド',
    'port':'ポート','saint':'セント','st':'セント','san':'サン','santa':'サンタ',
    'los':'ロス','las':'ラス',
    // 大学・カレッジ名でよく出る固有名詞
    'mohawk':'モホーク','cayuga':'カユーガ','onondaga':'オノンダガ',
    'allegany':'アレゲニー','chemung':'ケムング','genesee':'ジェネシー',
    'finger':'フィンガー','lakes':'レイクス','monroe':'モンロー',
    'nassau':'ナッソー','suffolk':'サフォーク','rockland':'ロックランド',
    'westchester':'ウェストチェスター','dutchess':'ダッチェス',
    'orange':'オレンジ','columbia':'コロンビア','glendale':'グレンデール',
    'citrus':'シトラス','cypress':'サイプレス','golden':'ゴールデン',
    'west':'ウェスト','mount':'マウント','san':'サン','del':'デル',
    'rio':'リオ','cerro':'セロ','palomar':'パロマー','grossmont':'グロスモント',
    'miramar':'ミラマー','southwestern':'サウスウェスタン',
    'saddleback':'サドルバック','irvine':'アーバイン','fullerton':'フラートン',
    'chaffey':'チャフィー','victor':'ビクター','antelope':'アンテロープ',
    'modesto':'モデスト','merced':'マーセド','reedley':'リードリー',
    'porterville':'ポーターヴィル','bakersfield':'ベーカーズフィールド',
    'cuesta':'クエスタ','allan hancock':'アラン・ハンコック',
    'ventura':'ベンチュラ','oxnard':'オックスナード','moorpark':'ムーアパーク',
    'santa':'サンタ','barbara':'バーバラ','rosa':'ローザ',
    'diablo':'ディアブロ','contra':'コントラ','costa':'コスタ',
    'chabot':'シャボット','laney':'レイニー','merritt':'メリット',
    'skyline':'スカイライン','college':'カレッジ',
  };
  if (FULL[s]) return FULL[s];

  // 末尾パターンを先にハンドル
  const SUFFIX = [
    [/ington$/, 'イントン'], [/ington$/, 'イントン'], [/ington$/, 'イントン'],
    [/ville$/, 'ビル'], [/burg$/, 'バーグ'], [/berg$/, 'バーグ'],
    [/field$/, 'フィールド'], [/ford$/, 'フォード'], [/port$/, 'ポート'],
    [/wood$/, 'ウッド'], [/land$/, 'ランド'], [/ridge$/, 'リッジ'],
    [/ton$/, 'トン'], [/son$/, 'ソン'], [/tion$/, 'ション'],
    [/ster$/, 'スター'], [/sley$/, 'スリー'], [/ney$/, 'ニー'],
    [/ley$/, 'リー'], [/ry$/, 'リー'], [/ey$/, 'イー'],
  ];
  for (const [re, kana] of SUFFIX) {
    if (re.test(s)) {
      const prefix = s.replace(re, '');
      if (prefix.length >= 2) return _engWordToKana(prefix) + kana;
    }
  }

  // 文字ごとの変換テーブル
  const C_V = {
    b:['バ','ビ','ブ','ベ','ボ'], c:['カ','キ','ク','ケ','コ'],
    d:['ダ','ディ','ドゥ','デ','ド'], f:['ファ','フィ','フ','フェ','フォ'],
    g:['ガ','ギ','グ','ゲ','ゴ'], h:['ハ','ヒ','フ','ヘ','ホ'],
    j:['ジャ','ジ','ジュ','ジェ','ジョ'], k:['カ','キ','ク','ケ','コ'],
    l:['ラ','リ','ル','レ','ロ'], m:['マ','ミ','ム','メ','モ'],
    n:['ナ','ニ','ヌ','ネ','ノ'], p:['パ','ピ','プ','ペ','ポ'],
    r:['ラ','リ','ル','レ','ロ'], s:['サ','シ','ス','セ','ソ'],
    t:['タ','ティ','テュ','テ','ト'], v:['バ','ビ','ブ','ベ','ボ'],
    w:['ワ','ウィ','ウ','ウェ','ウォ'], x:['クス','クス','クス','クス','クス'],
    y:['ヤ','イ','ユ','イェ','ヨ'], z:['ザ','ジ','ズ','ゼ','ゾ'],
  };
  const VI = {a:0,i:1,u:2,e:3,o:4};
  let result = '';
  let i = 0;
  while (i < s.length) {
    const ch  = s[i];
    const ch2 = s.slice(i, i+2);
    const ch3 = s.slice(i, i+3);
    // 2文字母音
    if (ch2==='ee'||ch2==='ea') { result+='イー'; i+=2; continue; }
    if (ch2==='oo') { result+='ウー'; i+=2; continue; }
    if (ch2==='ai'||ch2==='ay') { result+='エイ'; i+=2; continue; }
    if (ch2==='au'||ch2==='aw') { result+='オー'; i+=2; continue; }
    if (ch2==='ou'||ch2==='ow') { result+='オウ'; i+=2; continue; }
    if (ch2==='oi'||ch2==='oy') { result+='オイ'; i+=2; continue; }
    if (ch2==='ie') { result+='イー'; i+=2; continue; }
    if (ch2==='ur'||ch2==='er') { result+='アー'; i+=2; continue; }
    // 子音クラスタ
    if (ch3==='tch') { result+='チ'; i+=3; continue; }
    if (ch2==='ch') { const v=s[i+2]; result+=(v&&VI[v]!==undefined)?['チャ','チ','チュ','チェ','チョ'][VI[v]]:'チ'; i+=v&&VI[v]!==undefined?3:2; continue; }
    if (ch2==='sh') { const v=s[i+2]; result+=(v&&VI[v]!==undefined)?['シャ','シ','シュ','シェ','ショ'][VI[v]]:'シュ'; i+=v&&VI[v]!==undefined?3:2; continue; }
    if (ch2==='th') { result+='ス'; i+=2; continue; }
    if (ch2==='ph') { const v=s[i+2]; result+=(v&&VI[v]!==undefined)?C_V.f[VI[v]]:'フ'; i+=v&&VI[v]!==undefined?3:2; continue; }
    if (ch2==='wh') { const v=s[i+2]; result+=(v&&VI[v]!==undefined)?C_V.w[VI[v]]:'ウ'; i+=v&&VI[v]!==undefined?3:2; continue; }
    if (ch2==='ng') { result+='ング'; i+=2; continue; }
    if (ch2==='nk') { result+='ンク'; i+=2; continue; }
    if (ch2==='ck') { result+='ック'; i+=2; continue; }
    if (ch2==='gh') { i+=2; continue; } // silent
    if ('bcdfghjklmnpqrstvwxyz'.includes(ch) && ch===s[i+1]) { i++; continue; } // double cons → skip first
    // 子音＋母音
    if (C_V[ch] && VI[s[i+1]]!==undefined) { result+=C_V[ch][VI[s[i+1]]]; i+=2; continue; }
    // 単独母音
    if (VI[ch]!==undefined) { result+=['ア','イ','ウ','エ','オ'][VI[ch]]; i++; continue; }
    // 末尾 e（サイレント）
    if (ch==='e' && i===s.length-1) { i++; continue; }
    // 残余子音
    if (C_V[ch]) { result+=C_V[ch][2]; i++; continue; } // fallback to 'u' vowel
    i++;
  }
  return result || null;
}

function _parseWikiEpisodes(text, isPitcher, isJapanese = false) {
  if (!text) return [];
